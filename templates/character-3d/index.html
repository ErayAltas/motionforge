<!doctype html>
<!--
  motionforge template: character-3d — a stylised 3D presenter at a desk, built entirely from code
  © 2026 motionforge contributors, MIT

  What it draws: a big-headed character (primitives, rounded and lightly faceted shapes, soft
  materials) behind a desk with keyboard, mug, lamp and plant, in a warm dim room with fake
  bokeh. It blinks (seeded 2-5 s), breathes, sways, nods on emphasis, follows expression and
  gesture cues, and opens its mouth from a per-frame curve.

  Parameters (full list with defaults in params.json, values in <script id="params"> below):
    preset        creator | teacher | chef | coach | analyst | custom  (one word picks a look)
    character     overrides: skin, hair, hairColor, brows, eyes, eyeColor, nose, beard, glasses,
                  outfit, outfitColor, outfitColor2, build, headphones, hat, hatColor, blush ...
    framing       close | medium | wide          layout   full | lower-card (bottom ~45 % card)
    expression    start expression               gesture  default hands: rest | typing | explain
    cues          [{t, expression?, gesture?, duration?, look?, emphasis?}] in scene seconds
    mouthCurve    "mouth.json" (or the JSON object pasted here); "" = seeded talking pattern
    mouthOffset   voice-over second at which this scene starts; talk: auto | off
    eyebrow / title / caption   2D overlay slots (GSAP); palette, wallColor, lightColor, accentColor

  Frame contract (HyperFrames): the 3D layer has no clock. The module script draws one frame per
  seek: window.addEventListener("hf-seek", e => draw(e.detail.time)), plus draw(0) at load.
  Everything moving is a pure function of t (seeded randomness only, no Math.random, no rAF).
  The 2D overlay is a paused GSAP timeline registered as window.__timelines["main"].

  Plugging in a voice-over:
    1. python3 tools/mouth_curve.py voice.mp3 -o scenes/<name>/mouth.json --fps 30
    2. set "mouthCurve": "mouth.json" (and "mouthOffset" if the scene starts mid-voice-over)
    3. put the audio in the composition as a clip, e.g. inside #root:
         <audio id="voice" src="voice.mp3" data-start="0" data-duration="6" data-track-index="9" data-volume="1"></audio>
       or keep the voice-over in the final edit (Remotion / ffmpeg) and render this scene silent.
    mouth.json is read with a synchronous request when the page loads, so it must sit next to
    index.html and be served by `npx hyperframes preview|render` (file:// pages cannot read it;
    paste the JSON object into "mouthCurve" in that case).

  three.js 0.170.0 (MIT) is copied from npm into assets/vendor/ (new-scene.sh does it for
  templates that reference three.module.min.js; by hand:
  cp node_modules/three/build/three.module.min.js assets/vendor/). Never from a CDN.
-->
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/mf-runtime.js"></script>
    <link rel="stylesheet" href="assets/base.css" />
    <script type="importmap">{ "imports": { "three": "./assets/vendor/three.module.min.js", "three/addons/": "./assets/vendor/three-addons/" } }</script>
    <style>
      #card { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; }
      #card canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      #card .grain { position: absolute; inset: 0; background-image: var(--mf-grain); opacity: 0.09; mix-blend-mode: overlay; pointer-events: none; }
      #card .vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 46%, transparent 55%, rgba(0, 0, 0, 0.5) 100%); }
      #card .scrim { position: absolute; left: 0; right: 0; pointer-events: none; }
      #card .scrim.top { top: 0; height: 640px; background: linear-gradient(180deg, rgba(4, 10, 11, 0.72) 0%, rgba(4, 10, 11, 0.35) 55%, transparent 100%); }
      #card .scrim.bottom { bottom: 0; height: 520px; background: linear-gradient(0deg, rgba(4, 8, 9, 0.7) 0%, transparent 100%); }
      .lower-card #card {
        left: 36px; top: 1020px; width: 1008px; height: 864px;
        border-radius: 44px; border: 2px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 30px 90px rgba(0, 0, 0, 0.5);
      }
      .lower-card #card .scrim { display: none; }
      #eyebrow { top: 214px; }
      #title { top: 268px; font-size: 104px; text-shadow: 0 6px 40px rgba(0, 0, 0, 0.45); }
      #caption {
        position: absolute; left: 90px; right: 90px; bottom: 210px; text-align: center;
        font: 700 52px/1.22 var(--mf-font-display); letter-spacing: -0.015em; text-shadow: 0 4px 24px rgba(0, 0, 0, 0.6);
      }
      .lower-card #eyebrow { top: 330px; }
      .lower-card #title { top: 392px; font-size: 128px; text-shadow: none; }
      .lower-card #caption { top: 760px; bottom: auto; color: var(--mf-muted); font-weight: 500; font-size: 46px; text-shadow: none; }
    </style>
  </head>
  <body>
    <div id="root" class="mf-stage" data-composition-id="main" data-start="0" data-duration="6" data-width="1080" data-height="1920">
      <div id="card" class="clip" data-start="0" data-duration="6" data-track-index="0">
        <canvas id="gl" width="1080" height="1920"></canvas>
        <div class="vignette"></div>
        <div class="scrim top"></div>
        <div class="scrim bottom"></div>
        <div class="grain"></div>
      </div>
      <div id="eyebrow" class="eyebrow clip" data-start="0" data-duration="6" data-track-index="1"></div>
      <div id="title" class="title clip" data-start="0" data-duration="6" data-track-index="2"></div>
      <div id="caption" class="clip" data-start="0" data-duration="6" data-track-index="3"></div>
      <!-- voice-over (optional): <audio id="voice" src="voice.mp3" data-start="0" data-duration="6" data-track-index="9" data-volume="1"></audio> -->
    </div>

    <script id="params" type="application/json">
{
  "preset": "creator",
  "character": {},
  "framing": "medium",
  "layout": "full",
  "subjectY": 0.6,
  "pushIn": 0.08,
  "drift": 1,
  "expression": "smile",
  "gesture": "explain",
  "cues": [
    {"t": 0.2, "gesture": "wave", "duration": 1.8},
    {"t": 2.9, "expression": "thinking", "gesture": "chin", "duration": 1.1},
    {"t": 4.0, "expression": "surprised"},
    {"t": 4.45, "expression": "smile", "gesture": "point", "duration": 1.6}
  ],
  "mouthCurve": "",
  "mouthOffset": 0,
  "talk": "auto",
  "autoEmphasis": true,
  "seed": "mf-character",
  "palette": "teal-amber",
  "wallColor": "",
  "lightColor": "",
  "accentColor": "#c8f53a",
  "props": {"keyboard": true, "mug": true, "lamp": true, "plant": true, "notebook": true},
  "eyebrow": "Example — replace",
  "title": "Your topic here",
  "caption": "",
  "titleStart": 0.3,
  "theme": "dark",
  "exposure": 1.05,
  "shadows": true,
  "lang": "en",
  "duration": 6
}
    </script>

    <script>
      // ---------- parameters, presets, mouth curve, 2D overlay (classic script: runs first) ----------
      (function () {
        const P = MF.params();
        const DUR = P.duration || 6;
        document.documentElement.lang = P.lang || "en";
        const root = document.getElementById("root");
        if (P.layout === "lower-card") root.classList.add("lower-card");
        if (P.theme === "light") root.classList.add("light");

        const SKIN = { light: "#f3d2bb", fair: "#eec3a3", medium: "#d8a07a", tan: "#c68a62", brown: "#9a6444", deep: "#6e432c" };
        const HAIR = { black: "#17120f", darkbrown: "#2e1f17", brown: "#5a3a26", auburn: "#7a3a22", ginger: "#b5592c", blonde: "#d8b47a", grey: "#9a958f", white: "#e4e0da" };
        const BASE = {
          skin: "medium", hair: "messy", hairColor: "darkbrown", brows: "soft", eyes: "round", eyeColor: "#4a3020",
          nose: "button", beard: "none", beardColor: "", glasses: "none", glassesColor: "#1d1f22",
          outfit: "tshirt", outfitColor: "#2f6f73", outfitColor2: "#f1ebe2", build: "average",
          headphones: false, headphonesColor: "#202327", hat: "none", hatColor: "#2b3a4a", blush: true,
        };
        const PRESETS = {
          creator: { skin: "tan", hair: "messy", hairColor: "darkbrown", brows: "soft", eyes: "round", nose: "button", beard: "stubble",
                     outfit: "hoodie", outfitColor: "#e0733c", outfitColor2: "#f3e7d6", headphones: true },
          teacher: { skin: "fair", hair: "sidepart", hairColor: "grey", brows: "thick", eyes: "almond", eyeColor: "#3d5a6b", nose: "round",
                     beard: "moustache", glasses: "round", glassesColor: "#6b4a2e", outfit: "jacket", outfitColor: "#7d5838", outfitColor2: "#e9e4d8" },
          chef:    { skin: "deep", hair: "buzz", hairColor: "black", brows: "thick", eyes: "round", eyeColor: "#2a1a12", nose: "round", beard: "full",
                     outfit: "shirt", outfitColor: "#f2efe8", outfitColor2: "#c8432f", hat: "toque", hatColor: "#f6f4ef", build: "broad", blush: false },
          coach:   { skin: "medium", hair: "curly", hairColor: "black", brows: "thick", eyes: "almond", eyeColor: "#3a2416", nose: "long",
                     outfit: "tshirt", outfitColor: "#ef6351", outfitColor2: "#ffffff", hat: "cap", hatColor: "#24415e", build: "broad", blush: false },
          analyst: { skin: "light", hair: "bun", hairColor: "auburn", brows: "arched", eyes: "almond", eyeColor: "#4f6b3a", nose: "pointed",
                     glasses: "square", glassesColor: "#22262b", outfit: "jacket", outfitColor: "#22385a", outfitColor2: "#f4f1ea", build: "slim" },
        };
        const C = Object.assign({}, BASE, PRESETS[P.preset] || {}, P.character || {});
        C.skin = SKIN[C.skin] || C.skin;
        C.hairColor = HAIR[C.hairColor] || C.hairColor;
        C.beardColor = HAIR[C.beardColor] || C.beardColor || C.hairColor;

        // mouth curve: {fps, open[], shape[]} from tools/mouth_curve.py, a path to it, or nothing
        function loadCurve(src) {
          if (!src) return null;
          if (typeof src === "object") return src;
          try {
            const req = new XMLHttpRequest();
            req.open("GET", src, false); // synchronous on purpose: the curve must exist before frame 0
            req.send();
            if (req.status === 200 || (req.status === 0 && req.responseText)) return JSON.parse(req.responseText);
            console.error("character-3d: could not load " + src + " (HTTP " + req.status + "); using the seeded pattern");
          } catch (err) {
            console.error("character-3d: could not load " + src + ": " + err.message + "; using the seeded pattern");
          }
          return null;
        }
        let curve = P.talk === "off" ? null : loadCurve(P.mouthCurve);
        if (curve && !Array.isArray(curve.open)) { console.error("character-3d: mouth curve has no \"open\" array"); curve = null; }

        // seeded talking pattern for previews: phrases of syllables with pauses in between
        function talkPattern(seed, duration, fps) {
          const r = MF.rng(seed + ":talk");
          const n = Math.ceil(duration * fps) + 1;
          const open = new Array(n).fill(0), shape = new Array(n).fill("closed");
          const kinds = ["open", "open", "open", "wide", "wide", "round"];
          let t = 0.35;
          while (t < duration) {
            const phraseEnd = t + r.range(1.2, 2.8);
            while (t < phraseEnd && t < duration) {
              const len = r.range(0.13, 0.26), amp = r.range(0.45, 1), kind = r.pick(kinds);
              const i0 = Math.floor(t * fps), i1 = Math.ceil((t + len) * fps);
              for (let i = i0; i <= i1 && i < n; i++) {
                const x = (i / fps - t) / len;
                if (x < 0 || x > 1) continue;
                const v = amp * Math.sin(Math.PI * x);
                if (v > open[i]) { open[i] = v; shape[i] = v > 0.08 ? kind : "closed"; }
              }
              t += len * r.range(0.85, 1.1);
            }
            t += r.range(0.25, 0.6);
          }
          return { fps, open, shape, seeded: true };
        }
        if (!curve && P.talk !== "off") curve = talkPattern(String(P.seed), DUR + (P.mouthOffset || 0) + 1, 30);

        window.__character = { P, C, curve, DUR };

        // ---------- 2D overlay ----------
        const eyebrow = document.getElementById("eyebrow"), title = document.getElementById("title"), caption = document.getElementById("caption");
        eyebrow.textContent = P.eyebrow || "";
        title.textContent = P.title || "";
        caption.textContent = P.caption || "";
        const tl = MF.timeline("main", DUR);
        window.__timelines["main"] = tl; // MF.timeline already registers it; spelled out for the HyperFrames linter
        const t0 = P.titleStart ?? 0.3;
        // the card is visible from frame 0 (safe to cut into); it settles with a small scale-in
        if (P.layout === "lower-card") tl.fromTo("#card", { scale: 0.96 }, { scale: 1, duration: 0.6, ease: "power3.out" }, 0);
        if (P.eyebrow) tl.fromTo(eyebrow, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, t0);
        if (P.title) tl.fromTo(title, { opacity: 0, y: 40, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.45, ease: "power3.out" }, t0 + 0.08);
        if (P.caption) tl.fromTo(caption, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, t0 + 0.5);
        MF.ready().then(() => { if (P.title) MF.fit(title, P.layout === "lower-card" ? 128 : 104, 56, P.layout === "lower-card" ? 330 : 260); });
        MF.fit(title, P.layout === "lower-card" ? 128 : 104, 56, P.layout === "lower-card" ? 330 : 260);
        tl.seek(0);
      })();
    </script>

    <script type="module">
      import * as THREE from "three";

      const { P, C, curve, DUR } = window.__character;
      const V3 = THREE.Vector3;
      const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
      const lerp = (a, b, k) => a + (b - a) * k;
      const smooth = (x) => { x = clamp(x); return x * x * (3 - 2 * x); };
      const TAU = Math.PI * 2;
      const UP = new V3(0, 1, 0);
      const seed = String(P.seed);
      const rngOf = (tag) => window.MF.rng(seed + ":" + tag);

      // ---------- palette ----------
      const PALETTES = {
        "teal-amber": { wall: "#123a3c", wallDeep: "#071a1c", light: "#ffb562", cool: "#6fd3cf" },
        "charcoal-amber": { wall: "#26272a", wallDeep: "#0d0e10", light: "#ffb05a", cool: "#8ec5d6" },
        "forest-amber": { wall: "#183526", wallDeep: "#08160f", light: "#ffba66", cool: "#8fd6a8" },
      };
      const PAL = Object.assign({}, PALETTES[P.palette] || PALETTES["teal-amber"]);
      if (P.wallColor) PAL.wall = P.wallColor;
      if (P.lightColor) PAL.light = P.lightColor;
      const ACCENT = P.accentColor || "#c8f53a";
      const PROPS = Object.assign({ keyboard: true, mug: true, lamp: true, plant: true, notebook: true }, P.props || {});

      // ---------- renderer ----------
      const canvas = document.getElementById("gl");
      const card = document.getElementById("card");
      const CW = P.layout === "lower-card" ? 1008 : 1080;
      const CH = P.layout === "lower-card" ? 864 : 1920;
      canvas.width = CW; canvas.height = CH;
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1);
      renderer.setSize(CW, CH, false);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = P.exposure ?? 1.05;
      renderer.shadowMap.enabled = P.shadows !== false;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(PAL.wallDeep);
      const camera = new THREE.PerspectiveCamera(28, CW / CH, 0.05, 40);

      // ---------- materials and small geometry helpers ----------
      const col = (c) => new THREE.Color(c);
      const std = (color, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color, roughness: 0.6, metalness: 0 }, o));
      const fabric = (color, o = {}) => new THREE.MeshPhysicalMaterial(Object.assign({
        color, roughness: 0.82, sheen: 1, sheenRoughness: 0.55, sheenColor: col(color).lerp(col("#ffffff"), 0.35),
      }, o));
      const skinMat = new THREE.MeshPhysicalMaterial({
        color: C.skin, roughness: 0.5, sheen: 0.6, sheenRoughness: 0.5, sheenColor: col(C.skin).lerp(col("#ff8f6b"), 0.55),
      });
      const skinDark = new THREE.MeshPhysicalMaterial({ color: col(C.skin).multiplyScalar(0.86), roughness: 0.55, sheen: 0.4, sheenColor: col("#ff8f6b") });
      const hairMat = (flat) => new THREE.MeshPhysicalMaterial({
        color: C.hairColor, roughness: 0.62, sheen: 0.8, sheenRoughness: 0.35, sheenColor: col(C.hairColor).lerp(col("#ffe2b8"), 0.45), flatShading: !!flat,
        side: THREE.DoubleSide,
      });

      function mesh(geo, mat, parent, o = {}) {
        const m = new THREE.Mesh(geo, mat);
        if (o.p) m.position.set(o.p[0], o.p[1], o.p[2]);
        if (o.r) m.rotation.set(o.r[0], o.r[1], o.r[2]);
        if (o.s) (Array.isArray(o.s) ? m.scale.set(o.s[0], o.s[1], o.s[2]) : m.scale.setScalar(o.s));
        m.castShadow = o.cast !== false;
        m.receiveShadow = !!o.receive;
        if (parent) parent.add(m);
        return m;
      }
      const sphere = (r = 1, w = 32, h = 20) => new THREE.SphereGeometry(r, w, h);
      const facet = (r = 1, detail = 1) => new THREE.IcosahedronGeometry(r, detail);

      // Rounded box: a cube-sphere split into 8 corner octants pushed apart (odd segment count keeps a seam-free middle strip).
      function roundedBox(w, h, d, r, seg = 3) {
        r = Math.min(r, w / 2 - 1e-4, h / 2 - 1e-4, d / 2 - 1e-4);
        const n = seg * 2 + 1;
        const g = new THREE.BoxGeometry(1, 1, 1, n, n, n);
        const pos = g.attributes.position, nor = g.attributes.normal;
        const v = new V3(), c = new V3();
        const ix = w / 2 - r, iy = h / 2 - r, iz = d / 2 - r;
        for (let i = 0; i < pos.count; i++) {
          v.fromBufferAttribute(pos, i);
          c.set(Math.sign(v.x) * ix, Math.sign(v.y) * iy, Math.sign(v.z) * iz);
          v.normalize();
          nor.setXYZ(i, v.x, v.y, v.z);
          v.multiplyScalar(r).add(c);
          pos.setXYZ(i, v.x, v.y, v.z);
        }
        return g;
      }
      // Limb: unit-length open cylinder along +Y (scaled per frame between two joints).
      function limbGeo(r0, r1, radial = 18) { const g = new THREE.CylinderGeometry(r1, r0, 1, radial, 1, true); g.translate(0, 0.5, 0); return g; }
      function placeLimb(m, a, b) {
        const d = new V3().subVectors(b, a); const len = Math.max(1e-4, d.length());
        m.position.copy(a); m.quaternion.setFromUnitVectors(UP, d.multiplyScalar(1 / len)); m.scale.set(1, len, 1);
      }
      function canvasTex(w, h, paint) {
        const c = document.createElement("canvas"); c.width = w; c.height = h;
        paint(c.getContext("2d"), w, h);
        const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
        return t;
      }

      // =====================================================================
      // CHARACTER
      // =====================================================================
      const BUILD = { slim: 0.9, average: 1, broad: 1.14 }[C.build] || 1;
      const TORSO_Z = -0.62;
      const SHOULDER = { x: 0.245 * BUILD, y: 0.33 };
      const HEAD = { rx: 0.3, ry: 0.305, rz: 0.285 };
      const HEAD_Y = 0.255; // head centre above the neck pivot

      // Head surface: an ellipsoid with fuller cheeks and a slightly narrower chin. Features are placed with it.
      function headK(d) {
        const cheek = Math.exp(-((d.y + 0.36) ** 2) / 0.045) * Math.min(1, Math.abs(d.x) * 1.7) * clamp(d.z + 0.35);
        const chin = d.y < -0.55 ? -0.07 * (-d.y - 0.55) / 0.45 * (1 - Math.abs(d.x)) : 0;
        const crown = d.y > 0.3 ? 0.03 * (d.y - 0.3) : 0;
        return 1 + 0.075 * cheek + chin + crown;
      }
      function headSurf(d, out = new V3()) {
        const r = 1 / Math.sqrt((d.x / HEAD.rx) ** 2 + (d.y / HEAD.ry) ** 2 + (d.z / HEAD.rz) ** 2);
        return out.copy(d).multiplyScalar(r * headK(d));
      }
      const faceDir = (x, y) => new V3(x, y, 1).normalize(); // x, y on a plane in front of the face
      function conform(geo, scale = 1, jitter = 0, r = null) {
        const pos = geo.attributes.position, v = new V3(), s = new V3();
        for (let i = 0; i < pos.count; i++) {
          v.fromBufferAttribute(pos, i).normalize();
          headSurf(v, s).multiplyScalar(scale + (jitter && r ? r.range(-jitter, jitter) : 0));
          pos.setXYZ(i, s.x, s.y, s.z);
        }
        geo.computeVertexNormals();
        return geo;
      }
      // Shell over part of the head, by azimuth a (0 = front) and elevation e (radians).
      function headShell(a0, a1, e0, e1, nA, nE, scale, eTop, alphaFn, skipFn) {
        const pos = [], idx = [], cols = [], v = new V3();
        for (let j = 0; j <= nE; j++) {
          for (let i = 0; i <= nA; i++) {
            const a = lerp(a0, a1, i / nA);
            const top = eTop ? eTop(a) : e1;
            const e = lerp(e0, top, j / nE);
            const d = new V3(Math.sin(a) * Math.cos(e), Math.sin(e), Math.cos(a) * Math.cos(e));
            headSurf(d, v).multiplyScalar(scale);
            pos.push(v.x, v.y, v.z);
            if (alphaFn) cols.push(1, 1, 1, alphaFn(i / nA, j / nE));
          }
        }
        for (let j = 0; j < nE; j++) for (let i = 0; i < nA; i++) {
          const k = j * (nA + 1) + i;
          if (skipFn) { // leave a hole where skipFn(direction of the quad centre) is true
            const q = new V3(pos[k * 3] + pos[(k + nA + 2) * 3], pos[k * 3 + 1] + pos[(k + nA + 2) * 3 + 1], pos[k * 3 + 2] + pos[(k + nA + 2) * 3 + 2]).normalize();
            if (skipFn(q)) continue;
          }
          idx.push(k, k + 1, k + nA + 1, k + 1, k + nA + 2, k + nA + 1);
        }
        const g = new THREE.BufferGeometry();
        g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
        if (alphaFn) g.setAttribute("color", new THREE.Float32BufferAttribute(cols, 4));
        g.setIndex(idx); g.computeVertexNormals();
        return g;
      }

      const character = new THREE.Group();
      scene.add(character);
      const body = new THREE.Group(); // sways and breathes; head and shoulders ride on it
      body.position.set(0, 0, TORSO_Z);
      character.add(body);

      // ---- torso (lathe profile, elliptical cross-section) ----
      const TORSO_PROFILE = [[0.001, -0.75], [0.25, -0.75], [0.262, -0.4], [0.27, -0.05], [0.272, 0.16], [0.262, 0.26], [0.232, 0.33], [0.18, 0.375], [0.11, 0.4], [0.06, 0.41], [0.001, 0.41]];

      const torsoGeo = new THREE.LatheGeometry(new THREE.SplineCurve(TORSO_PROFILE.map(([r, y]) => new THREE.Vector2(r, y))).getPoints(40), 40);

      // ---- outfit details ----

        const hood = mesh(new THREE.TorusGeometry(0.16, 0.055, 14, 36), outfitMat, body, { p: [0, 0.405, -0.05], r: [Math.PI / 2 - 0.45, 0, 0], s: [BUILD * 1.05, 0.95, 0.85] });
        hood.receiveShadow = true;
        const cordMat = std(C.outfitColor2, { roughness: 0.7 });
        for (const s of [-1, 1]) {
          const x = s * 0.055, yTop = 0.36, yBot = 0.17;

        }
      } else if (C.outfit === "tshirt") {

      } else if (C.outfit === "shirt") {
        const collarMat = fabric(col(C.outfitColor).lerp(col("#ffffff"), 0.15));
        for (const s of [-1, 1]) {

          mesh(roundedBox(0.05, 0.14, 0.02, 0.009), outfit2Mat, body, { p: [s * 0.015, 0.33, chestZ(0.33) + 0.01], r: [0.25, 0, s * 0.25] }); // neckerchief / tie-like trim
        }
        const btn = std("#e9e3d8", { roughness: 0.35 });
        for (const y of [0.24, 0.13, 0.02]) mesh(sphere(0.011, 12, 8), btn, body, { p: [0, y, chestZ(y) + 0.004], s: [1, 1, 0.5] });
      } else if (C.outfit === "jacket") {

        mesh(new THREE.TorusGeometry(0.08, 0.013, 10, 30), outfit2Mat, body, { p: [0, 0.392, 0.01], r: [Math.PI / 2 + 0.25, 0, 0] });
        const lapelMat = fabric(col(C.outfitColor).multiplyScalar(0.85));
        for (const s of [-1, 1]) {
          const y = 0.27, x = s * 0.075 * BUILD;
          mesh(roundedBox(0.075, 0.27, 0.02, 0.009), lapelMat, body, { p: [x, y, chestZ(y, x) + 0.004], r: [0.2, s * 0.32, s * 0.36] });

      // ---- head ----
      const neckPivot = new THREE.Group(); neckPivot.position.set(0, 0.5, 0.02); body.add(neckPivot);

      // ears

      // eyes
      const EYE_STYLE = {
        round:  { r: 0.072, open: -0.62, low: 0.95, iris: 0.62, lash: 0.0 },
        almond: { r: 0.066, open: -0.36, low: 0.62, iris: 0.66, lash: 1.0 },

        // eyelids: hemispheres that rotate around the eye's X axis

        if (ES.lash > 0 || C.eyes !== "dot") {

          if (ES.lash > 0.5) { // a small flick at the outer corner

          }
        }

        mesh(new THREE.SphereGeometry(ES.r * 1.075, 36, 12, 0, TAU, Math.PI / 2, Math.PI / 2), skinMat, lower, { cast: false });
        eyes.push({ s, g, gaze, upper, lower });
      }

      // brows
      const BROW = { soft: [0.085, 0.02, 0.06], thick: [0.092, 0.03, 0.04], thin: [0.08, 0.012, 0.07], arched: [0.08, 0.016, 0.13] }[C.brows] || [0.085, 0.02, 0.06];
      const browMat = std(col(C.hairColor).multiplyScalar(C.hair === "bald" ? 0.7 : 1), { roughness: 0.75 });
      const brows = [];
      for (const s of [-1, 1]) {
        const [bw, bh, arch] = BROW;
        const geo = new THREE.SphereGeometry(1, 28, 12);
        const pos = geo.attributes.position, v = new V3();
        for (let i = 0; i < pos.count; i++) {
          v.fromBufferAttribute(pos, i);
          const u = v.x; // -1..1 along the brow, +1 = outer end for s=+1
          const outer = (u * s + 1) / 2;

        const d = faceDir(s * 0.36, 0.33);
        const pivot = new THREE.Group();
        pivot.position.copy(headSurf(d)).addScaledVector(d, 0.006);
        pivot.lookAt(pivot.position.clone().add(d));

      }

      // nose
      const NOSE = { button: [0.04, 0.034, 0.036, 0], round: [0.054, 0.045, 0.045, 0], long: [0.036, 0.06, 0.05, -0.2], pointed: [0.032, 0.04, 0.06, 0.15] }[C.nose] || [0.04, 0.034, 0.036, 0];
      {
        const d = faceDir(0, -0.2);
        const p = headSurf(d).addScaledVector(d, NOSE[2] * 0.15);
        mesh(sphere(1, 28, 20), skinMat, head, { p: [p.x, p.y, p.z], s: [NOSE[0], NOSE[1], NOSE[2]], r: [NOSE[3], 0, 0] });
        for (const s of [-1, 1]) mesh(sphere(1, 16, 10), skinMat, head, { p: [p.x + s * NOSE[0] * 0.75, p.y - NOSE[1] * 0.25, p.z - NOSE[2] * 0.25], s: [NOSE[0] * 0.45, NOSE[1] * 0.5, NOSE[2] * 0.5] });
      }

      // blush
      if (C.blush) {
        const blushMat = new THREE.MeshBasicMaterial({ color: "#ff7f73", transparent: true, opacity: 0.16, depthWrite: false });
        for (const s of [-1, 1]) {
          const d = faceDir(s * 0.56, -0.27);
          const b = mesh(sphere(1, 20, 12), blushMat, head, { cast: false, s: [0.055, 0.032, 0.006] });
          b.position.copy(headSurf(d)).addScaledVector(d, 0.003); b.lookAt(b.position.clone().add(d));
        }
      }

      // ---- mouth: a grid laid on the face, rebuilt every frame from open / width / smile / shape ----
      const MOUTH_Y = -0.45, MC = 27, MR = 9;
      const beardFull = C.beard === "full";

      mouthGeo.setAttribute("position", new THREE.Float32BufferAttribute(new Float32Array(MC * MR * 3), 3));
      mouthGeo.setAttribute("color", new THREE.Float32BufferAttribute(new Float32Array(MC * MR * 3), 3));
      {
        const idx = [];
        for (let j = 0; j < MR - 1; j++) for (let i = 0; i < MC - 1; i++) {
          const k = j * MC + i;
          idx.push(k, k + MC, k + 1, k + 1, k + MC, k + MC + 1);
        }
        mouthGeo.setIndex(idx);
      }
      const mouthMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.55, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2, side: THREE.DoubleSide });
      const mouth = mesh(mouthGeo, mouthMat, head, { cast: false });
      const MC_INSIDE = col("#2a0d10"), MC_LINE = col(C.skin).multiplyScalar(0.42).lerp(col("#5a1e1e"), 0.5), MC_TEETH = col("#f4efe8"), MC_TONGUE = col("#c75a5f"), MC_LIP = col(C.skin).multiplyScalar(0.62).lerp(col("#a2463f"), 0.45);
      const tmpC = new THREE.Color(), tmpV = new V3(), tmpD = new V3();
      function updateMouth(open, wide, round, smile, skew) {
        const pos = mouthGeo.attributes.position.array, colr = mouthGeo.attributes.color.array;
        const halfW = 0.2 * (1 + 0.16 * wide - 0.34 * round + 0.1 * Math.max(0, smile)) * (1 - 0.12 * open * round);
        const hOpen = open * 0.27 * (1 + 0.3 * round);
        const show = smooth((open - 0.06) / 0.18);
        for (let i = 0; i < MC; i++) {
          const u = (i / (MC - 1)) * 2 - 1;
          const env = Math.pow(Math.max(0, 1 - u * u), 0.55 + 0.3 * round);
          const bow = smile * 0.075 * (u * u) - (smile < 0 ? 0 : 0.012 * smile);
          const line = 0.011 + 0.006 * (1 - Math.abs(u));

          const yBot = bow + skew * u * 0.03 - hOpen * 0.78 * env - line * 0.5 * env - 0.004 * env;

            tmpD.set(px, py, 1).normalize();
            headSurf(tmpD, tmpV).addScaledVector(tmpD, MOUTH_OFF);
            const k = (j * MC + i) * 3;
            pos[k] = tmpV.x; pos[k + 1] = tmpV.y; pos[k + 2] = tmpV.z;
            // colours: teeth on top, tongue at the bottom, dark inside, lip tone at the rim
            tmpC.copy(MC_INSIDE);
            if (v < 0.3 && Math.abs(u) < 0.8) tmpC.lerp(MC_TEETH, show * smooth((0.3 - v) / 0.12) * smooth((0.8 - Math.abs(u)) / 0.2));

      }

      // ---- hair ----
      const hr = rngOf("hair");
      function hairCap(thetaLen, tilt, thick, flat, jitter = 0) {
        const geo = new THREE.SphereGeometry(1, flat ? 30 : 56, flat ? 16 : 28, 0, TAU, 0, thetaLen).rotateY(-Math.PI / 2).rotateX(-tilt);
        conform(geo, 1 + thick, jitter, hr);
        return mesh(geo, hairMat(flat), head, { receive: false });
      }
      function tuft(d, size, stretch, mat, lean = 0.4) {
        const q = new THREE.Quaternion().setFromUnitVectors(UP, d);
        const m = mesh(facet(1, 0), mat, head);
        m.position.copy(headSurf(d)).multiplyScalar(1.0);
        m.quaternion.copy(q);
        m.rotateX(lean);
        m.rotateY(hr.range(0, TAU));
        m.scale.set(size, size * stretch, size * 0.9);
        return m;
      }
      const sph = (az, el) => new V3(Math.sin(az) * Math.cos(el), Math.sin(el), Math.cos(az) * Math.cos(el));
      const hatOn = C.hat === "cap" || C.hat === "beanie" || C.hat === "toque";
      const underHat = (el) => hatOn && el > 0.5; // pieces a hat would cover are skipped
      if (C.hair !== "bald") {

        if (C.hair === "messy") {
          hairCap(1.4, 0.42, 0.05, true, 0.01);
          for (let i = 0; i < 18; i++) { // swept shards over the crown, leaning back

            m.scale.z *= 0.6; m.rotateZ(-0.35); m.position.multiplyScalar(1.03);
          }
        } else if (C.hair === "sidepart") {
          hairCap(1.42, 0.4, 0.04, false);
          if (!hatOn) {
          const sw = mesh(sphere(1, 36, 20), hairMat(false), head, { s: [0.2, 0.055, 0.14] });
          sw.position.copy(headSurf(sph(0.3, 0.98))).multiplyScalar(1.035); sw.rotation.set(-0.55, 0.2, -0.3);
          const sw2 = mesh(sphere(1, 30, 18), hairMat(false), head, { s: [0.12, 0.045, 0.11] });
          sw2.position.copy(headSurf(sph(-0.55, 1.0))).multiplyScalar(1.03); sw2.rotation.set(-0.6, -0.2, 0.3);
          const part = mesh(new THREE.CylinderGeometry(0.004, 0.004, 0.16, 6), std(col(C.hairColor).multiplyScalar(0.5)), head, { cast: false });

          }

          mesh(new THREE.TorusGeometry(0.075, 0.016, 10, 28), std(ACCENT, { roughness: 0.5 }), head, { p: [bunP.x, bunP.y - 0.065, bunP.z + 0.01], r: [Math.PI / 2 - 0.4, 0, 0] });
          }
          for (const s of [-1, 1]) { // loose strands at the temples
            const st = mesh(sphere(1, 16, 12), hairMat(false), head, { s: [0.016, 0.1, 0.022] });
            st.position.copy(headSurf(sph(s * 1.05, 0.12))).multiplyScalar(1.02); st.rotation.set(0.1, 0, s * 0.18);
          }
        } else if (C.hair === "buzz") {
          const cap = hairCap(1.45, 0.4, 0.012, false);
          cap.material.color.copy(col(C.hairColor).lerp(col(C.skin), 0.22)); cap.material.roughness = 0.95; cap.material.sheen = 0.2;
        } else if (C.hair === "curly") {

            m.position.copy(headSurf(d)).multiplyScalar(1.07); m.rotation.set(hr.range(0, 3), hr.range(0, 3), 0);
          }
        } else if (C.hair === "long") {
          hairCap(1.48, 0.34, 0.03, false);
          const curtain = new THREE.CylinderGeometry(0.31, 0.27, 0.56, 36, 6, true, Math.PI / 2 + 0.35, Math.PI - 0.7);
          mesh(curtain, hairMat(false), head, { p: [0, -0.2, -0.04], s: [1.05, 1, 0.95] });
          for (const s of [-1, 1]) mesh(sphere(1, 20, 14), hairMat(false), head, { p: [s * 0.27, -0.28, 0.04], s: [0.06, 0.25, 0.07], r: [0.1, 0, s * 0.1] });
        }
      }

      // ---- beard ----
      if (C.beard === "stubble") {
        // soft-edged shadow of hair along the jaw: alpha fades out towards the cheeks and the sides
        const g = headShell(-1.5, 1.5, -1.45, -0.36, 40, 16, 1.004, (a) => -0.4 + 0.12 * Math.min(1, Math.abs(a) / 1.3),
          (u, v) => smooth((1 - v) / 0.55) * smooth((0.5 - Math.abs(u - 0.5)) / 0.22));
        mesh(g, new THREE.MeshStandardMaterial({ color: C.beardColor, vertexColors: true, roughness: 0.95, transparent: true, opacity: 0.38, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -1 }), head, { cast: false });
      } else if (C.beard === "full") {

        // a hole around the mouth (plane coords x +-0.3, y -0.7..-0.36) so the mouth sits on skin, framed by the beard
        const g = headShell(-1.7, 1.7, -1.5, -0.2, 30, 14, 1.0, (a) => -0.28 + 0.3 * Math.min(1, Math.abs(a) / 1.4), null,
          (q) => q.z > 0.5 && ((q.x / q.z) / 0.3) ** 2 + ((q.y / q.z + 0.53) / 0.17) ** 2 < 1);
        const pos = g.attributes.position, v = new V3();
        for (let i = 0; i < pos.count; i++) { // push outward, more at the chin, with a little seeded roughness
          v.fromBufferAttribute(pos, i); const n = v.clone().normalize();
          const chin = clamp((-n.y - 0.6) / 0.35);
          v.addScaledVector(n, 0.03 + 0.05 * chin + br.range(-0.006, 0.006)); pos.setXYZ(i, v.x, v.y, v.z);

        g.computeVertexNormals();
        mesh(g, new THREE.MeshPhysicalMaterial({ color: C.beardColor, roughness: 0.7, flatShading: true, sheen: 0.7, sheenColor: col(C.beardColor).lerp(col("#ffd9a8"), 0.4), side: THREE.DoubleSide }), head);

      key.position.set(-1.6, 2.4, 2.4); key.target.position.set(0, 0.3, -0.5);
      key.castShadow = true; key.shadow.mapSize.set(2048, 2048);
      Object.assign(key.shadow.camera, { left: -1.3, right: 1.3, top: 1.6, bottom: -0.6, near: 0.5, far: 8 });
      key.shadow.bias = -0.0004; key.shadow.normalBias = 0.02; key.shadow.radius = 4;
      scene.add(key, key.target);
      const fill = new THREE.DirectionalLight(PAL.cool, 0.5); fill.position.set(2, 0.8, 1.6); scene.add(fill);
      const rimWarm = new THREE.DirectionalLight(PAL.light, 3.2); rimWarm.position.set(1.6, 1.8, -2.4); rimWarm.target.position.set(0, 0.6, -0.6); scene.add(rimWarm, rimWarm.target);
      const rimCool = new THREE.DirectionalLight(col(PAL.cool).lerp(col("#ffffff"), 0.3), 1.6); rimCool.position.set(-1.8, 1.4, -2.2); rimCool.target.position.set(0, 0.6, -0.6); scene.add(rimCool, rimCool.target);
      const faceFill = new THREE.PointLight("#ffe2c4", 0.6, 3, 2); faceFill.position.set(0.2, 0.9, 0.9); scene.add(faceFill);

      // =====================================================================
      // ANIMATION STATE (all pure functions of t)
      // =====================================================================
      const EXPR = {
        neutral:   { smile: 0.18, brow: 0.0, browTilt: 0.0, browAsym: 0, lidUp: 0, lidLow: 0, open: 0, round: 0, skew: 0, tilt: 0, gazeX: 0, gazeY: 0 },
        smile:     { smile: 0.95, brow: 0.25, browTilt: 0.05, browAsym: 0, lidUp: 0.05, lidLow: 0.42, open: 0.08, round: 0, skew: 0, tilt: 0.05, gazeX: 0, gazeY: 0 },
        surprised: { smile: 0.05, brow: 1.0, browTilt: 0.15, browAsym: 0, lidUp: 0.3, lidLow: -0.15, open: 0.42, round: 0.9, skew: 0, tilt: -0.03, gazeX: 0, gazeY: 0.05 },
        thinking:  { smile: -0.15, brow: 0.2, browTilt: -0.1, browAsym: 0.9, lidUp: -0.12, lidLow: 0.15, open: 0, round: 0, skew: 0.45, tilt: 0.1, gazeX: 0.45, gazeY: 0.5 },
      };
      const cues = (Array.isArray(P.cues) ? P.cues : []).slice().sort((a, b) => a.t - b.t);
      const exprKeys = [{ t: -10, e: EXPR[P.expression] ? P.expression : "smile" }];
      cues.forEach((c) => { if (c.expression && EXPR[c.expression]) exprKeys.push({ t: c.t, e: c.expression }); });
      function exprAt(t) {
        let k = 0; while (k + 1 < exprKeys.length && exprKeys[k + 1].t <= t) k++;
        const cur = EXPR[exprKeys[k].e];
        if (k === 0) return Object.assign({}, cur);
        const prev = EXPR[exprKeys[k - 1].e], b = smooth((t - exprKeys[k].t) / 0.35);
        const out = {}; for (const key in cur) out[key] = lerp(prev[key], cur[key], b);
        return out;
      }
      // gestures: segments [{t0, g}] with defaults restored after timed gestures
      const BASE_G = ["rest", "typing", "explain"].includes(P.gesture) ? P.gesture : "explain";
      const G_DUR = { wave: 1.8, point: 1.6, chin: 2.0 };
      const gSegs = [{ t0: -10, g: BASE_G }];
      cues.forEach((c) => {
        if (!c.gesture) return;
        gSegs.push({ t0: c.t, g: c.gesture });
        const dur = c.duration ?? G_DUR[c.gesture];
        if (dur && G_DUR[c.gesture] !== undefined) gSegs.push({ t0: c.t + dur, g: BASE_G });
      });
      gSegs.sort((a, b) => a.t0 - b.t0);
      const lookKeys = [{ t: -10, look: "camera" }];
      cues.forEach((c) => { if (c.look) lookKeys.push({ t: c.t, look: c.look }); });

      // mouth curve sampling
      const FPS = curve ? curve.fps || 30 : 30;
      const sampleOpen = (tt) => {
        if (!curve) return 0;
        const x = tt * FPS, i = Math.floor(x), f = x - i, o = curve.open;
        const a = o[clamp(i, 0, o.length - 1)] || 0, b = o[clamp(i + 1, 0, o.length - 1)] || 0;
        return (i < 0 || i >= o.length) ? 0 : lerp(a, b, f);
      };
      const sampleShape = (tt) => {
        if (!curve || !curve.shape) return "open";
        const i = Math.round(tt * FPS); const s = curve.shape;
        return (i >= 0 && i < s.length) ? s[i] : "closed";
      };
      // emphasis: explicit cues + the loudest local peaks of the curve, at least 1.4 s apart
      const emph = cues.filter((c) => c.emphasis).map((c) => c.t);
      if (P.autoEmphasis !== false && curve) {
        const off = P.mouthOffset || 0, cand = [];
        for (let f = 2; f < (DUR) * FPS - 2; f++) {
          const tt = off + f / FPS, v = sampleOpen(tt);
          if (v > 0.82 && v >= sampleOpen(tt - 1 / FPS) && v >= sampleOpen(tt + 1 / FPS)) cand.push({ t: f / FPS, v });
        }
        cand.sort((a, b) => b.v - a.v);
        for (const c of cand) if (emph.every((e) => Math.abs(e - c.t) > 1.4)) emph.push(c.t);
      }
      const bump = (x) => (x <= 0 || x >= 1 ? 0 : Math.sin(Math.PI * x) ** 2);
      const emphasisAt = (t) => emph.reduce((m, e) => Math.max(m, bump((t - e + 0.05) / 0.55)), 0);

      // blinks at seeded intervals of 2-5 s (sometimes a double blink)
      const blinks = [];
      { const r = rngOf("blink"); let t = r.range(0.6, 2.0); while (t < DUR + 1) { blinks.push(t); if (r() < 0.18) blinks.push(t + 0.24); t += r.range(2, 5); } }
      const blinkAt = (t) => blinks.reduce((m, b) => { const x = (t - b) / 0.17; return Math.max(m, x > 0 && x < 1 ? Math.sin(Math.PI * x) : 0); }, 0);
      // eye darts: small seeded gaze shifts
      const darts = [];
      { const r = rngOf("darts"); let t = 0; while (t < DUR + 1) { darts.push({ t, x: r.range(-0.08, 0.08), y: r.range(-0.05, 0.05) }); t += r.range(0.7, 2.2); } }
      const dartAt = (t) => { let k = 0; while (k + 1 < darts.length && darts[k + 1].t <= t) k++; const d = darts[k], p = darts[Math.max(0, k - 1)], b = smooth((t - d.t) / 0.06); return [lerp(p.x, d.x, b), lerp(p.y, d.y, b)]; };
      const idle = rngOf("idle"); const PH = Array.from({ length: 8 }, () => idle.range(0, TAU));

      function shoulderWorld(s) { const a = arms[s < 0 ? 0 : 1]; return a.anchor.getWorldPosition(new V3()); }
      // A hand pose: world target p, finger direction f, palm normal n, curl, index straight?, elbow pole.
      function pose(name, s, t, tl, talk) {
        const v = (x, y, z) => new V3(x, y, z);
        switch (name) {
          case "typing": {
            const tap = Math.max(0, Math.sin(t * 11 + s * 1.7 + PH[2])) * 0.012;
            return { p: v(s * 0.135, 0.085 + tap, -0.175), f: v(-s * 0.2, -0.3, 1), n: v(0, -1, 0.2), curl: 0.75, idx: 0, pole: v(s * 0.8, -0.6, -0.4), tap: t };
          }
          case "explain": {
            const beat = talk * 0.05;
            const sway = Math.sin(t * 1.3 + PH[3] + s) * 0.025;
            return { p: v(s * (0.235 + sway), 0.2 + beat + Math.sin(t * 0.9 + PH[4] + s * 2) * 0.02, -0.27 + sway * 0.6), f: v(-s * 0.55, 0.35, 1), n: v(-s * 0.35, 1, 0.25), curl: 0.3, idx: 0, pole: v(s * 0.9, -0.9, -0.2) };
          }
          case "wave": {
            if (s < 0) return pose(BASE_G === "explain" ? "rest" : BASE_G, s, t, tl, talk);
            const w = Math.sin(tl * TAU * 1.5);
            return { p: v(0.43 + w * 0.03, 0.7, -0.4), f: v(w * 0.35, 1, 0.1), n: v(-0.1, 0, 1), curl: 0.05, idx: 0, pole: v(1, -0.7, -0.15) };
          }
          case "point": {
            if (s < 0) return pose(BASE_G === "explain" ? "rest" : BASE_G, s, t, tl, talk);
            const k = Math.sin(tl * 3) * 0.01;
            return { p: v(0.36, 0.6 + k, -0.29), f: v(0.3, 1, 0.35), n: v(0.3, 0, 1), curl: 1.45, idx: 1, pole: v(1, -0.8, -0.1) };
          }
          case "chin": {
            if (s < 0) return pose("rest", s, t, tl, talk);
            return { p: v(0.07, 0.4, -0.29), f: v(-0.25, 1, 0.15), n: v(-0.1, 0.1, -1), curl: 1.3, idx: 0, pole: v(0.6, -1, 0.35) };
          }
          default: // rest: hands on the desk
            return { p: v(s * 0.4, 0.05, -0.24), f: v(-s * 0.15, -0.08, 1), n: v(0, -1, 0), curl: 0.45, idx: 0, pole: v(s * 0.75, -0.6, -0.5) };
        }
      }
      function blendPose(a, b, k) {
        return { p: a.p.clone().lerp(b.p, k), f: a.f.clone().normalize().lerp(b.f.clone().normalize(), k), n: a.n.clone().normalize().lerp(b.n.clone().normalize(), k), curl: lerp(a.curl, b.curl, k), idx: lerp(a.idx, b.idx, k), pole: a.pole.clone().lerp(b.pole, k) };
      }
      function handPose(s, t, talk) {
        let k = 0; while (k + 1 < gSegs.length && gSegs[k + 1].t0 <= t) k++;
        const cur = gSegs[k], tl = t - cur.t0;
        const now = pose(cur.g, s, t, tl, talk);
        if (k === 0) return now;
        const prev = pose(gSegs[k - 1].g, s, t, t - gSegs[k - 1].t0, talk);
        const b = smooth(tl / 0.5);
        // lift the hand a little through the transition so it never drags through the desk
        const out = blendPose(prev, now, b); out.p.y += Math.sin(Math.PI * b) * 0.05;
        return out;
      }

      // ---------- camera ----------
      const FRAMES = { close: { cy: 0.7, h: 1.08, w: 0.95 }, medium: { cy: 0.42, h: 1.5, w: 1.45 }, wide: { cy: 0.3, h: 2.3, w: 2.7 } };
      const FR = FRAMES[P.framing] || FRAMES.medium;
      const tanV = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
      const baseDist = Math.max(FR.h / 2 / tanV, FR.w / 2 / (tanV * camera.aspect));
      const shiftPx = P.layout === "lower-card" ? 0 : ((P.subjectY ?? 0.6) - 0.5) * CH;
      if (shiftPx) camera.setViewOffset(CW, CH, 0, -shiftPx, CW, CH);
      { // size the background plate to the widest view
        const D = baseDist * 1.04 + (TORSO_Z - BG_Z);
        const hh = 2 * D * tanV * 1.25 + Math.abs(shiftPx) / CH * 2 * D * tanV;
        bg.scale.set(hh * camera.aspect * 1.12, hh, 1);
        bg.position.set(0, FR.cy + 0.25, BG_Z);
      }

      // =====================================================================
      // DRAW
      // =====================================================================
      const cr = rngOf("camera"); const camPh = [cr.range(0, TAU), cr.range(0, TAU)];
      function draw(t) {
        t = Math.max(0, t);
        // camera: push in + gentle drift
        const k = smooth(t / DUR);
        const dist = baseDist * (1.04 - (P.pushIn ?? 0.08) * k);
        const dr = (P.drift ?? 1) * 0.04;
        camera.position.set(Math.sin(t * 0.35 + camPh[0]) * dr, FR.cy + dist * 0.1 + Math.sin(t * 0.27 + camPh[1]) * dr * 0.4, TORSO_Z + dist);
        camera.lookAt(0, FR.cy, TORSO_Z);

        const ex = exprAt(t);
        const talkOn = P.talk !== "off";
        const vt = t + (P.mouthOffset || 0);
        const talk = talkOn ? sampleOpen(vt) : 0;
        const shape = talkOn ? sampleShape(vt) : "closed";
        const emp = emphasisAt(t);

        // body: breathing + sway
        const breath = Math.sin(t * TAU / 4.2 + PH[0]);
        body.position.y = breath * 0.004;
        body.rotation.z = Math.sin(t * 0.31 + PH[1]) * 0.012;
        body.rotation.y = Math.sin(t * 0.23 + PH[2]) * 0.03;
        torso.scale.set(BUILD * (1 + breath * 0.006), 1 + breath * 0.008, TORSO_DEPTH * (1 + breath * 0.01));

        // head: idle drift, nods on emphasis, talking bob, expression tilt, look cues
        let lk = 0; while (lk + 1 < lookKeys.length && lookKeys[lk + 1].t <= t) lk++;
        const LOOK = { camera: [0, 0], left: [-0.35, 0], right: [0.35, 0], up: [0, 0.25], down: [0, -0.2] };
        const lCur = LOOK[lookKeys[lk].look] || [0, 0], lPrev = LOOK[lookKeys[Math.max(0, lk - 1)].look] || [0, 0];
        const lb = lk === 0 ? 1 : smooth((t - lookKeys[lk].t) / 0.45);
        const lookY = lerp(lPrev[0], lCur[0], lb), lookP = lerp(lPrev[1], lCur[1], lb);
        neckPivot.rotation.x = -0.04 + Math.sin(t * 0.5 + PH[3]) * 0.025 + emp * 0.09 + talk * 0.02 - lookP + ex.gazeY * -0.08;
        neckPivot.rotation.y = Math.sin(t * 0.37 + PH[4]) * 0.07 + Math.sin(t * 0.91 + PH[5]) * 0.02 + lookY + ex.gazeX * 0.12;
        neckPivot.rotation.z = Math.sin(t * 0.43 + PH[6]) * 0.03 + ex.tilt;

        // brows
        const browUp = ex.brow + emp * 0.7;
        for (const b of brows) {
          const asym = b.s > 0 ? ex.browAsym : -ex.browAsym * 0.35;
          b.m.position.set(0, (browUp + asym * 0.6) * 0.022, 0);
          b.m.rotation.z = b.s * (ex.browTilt + asym * 0.12) - b.s * 0.06;
        }

        // eyes: blink, lids, gaze (to the camera with darts, or up/aside when thinking)
        const blink = blinkAt(t);
        scene.updateMatrixWorld(true);
        const [dx, dy] = dartAt(t);
        const camTarget = camera.position.clone().add(new V3(ex.gazeX * 0.9 + dx + lookY * 1.5, ex.gazeY * 0.9 + dy + lookP * 1.5, 0));
        for (const e of eyes) {
          const openA = ES.open - ex.lidUp * 0.6 + emp * -0.12;
          const lowA = ES.low - ex.lidLow * 0.9;
          const closedA = 1.42;
          e.upper.rotation.x = lerp(openA, closedA, Math.max(blink, 0));
          e.lower.rotation.x = lerp(lowA, 0.25, blink * 0.6);
          e.gaze.lookAt(camTarget);
        }

        // mouth
        const SH = { closed: [0, 0], open: [0, 0], wide: [1, 0], round: [0, 1] }[shape] || [0, 0];
        const open = clamp(Math.max(ex.open, talk * (1 - 0.25 * Math.max(0, ex.smile - 0.6))));
        const smileNow = ex.smile * (1 - talk * 0.35);
        updateMouth(open, SH[0] + 0.25 * Math.max(0, ex.smile), Math.max(SH[1], ex.round), smileNow, ex.skew);

        // arms
        scene.updateMatrixWorld(true);
        for (const a of arms) {
          const S = shoulderWorld(a.s);
          const hp = handPose(a.s, t, talk);
          const { E, W } = solveIK(S, hp.p, hp.pole);
          a.shoulder.position.copy(S);
          placeLimb(a.upper, S, E); placeLimb(a.fore, E, W);
          a.elbow.position.copy(E);
          const sleeveEnd = longSleeve ? E : S.clone().lerp(E, 0.5);
          placeLimb(a.sleeveU, S, sleeveEnd);
          if (longSleeve) {
            a.sleeveE.position.copy(E);
            const cuffAt = E.clone().lerp(W, 0.86);
            placeLimb(a.sleeveF, E, cuffAt);
            placeLimb(a.cuff, cuffAt, E.clone().lerp(W, 0.98)); a.cuff.scale.y = 1;
            a.cuff.position.copy(cuffAt.clone().lerp(W, 0.5));
          }
          a.hand.position.copy(W);
          orientHand(a.hand, hp.f, hp.n);
          a.fingers.forEach((fp, i) => {
            const straight = i === 0 ? hp.idx : 0; // index finger (closest to the thumb side)
            const tapK = hp.tap !== undefined ? Math.max(0, Math.sin(t * 13 + i * 1.9 + a.s)) * 0.5 : 0;
            fp.rotation.x = lerp(hp.curl + tapK + i * 0.05, 0.05, straight);
          });
          a.thumb.rotation.set(0.2 + hp.curl * 0.3, a.s * (0.5 - hp.curl * 0.2), 0);
        }

        renderer.render(scene, camera);
      }
      // the index finger is the one next to the thumb: reorder so fingers[0] is on the thumb side
      for (const a of arms) a.fingers.sort((p, q) => (p.position.x - q.position.x) * a.s);

      window.addEventListener("hf-seek", (e) => draw(e.detail.time));
      draw(0);
    </script>
  </body>
</html>
