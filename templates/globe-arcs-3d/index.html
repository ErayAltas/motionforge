<!doctype html>
<!--
  motionforge template: globe-arcs-3d — a lit Earth turns to a region, pins drop on cities and
  great-circle arcs draw between them; city names are HTML labels that follow the pins
  © 2026 motionforge contributors, MIT
  3D layer: three.js (MIT, from npm) + mf-three.js, copied into assets/vendor/ by new-scene.sh.
  Map data: world-atlas land-50m.json (ISC; Natural Earth data, public domain), read with
  topojson-client (ISC). Both come from npm (npm i world-atlas@2.0.2 topojson-client@3.1.0) and
  new-scene.sh copies them into assets/vendor/.
  Contract: engines/hyperframes/three/README.md (hf-seek drives the 3D and labels, GSAP the titles).
-->
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script type="importmap">{ "imports": { "three": "./assets/vendor/three.module.min.js", "three/addons/": "./assets/vendor/three-addons/" } }</script>
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/mf-runtime.js"></script>
    <script src="assets/vendor/topojson-client.min.js"></script>
    <link rel="stylesheet" href="assets/base.css" />
    <style>
      #halo { position: absolute; inset: 0; background: radial-gradient(620px 620px at 50% 1090px, rgba(120, 180, 230, 0.10), transparent 70%); }
      #gl { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      #eyebrow { top: 220px; }
      #title { top: 280px; font-size: 96px; }
      #labels { position: absolute; inset: 0; }
      .city { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 12px; padding: 12px 20px 12px 16px; border-radius: 999px;
              background: rgba(14, 15, 17, 0.72); border: 1.5px solid rgba(255, 255, 255, 0.16); backdrop-filter: blur(6px);
              font: 700 25px/1 var(--mf-font-mono); letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap; will-change: transform, opacity; }
      .city i { width: 12px; height: 12px; border-radius: 50%; background: var(--mf-accent); box-shadow: 0 0 12px var(--mf-accent); }
      #route { position: absolute; left: 60px; right: 60px; top: 1700px; text-align: center; font: 500 27px/1.3 var(--mf-font-mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--mf-muted); }
      #route b { color: var(--mf-accent); font-weight: 700; }
      #grain { position: absolute; inset: 0; z-index: 5; pointer-events: none; background-image: var(--mf-grain); opacity: 0.05; mix-blend-mode: overlay; }
    </style>
  </head>
  <body>
    <div id="root" class="mf-stage" data-composition-id="main" data-start="0" data-duration="6" data-width="1080" data-height="1920">
      <div id="halo"></div>
      <canvas id="gl" class="clip" width="1080" height="1920" data-start="0" data-duration="6" data-track-index="0"></canvas>
      <div id="labels" class="clip" data-start="0" data-duration="6" data-track-index="1"></div>
      <div id="eyebrow" class="eyebrow clip" data-start="0" data-duration="6" data-track-index="2"></div>
      <h1 id="title" class="title clip" data-start="0" data-duration="6" data-track-index="3"></h1>
      <div id="route" class="clip" data-start="0" data-duration="6" data-track-index="4"></div>
      <div id="grain"></div>
    </div>

    <script id="params" type="application/json">
{
  "eyebrow": "Example network",
  "title": "Four cities. {One} team.",
  "cities": [
    { "name": "Lisbon", "lat": 38.72, "lon": -9.14 },
    { "name": "Istanbul", "lat": 41.01, "lon": 28.98 },
    { "name": "Dubai", "lat": 25.2, "lon": 55.27 },
    { "name": "Nairobi", "lat": -1.29, "lon": 36.82 }
  ],
  "arcs": "chain",
  "focus": -1,
  "spinFrom": 75,
  "pinStart": 1.6,
  "arcStart": 2.5,
  "route": "",
  "landColor": "#c3c9bf",
  "oceanColor": "#0b1822",
  "lang": "en",
  "duration": 6
}
    </script>

    <script>
      // ---- HTML layer: titles on the GSAP timeline ----
      const P = MF.params();
      document.documentElement.lang = P.lang;
      const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
      document.getElementById("eyebrow").textContent = P.eyebrow || "";
      const title = document.getElementById("title");
      title.innerHTML = esc(P.title || "").replace(/\{([^}]+)\}/g, '<span class="serif accent">$1</span>');
      MF.fit(title, 96, 60, 220);
      // route line under the globe: "A → B → C" (or the "route" param)
      const names = (P.cities || []).map((c) => esc(c.name));
      document.getElementById("route").innerHTML = P.route ? esc(P.route) : names.join(" <b>→</b> ");

      const tl = MF.timeline("main", P.duration);
      tl.fromTo("#eyebrow", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 0.15);
      tl.fromTo("#title", { opacity: 0, y: 44, filter: "blur(12px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.55, ease: "power3.out" }, 0.25);
      tl.fromTo("#route", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, P.arcStart + 0.3);
      MF.ready().then(() => MF.fit(title, 96, 60, 220));
      tl.seek(0);
    </script>

    <script type="module">
      import * as THREE from "three";
      import { createStage, environment, onSeek, ease, seg, lerp, project } from "./assets/vendor/mf-three.js";

      const P = MF.params();
      const css = getComputedStyle(document.getElementById("root"));
      const ACCENT = css.getPropertyValue("--mf-accent").trim() || "#c8f53a";
      const cities = P.cities || [];
      const D2R = Math.PI / 180;

      const { renderer, scene, camera, render } = createStage({ fov: 30, shadows: false, toneMapping: "neutral" });
      environment(renderer, scene, 0.18);
      const sun = new THREE.DirectionalLight(0xfff3e2, 2.6);
      sun.position.set(-5, 3.5, 5.5);
      const sky = new THREE.HemisphereLight(0x9cc8ff, 0x0b0d12, 0.35);
      scene.add(sun, sky);
      // globe centre sits lower than the frame centre (title above): shift the projection
      camera.setViewOffset(1080, 1920, 0, -(1090 - 960), 1080, 1920);

      // lat/lon -> point on the unit sphere, matching SphereGeometry's equirectangular UVs
      function ll(lat, lon, r = 1) {
        const phi = (lon + 180) * D2R, th = (90 - lat) * D2R;
        return new THREE.Vector3(-Math.cos(phi) * Math.sin(th) * r, Math.cos(th) * r, Math.sin(phi) * Math.sin(th) * r);
      }

      // ---- the globe: tilt (x) > spin (y) > sphere, so tilt = lat and spin = -90° - lon face a point to the camera ----
      const tilt = new THREE.Group(), spin = new THREE.Group();
      tilt.add(spin);
      scene.add(tilt);

      // equirectangular land texture drawn from world-atlas land-50m (+ a roughness map: glossy ocean, matte land)
      async function landTextures() {
        const topo = await (await fetch("assets/vendor/land-50m.json")).json();
        // topojson.feature returns a Feature or a FeatureCollection: flatten to a list of polygons
        const fc = topojson.feature(topo, topo.objects.land);
        const polys = [];
        for (const f of fc.features || [fc]) {
          const g = f.geometry;
          if (!g) continue;
          if (g.type === "Polygon") polys.push(g.coordinates);
          else if (g.type === "MultiPolygon") polys.push(...g.coordinates);
        }
        const W = 4096, H = 2048;
        const make = (w, h) => Object.assign(document.createElement("canvas"), { width: w, height: h });
        const color = make(W, H), rough = make(W / 2, H / 2);
        function path(ctx, w, h) {
          ctx.beginPath();
          for (const poly of polys) for (const ring of poly) {
            // unwrap longitudes so a ring that crosses ±180° stays continuous, then draw it
            // shifted by -360°, 0 and +360° so both texture edges get their part
            let prev = ring[0][0], off = 0, minLon = Infinity, maxLon = -Infinity;
            const pts = ring.map(([lon, lat]) => {
              if (lon - prev > 180) off -= 360; else if (prev - lon > 180) off += 360;
              prev = lon;
              const u = lon + off;
              minLon = Math.min(minLon, u); maxLon = Math.max(maxLon, u);
              return [u, lat];
            });
            // a ring spanning the full circle (Antarctica): close it along the pole instead of wrapping
            if (maxLon - minLon >= 359) {
              const lat0 = pts[0][1] < 0 ? -90 : 90;
              pts.push([pts[pts.length - 1][0], lat0], [pts[0][0], lat0]);
            }
            for (const shift of [-360, 0, 360]) {
              if (maxLon + shift < -180 || minLon + shift > 180) continue;
              pts.forEach(([lon, lat], i) => {
                const x = ((lon + shift + 180) / 360) * w, y = ((90 - lat) / 180) * h;
                i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
              });
              ctx.closePath();
            }
          }
        }
        let c = color.getContext("2d");
        c.fillStyle = P.oceanColor || "#0b1822";
        c.fillRect(0, 0, W, H);
        path(c, W, H);
        c.fillStyle = P.landColor || "#c3c9bf";
        c.fill("evenodd");
        c.lineWidth = 2.2;
        c.strokeStyle = "rgba(255,255,255,0.55)";
        c.stroke();
        c = rough.getContext("2d");
        c.fillStyle = "#6e6e6e";
        c.fillRect(0, 0, W / 2, H / 2);
        path(c, W / 2, H / 2);
        c.fillStyle = "#f0f0f0";
        c.fill("evenodd");
        const map = new THREE.CanvasTexture(color);
        map.colorSpace = THREE.SRGBColorSpace;
        map.anisotropy = Math.min(4, renderer.capabilities.getMaxAnisotropy()); // more costs a lot in software rendering
        const roughnessMap = new THREE.CanvasTexture(rough);
        return { map, roughnessMap };
      }

      const ready = landTextures().then(({ map, roughnessMap }) => {
        const earth = new THREE.Mesh(
          new THREE.SphereGeometry(1, 96, 72),
          new THREE.MeshStandardMaterial({ map, roughnessMap, roughness: 1, metalness: 0, emissive: 0xffffff, emissiveMap: map, emissiveIntensity: 0.06 })
        );
        spin.add(earth);
      });

      // atmosphere: a back-facing shell that glows at the limb (premultiplied, so it composites over the CSS backdrop)
      const atmoColor = new THREE.Color("#8fcbff");
      const glowMat = (power, strength, side) => new THREE.ShaderMaterial({
        uniforms: { color: { value: atmoColor }, power: { value: power }, strength: { value: strength } },
        vertexShader: `varying vec3 vN; varying vec3 vV;
          void main(){ vec4 mv = modelViewMatrix * vec4(position,1.0); vN = normalize(normalMatrix * normal); vV = normalize(-mv.xyz); gl_Position = projectionMatrix * mv; }`,
        fragmentShader: side === THREE.BackSide
          ? `uniform vec3 color; uniform float power; uniform float strength; varying vec3 vN; varying vec3 vV;
             void main(){ float k = pow(clamp(-dot(vN, vV) / 0.45, 0.0, 1.0), power) * strength; gl_FragColor = vec4(color * k, k); }`
          : `uniform vec3 color; uniform float power; uniform float strength; varying vec3 vN; varying vec3 vV;
             void main(){ float k = pow(1.0 - clamp(dot(vN, vV), 0.0, 1.0), power) * strength; gl_FragColor = vec4(color * k, k); }`,
        side, transparent: true, depthWrite: false, premultipliedAlpha: true,
        blending: THREE.CustomBlending, blendSrc: THREE.OneFactor, blendDst: THREE.OneMinusSrcAlphaFactor,
      });
      const outer = new THREE.Mesh(new THREE.SphereGeometry(1.12, 96, 64), glowMat(2.4, 0.75, THREE.BackSide));
      const inner = new THREE.Mesh(new THREE.SphereGeometry(1.002, 96, 64), glowMat(3.2, 0.55, THREE.FrontSide));
      scene.add(outer);
      tilt.add(inner);

      // ---- pins: stalk + glowing head + a pulsing ring on the surface ----
      const accentMat = new THREE.MeshBasicMaterial({ color: ACCENT });
      const stalkMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.85 });
      const UP = new THREE.Vector3(0, 1, 0);
      const pins = cities.map((c, i) => {
        const g = new THREE.Group();
        const n = ll(c.lat, c.lon);
        g.position.copy(n);
        g.quaternion.setFromUnitVectors(UP, n);
        const drop = new THREE.Group();
        const stalk = new THREE.Mesh(new THREE.CylinderGeometry(0.0035, 0.0035, 0.09, 8), stalkMat);
        stalk.position.y = 0.045;
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.016, 20, 12), accentMat);
        head.position.y = 0.092;
        drop.add(stalk, head);
        const ring = new THREE.Mesh(new THREE.RingGeometry(0.026, 0.031, 48), new THREE.MeshBasicMaterial({ color: ACCENT, transparent: true, side: THREE.DoubleSide, depthWrite: false }));
        ring.rotation.x = -Math.PI / 2;
        ring.position.y = 0.002;
        g.add(drop, ring);
        spin.add(g);
        return { g, drop, head, ring, n, start: P.pinStart + i * 0.18 };
      });

      // ---- arcs: great circles lifted off the surface, drawn by growing the tube's draw range ----
      const pairs = [];
      if (P.arcs === "hub") for (let i = 1; i < cities.length; i++) pairs.push([0, i]);
      else for (let i = 0; i + 1 < cities.length; i++) pairs.push([i, i + 1]);
      const SEGS = 120, RADIAL = 6;
      const arcs = pairs.map(([a, b], i) => {
        const A = pins[a].n, B = pins[b].n;
        const ang = A.angleTo(B);
        const lift = 0.05 + ang * 0.34;
        const pts = [];
        for (let k = 0; k <= 64; k++) {
          const s = k / 64;
          // spherical interpolation, then raise the middle of the path
          const p = A.clone().multiplyScalar(Math.sin((1 - s) * ang)).add(B.clone().multiplyScalar(Math.sin(s * ang))).divideScalar(Math.sin(ang) || 1);
          pts.push(p.normalize().multiplyScalar(1.003 + lift * Math.sin(Math.PI * s)));
        }
        const curve = new THREE.CatmullRomCurve3(pts);
        const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, SEGS, 0.007, RADIAL, false), accentMat);
        tube.geometry.setDrawRange(0, 0);
        const tip = new THREE.Mesh(new THREE.SphereGeometry(0.013, 16, 10), new THREE.MeshBasicMaterial({ color: 0xffffff }));
        spin.add(tube, tip);
        return { tube, tip, curve, start: P.arcStart + i * 0.45 };
      });

      // ---- where the globe looks: the focus city, or the middle of all cities ----
      let focus;
      if (P.focus >= 0 && cities[P.focus]) focus = { lat: cities[P.focus].lat, lon: cities[P.focus].lon };
      else {
        const m = new THREE.Vector3();
        pins.forEach((p) => m.add(p.n));
        m.normalize();
        // invert ll(): lat from y, lon from x/z
        focus = { lat: Math.asin(m.y) / D2R, lon: Math.atan2(-m.z, m.x) / D2R };
      }

      // ---- HTML city labels ----
      const holder = document.getElementById("labels");
      const labels = cities.map((c) => {
        const el = document.createElement("div");
        el.className = "city";
        el.innerHTML = "<i></i><span></span>";
        el.querySelector("span").textContent = c.name;
        holder.appendChild(el);
        return el;
      });

      const wp = new THREE.Vector3(), camDir = new THREE.Vector3();
      function draw(t) {
        // spin from spinFrom degrees east of the focus, ease in, then keep drifting slowly
        const k = ease.inOutCubic(seg(t, 0, 2.4));
        const drift = -4 * seg(t, 2.4, P.duration - 2.4);
        spin.rotation.y = (-90 - (focus.lon + lerp(P.spinFrom, 0, k) + drift)) * D2R;
        tilt.rotation.x = lerp(focus.lat * 0.4, focus.lat, k) * D2R;
        camera.position.set(0, 0, lerp(8.6, 7.5, ease.outCubic(seg(t, 0, P.duration))));
        camera.lookAt(0, 0, 0);
        camera.updateMatrixWorld();
        tilt.updateMatrixWorld(true);

        for (const p of pins) {
          const d = seg(t, p.start, 0.7);
          p.drop.position.y = lerp(0.35, 0, ease.outBounce(d));
          p.drop.visible = d > 0;
          p.drop.scale.setScalar(lerp(0.4, 1, ease.outCubic(seg(t, p.start, 0.25))));
          // ring: expands and fades, repeating every 1.4 s after landing (a pure function of t)
          const since = t - (p.start + 0.5);
          const ph = since > 0 ? (since % 1.4) / 1.4 : 0;
          p.ring.visible = since > 0;
          p.ring.scale.setScalar(1 + ph * 1.6);
          p.ring.material.opacity = (1 - ph) * 0.9;
        }
        for (const a of arcs) {
          const pr = ease.inOutCubic(seg(t, a.start, 1.0));
          a.tube.geometry.setDrawRange(0, Math.floor(pr * SEGS) * RADIAL * 6);
          a.tip.visible = pr > 0 && pr < 1;
          a.tip.position.copy(a.curve.getPointAt(pr));
        }
        render();

        // labels follow pin heads; fade out as a pin turns toward the limb
        camDir.copy(camera.position).normalize();
        pins.forEach((p, i) => {
          p.head.getWorldPosition(wp);
          const facing = wp.clone().normalize().dot(camDir);
          const s = project(wp, camera);
          const on = ease.outCubic(seg(t, p.start + 0.35, 0.35)) * Math.min(1, Math.max(0, (facing - 0.25) / 0.2));
          const el = labels[i];
          el.style.opacity = on;
          el.style.transform = `translate(${s.x + 18}px, ${s.y - 26}px) translate(0, -50%)`;
        });
      }
      onSeek(draw, ready);
    </script>
  </body>
</html>
