<!doctype html>
<!--
  motionforge template: city-pin-3d — a procedural low-poly city (seeded), the camera tilts from top-down
  to an angled view, a location pin drops with a bounce, walking-radius rings expand and amenity labels
  appear. Made for real-estate and location reels.
  © 2026 motionforge contributors, MIT
  3D layer: three.js (MIT, from npm) + mf-three.js, copied into assets/vendor/ by new-scene.sh.
  Contract: engines/hyperframes/three/README.md (hf-seek drives the 3D and labels, GSAP the titles).
  The city is generic and invented (not a real map). Ring radii are drawn to scale with each other,
  not to a real map scale: take walking times from your own data.
-->
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script type="importmap">{ "imports": { "three": "./assets/vendor/three.module.min.js", "three/addons/": "./assets/vendor/three-addons/" } }</script>
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/mf-runtime.js"></script>
    <link rel="stylesheet" href="assets/base.css" />
    <style>
      #gl { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      /* keeps the title readable over the far side of the city */
      #shade { position: absolute; left: 0; right: 0; top: 0; height: 760px; background: linear-gradient(180deg, var(--mf-bg) 0%, rgba(14, 15, 17, 0.85) 45%, transparent 100%); }
      #eyebrow { top: 220px; }
      #title { top: 280px; font-size: 92px; }
      #labels { position: absolute; inset: 0; }
      .tag { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 12px; padding: 12px 20px 12px 14px; border-radius: 999px; white-space: nowrap;
             background: rgba(14, 15, 17, 0.82); border: 1.5px solid rgba(255, 255, 255, 0.16); font: 700 25px/1 var(--mf-font-body); will-change: transform, opacity; }
      .tag b { font: 700 21px/1 var(--mf-font-mono); letter-spacing: 0.06em; color: var(--mf-accent-ink); background: var(--mf-accent); padding: 6px 9px; border-radius: 999px; }
      .ring-label { position: absolute; left: 0; top: 0; padding: 8px 12px; border-radius: 999px; background: rgba(14, 15, 17, 0.85); border: 1.5px solid var(--mf-accent);
                    font: 700 22px/1 var(--mf-font-mono); letter-spacing: 0.1em; color: var(--mf-accent); white-space: nowrap; will-change: transform, opacity; }
      #shade-bottom { position: absolute; left: 0; right: 0; bottom: 0; height: 420px; background: linear-gradient(0deg, var(--mf-bg) 0%, rgba(14, 15, 17, 0.8) 40%, transparent 100%); }
      #subline { position: absolute; left: 80px; right: 80px; top: 1700px; text-align: center; font: 500 26px/1.3 var(--mf-font-mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--mf-muted); }
      #grain { position: absolute; inset: 0; z-index: 5; pointer-events: none; background-image: var(--mf-grain); opacity: 0.05; mix-blend-mode: overlay; }
    </style>
  </head>
  <body>
    <div id="root" class="mf-stage" data-composition-id="main" data-start="0" data-duration="6" data-width="1080" data-height="1920">
      <canvas id="gl" class="clip" width="1080" height="1920" data-start="0" data-duration="6" data-track-index="0"></canvas>
      <div id="shade"></div>
      <div id="shade-bottom"></div>
      <div id="labels" class="clip" data-start="0" data-duration="6" data-track-index="1"></div>
      <div id="eyebrow" class="eyebrow clip" data-start="0" data-duration="6" data-track-index="2"></div>
      <h1 id="title" class="title clip" data-start="0" data-duration="6" data-track-index="3"></h1>
      <div id="subline" class="clip" data-start="0" data-duration="6" data-track-index="4"></div>
      <div id="grain"></div>
    </div>

    <script id="params" type="application/json">
{
  "eyebrow": "Location · example",
  "title": "Everything within {10 minutes}",
  "subline": "Invented city · walking times are examples",
  "minutes": [5, 10, 15],
  "labels": [
    { "name": "School", "minutes": 4, "angle": 140 },
    { "name": "Park", "minutes": 6, "angle": 35 },
    { "name": "Metro", "minutes": 9, "angle": 250 },
    { "name": "Hospital", "minutes": 13, "angle": 320 }
  ],
  "seed": "block-7",
  "pinStart": 1.5,
  "lang": "en",
  "duration": 6
}
    </script>

    <script>
      // ---- HTML layer: titles on the GSAP timeline ----
      const P = MF.params();
      document.documentElement.lang = P.lang;
      const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
      document.getElementById("eyebrow").textContent = P.eyebrow || "";
      const title = document.getElementById("title");
      title.innerHTML = esc(P.title || "").replace(/\{([^}]+)\}/g, '<span class="serif accent">$1</span>');
      document.getElementById("subline").textContent = P.subline || "";
      MF.fit(title, 92, 60, 220);

      const tl = MF.timeline("main", P.duration);
      tl.fromTo("#eyebrow", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 0.15);
      tl.fromTo("#title", { opacity: 0, y: 44, filter: "blur(12px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.55, ease: "power3.out" }, 0.25);
      tl.fromTo("#subline", { opacity: 0 }, { opacity: 1, duration: 0.4 }, P.pinStart + 2.2);
      MF.ready().then(() => MF.fit(title, 92, 60, 220));
      tl.seek(0);
    </script>

    <script type="module">
      import * as THREE from "three";
      import { createStage, environment, lights, onSeek, ease, seg, lerp, rng, project } from "./assets/vendor/mf-three.js";

      const P = MF.params();
      const css = getComputedStyle(document.getElementById("root"));
      const ACCENT = css.getPropertyValue("--mf-accent").trim() || "#c8f53a";
      const r = rng(P.seed || "city");

      const { renderer, scene, camera, render } = createStage({ fov: 32, far: 300 });
      environment(renderer, scene, 0.35);
      lights.daylight(scene, { size: 13, intensity: 1.05 });
      const TARGET_Y = 1180; // screen y of the pin
      camera.setViewOffset(1080, 1920, 0, -(TARGET_Y - 960), 1080, 1920);

      // ---- ground: street-coloured disc that fades out at the edge (alpha map) ----
      const R = 13; // city radius in scene units (1 unit ≈ one small block)
      const fade = document.createElement("canvas");
      fade.width = fade.height = 256;
      const fc = fade.getContext("2d");
      const grd = fc.createRadialGradient(128, 128, 60, 128, 128, 128);
      grd.addColorStop(0, "#fff");
      grd.addColorStop(1, "#000");
      fc.fillStyle = grd;
      fc.fillRect(0, 0, 256, 256);
      const ground = new THREE.Mesh(
        new THREE.CircleGeometry(R + 2, 96),
        new THREE.MeshStandardMaterial({ color: "#1f2023", roughness: 0.95, alphaMap: new THREE.CanvasTexture(fade), transparent: true, depthWrite: false })
      );
      ground.rotation.x = -Math.PI / 2;
      ground.receiveShadow = true;
      scene.add(ground);

      // ---- blocks: a street grid (wider avenue every 4th street), lots with seeded heights ----
      const PITCH = 1.0, STREET = 0.24, AVENUE = 0.42;
      const box = new THREE.BoxGeometry(1, 1, 1).translate(0, 0.5, 0);
      const lots = [], pads = [], parks = [], trees = [];
      const N = Math.ceil(R / PITCH);
      for (let gx = -N; gx <= N; gx++) for (let gz = -N; gz <= N; gz++) {
        const cx = gx * PITCH, cz = gz * PITCH;
        const d = Math.hypot(cx, cz);
        if (d > R - 0.5 || r() < Math.max(0, (d - R * 0.7) / (R * 0.3)) * 0.8) continue;
        // street widths: avenues where the grid index is a multiple of 4
        const sx = gx % 4 === 0 ? AVENUE : STREET, sz = gz % 4 === 0 ? AVENUE : STREET;
        const bw = PITCH - sx, bd = PITCH - sz;
        const ox = cx + sx / 2 - PITCH / 2 + bw / 2, oz = cz + sz / 2 - PITCH / 2 + bd / 2;
        pads.push([ox, oz, bw, bd]);
        if (gx === 0 && gz === 0) continue; // the plot under the pin stays for the highlighted building
        if (r() < 0.08 && d > 2) { parks.push([ox, oz, bw, bd]); continue; }
        // split the block into 1-4 lots
        const nx = r() < 0.8 ? 1 : 2, nz = r() < 0.8 ? 1 : 2;
        for (let i = 0; i < nx; i++) for (let j = 0; j < nz; j++) {
          const w = bw / nx - 0.06, dd = bd / nz - 0.06;
          const x = ox - bw / 2 + (i + 0.5) * (bw / nx), z = oz - bd / 2 + (j + 0.5) * (bd / nz);
          const centre = Math.max(0, 1 - d / (R * 0.9));
          // mostly low-rise, a few mid-rise blocks nearer the centre
          const tall = r() < 0.03 + 0.06 * centre ? r.range(0.6, 1.2) : 0;
          const h = (0.12 + Math.pow(r(), 2.4) * 0.45 + tall) * (0.6 + 0.4 * centre);
          lots.push([x, z, w * r.range(0.8, 1), dd * r.range(0.8, 1), h]);
        }
      }
      function instanced(list, mat, toMatrix) {
        const mesh = new THREE.InstancedMesh(box, mat, list.length);
        const m = new THREE.Matrix4();
        list.forEach((it, i) => mesh.setMatrixAt(i, toMatrix(m, it)));
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        scene.add(mesh);
        return mesh;
      }
      const S = new THREE.Vector3(), T = new THREE.Vector3(), Q = new THREE.Quaternion();
      instanced(pads, new THREE.MeshStandardMaterial({ color: "#2c2e32", roughness: 0.9 }), (m, [x, z, w, d]) => m.compose(T.set(x, 0, z), Q, S.set(w, 0.04, d)));
      instanced(parks, new THREE.MeshStandardMaterial({ color: "#46553f", roughness: 1 }), (m, [x, z, w, d]) => m.compose(T.set(x, 0.04, z), Q, S.set(w - 0.06, 0.03, d - 0.06)));
      for (const [x, z, w, d] of parks) for (let k = 0; k < 5; k++) trees.push([x + r.range(-0.35, 0.35) * w, z + r.range(-0.35, 0.35) * d, r.range(0.09, 0.15)]);
      const treeMesh = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1, 0), new THREE.MeshStandardMaterial({ color: "#6f8a5e", roughness: 0.9, flatShading: true }), trees.length);
      trees.forEach(([x, z, s], i) => treeMesh.setMatrixAt(i, new THREE.Matrix4().compose(T.set(x, 0.07 + s, z), Q, S.set(s, s * 1.3, s))));
      treeMesh.castShadow = true;
      scene.add(treeMesh);
      const buildings = instanced(lots, new THREE.MeshStandardMaterial({ color: "#ffffff", roughness: 0.8 }), (m, [x, z, w, d, h]) => m.compose(T.set(x, 0.04, z), Q, S.set(w, h, d)));
      // light clay near the pin, darker towards the edge: keeps the eye on the walkable area
      const near = new THREE.Color("#e2dfd8"), far = new THREE.Color("#2a2b2e"), col = new THREE.Color();
      lots.forEach(([x, z], i) => buildings.setColorAt(i, col.copy(near).lerp(far, Math.min(1, Math.max(0, (Math.hypot(x, z) - R * 0.22) / (R * 0.3))))));
      buildings.instanceColor.needsUpdate = true;

      // the highlighted building under the pin
      const home = new THREE.Mesh(box, new THREE.MeshStandardMaterial({ color: ACCENT, roughness: 0.5, emissive: ACCENT, emissiveIntensity: 0.15 }));
      home.scale.set(0.62, 0.42, 0.62);
      home.position.set(pads.find((p) => Math.abs(p[0]) < 0.6 && Math.abs(p[1]) < 0.6)?.[0] ?? 0, 0.04, 0);
      home.castShadow = home.receiveShadow = true;
      scene.add(home);
      const HX = home.position.x, HZ = home.position.z;

      // ---- the pin: a lathe teardrop (tip at the bottom) + white core ----
      function pinShape(c = 1.0, rad = 0.42) {
        const pts = [new THREE.Vector2(0, 0)];
        const L = Math.sqrt(c * c - rad * rad), b = Math.asin(rad / c);
        const tx = L * Math.sin(b), ty = L * Math.cos(b);
        for (let i = 1; i <= 8; i++) pts.push(new THREE.Vector2((tx * i) / 8, (ty * i) / 8));
        const a0 = Math.atan2(ty - c, tx);
        for (let i = 1; i <= 24; i++) {
          const a = a0 + ((Math.PI / 2 - a0) * i) / 24;
          pts.push(new THREE.Vector2(Math.max(0, Math.cos(a) * rad), c + Math.sin(a) * rad));
        }
        return new THREE.LatheGeometry(pts, 64);
      }
      const pin = new THREE.Group();
      const pinBody = new THREE.Mesh(pinShape(), new THREE.MeshStandardMaterial({ color: ACCENT, roughness: 0.25, metalness: 0.05, emissive: ACCENT, emissiveIntensity: 0.12 }));
      const core = new THREE.Mesh(new THREE.TorusGeometry(0.2, 0.06, 16, 48), new THREE.MeshStandardMaterial({ color: "#ffffff", roughness: 0.3 }));
      core.position.y = 1.0;
      pinBody.castShadow = core.castShadow = true;
      pin.add(pinBody, core);
      pin.scale.setScalar(1.25);
      scene.add(pin);

      // ---- walking-radius rings (drawn over the city so they read as map overlay) ----
      const minutes = (P.minutes || [5, 10, 15]).slice(0, 4);
      const maxMin = Math.max(...minutes, ...(P.labels || []).map((l) => l.minutes), 1);
      const RMAX = R * 0.42;
      const radiusOf = (min) => (min / maxMin) * RMAX;
      const rings = minutes.map((min, i) => {
        const rad = radiusOf(min);
        const ring = new THREE.Mesh(new THREE.RingGeometry(rad - 0.05, rad + 0.05, 160), new THREE.MeshBasicMaterial({ color: ACCENT, transparent: true, depthTest: false, depthWrite: false }));
        const fill = new THREE.Mesh(new THREE.CircleGeometry(rad, 160), new THREE.MeshBasicMaterial({ color: ACCENT, transparent: true, opacity: 0.05, depthTest: false, depthWrite: false }));
        for (const m of [ring, fill]) { m.rotation.x = -Math.PI / 2; m.position.set(HX, 0.06, HZ); m.renderOrder = 10; scene.add(m); }
        return { ring, fill, rad, min, start: P.pinStart + 0.9 + i * 0.35 };
      });

      // ---- amenity markers: a stalk + head in 3D, the label in HTML ----
      const holder = document.getElementById("labels");
      const amenities = (P.labels || []).map((a, i) => {
        const ang = ((a.angle ?? i * 90) * Math.PI) / 180, rad = radiusOf(a.minutes);
        const g = new THREE.Group();
        const stalk = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 1.1, 8).translate(0, 0.55, 0), new THREE.MeshStandardMaterial({ color: "#ffffff" }));
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.11, 20, 12), new THREE.MeshBasicMaterial({ color: "#ffffff" }));
        head.position.y = 1.15;
        g.add(stalk, head);
        g.position.set(HX + Math.cos(ang) * rad, 0.04, HZ - Math.sin(ang) * rad);
        scene.add(g);
        const el = document.createElement("div");
        el.className = "tag";
        el.innerHTML = "<b></b><span></span>";
        el.querySelector("b").textContent = `${a.minutes} MIN`;
        el.querySelector("span").textContent = a.name;
        holder.appendChild(el);
        return { g, head, el, start: P.pinStart + 1.9 + i * 0.25 };
      });
      const ringLabels = rings.map((rg) => {
        const el = document.createElement("div");
        el.className = "ring-label";
        el.textContent = `${rg.min} MIN`;
        holder.appendChild(el);
        return el;
      });

      const target = new THREE.Vector3(HX, 0.4, HZ), wp = new THREE.Vector3();
      function draw(t) {
        // camera: top-down -> 44° tilt with a slow turn and push-in
        const k = ease.inOutCubic(seg(t, 0.2, 2.6));
        const pitch = lerp(88, 46, k) * (Math.PI / 180);
        const yaw = lerp(24, -6, ease.inOutSine(seg(t, 0, 4.2))) * (Math.PI / 180); // settles, so the labels hold still
        const dist = lerp(50, 38, ease.outCubic(seg(t, 0, 4.2)));
        camera.position.set(target.x + Math.sin(yaw) * Math.cos(pitch) * dist, target.y + Math.sin(pitch) * dist, target.z + Math.cos(yaw) * Math.cos(pitch) * dist);
        camera.lookAt(target);
        camera.updateMatrixWorld();

        // buildings rise from the ground in the first second (one scale for the whole city)
        buildings.scale.y = lerp(0.02, 1, ease.outCubic(seg(t, 0, 1.2)));
        treeMesh.scale.setScalar(lerp(0.01, 1, ease.outBack(seg(t, 0.4, 0.8))));
        home.scale.y = 0.42 * lerp(0.02, 1, ease.outBack(seg(t, 0.6, 0.8)));

        // pin: drops with a bounce, then turns slowly
        const pd = seg(t, P.pinStart, 0.9);
        pin.visible = t >= P.pinStart;
        pin.position.set(HX, home.position.y + home.scale.y + lerp(7, 0, ease.outBounce(pd)), HZ);
        pin.rotation.y = 0.6 * Math.max(0, t - P.pinStart);

        rings.forEach((rg, i) => {
          const e = ease.outCubic(seg(t, rg.start, 0.9));
          const s = Math.max(0.001, e);
          rg.ring.scale.setScalar(s); rg.fill.scale.setScalar(s);
          rg.ring.visible = rg.fill.visible = e > 0;
          rg.ring.material.opacity = 0.95 - i * 0.12;
        });
        for (const a of amenities) {
          const e = seg(t, a.start, 0.45);
          a.g.visible = e > 0;
          a.g.scale.set(1, Math.max(0.001, ease.outBack(e)), 1);
        }
        render();

        // HTML labels follow their 3D anchors
        for (const a of amenities) {
          a.head.getWorldPosition(wp);
          const p = project(wp, camera);
          a.el.style.opacity = ease.outCubic(seg(t, a.start + 0.2, 0.35)) * (p.visible ? 1 : 0);
          // keep the tag inside the frame (its anchor dot stays where it is)
          const half = a.el.offsetWidth / 2;
          const x = Math.min(1080 - 24 - half, Math.max(24 + half, p.x));
          a.el.style.transform = `translate(${x}px, ${p.y - 18}px) translate(-50%, -100%)`;
        }
        rings.forEach((rg, i) => {
          // label on the ring, at the point nearest the bottom-right of the frame
          const ang = -0.35 * Math.PI + yaw;
          const p = project(wp.set(HX + Math.sin(ang) * rg.rad, 0.06, HZ + Math.cos(ang) * rg.rad), camera);
          ringLabels[i].style.opacity = ease.outCubic(seg(t, rg.start + 0.5, 0.4)) * (p.visible ? 1 : 0);
          ringLabels[i].style.transform = `translate(${p.x + 10}px, ${p.y}px) translate(0, -50%)`;
        });
      }
      onSeek(draw);
    </script>
  </body>
</html>
