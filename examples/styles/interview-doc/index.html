    <script>
      const DUR = 4.5, r = MF.rng("interview-doc");
      const bok = document.getElementById("bokeh");
      for (let i = 0; i < 14; i++) {
        const x = r.range(640, 1060), y = r.range(900, 1250), rr = r.range(14, 34);
        bok.insertAdjacentHTML("beforeend", `<circle cx="${x}" cy="${y}" r="${rr}" fill="${r.pick(["#f0c27a", "#e3a63c", "#f7dfb0"])}" opacity="${r.range(0.15, 0.4).toFixed(2)}" />`);

      const tl = MF.timeline("main", DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      // chapter card: fade in from black 0.4 s, hold, fade out 0.4 s
      tl.fromTo("#black", { opacity: 1 }, { opacity: 0, duration: 0.4, ease: "none" }, 0);
      tl.fromTo("#chapter .no", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35 }, 0.25);
      tl.to("#black", { opacity: 1, duration: 0.35, ease: "none" }, 1.55);
      tl.set("#chapter", { opacity: 0 }, 1.9);
      tl.to("#black", { opacity: 0, duration: 0.01 }, 1.9);
      // A-roll: slow push 1.5 % over the shot
      tl.fromTo("#scene", { scale: 1.0 }, { scale: 1.02, duration: 2.6, ease: "sine.inOut" }, 1.9);
      tl.fromTo(["#subs", "#note"], { opacity: 0 }, { opacity: 1, duration: 0.01 }, 1.95);
      // name super: rule 0 -> 420 px, name rises 0.1 s later, role 0.08 s after
      const S = 2.5;
      tl.fromTo("#rule", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, S);
      tl.fromTo("#nm", { y: 64 }, { y: 0, duration: 0.4, ease: "power3.out" }, S + 0.1);
      tl.fromTo("#role", { y: 50 }, { y: 0, duration: 0.4, ease: "power3.out" }, S + 0.18);
      tl.fromTo("#place", { y: 42 }, { y: 0, duration: 0.4, ease: "power3.out" }, S + 0.26);
      tl.seek(0);
