<!doctype html>
<!--

  Signature scene: the hours board. White letters drop 30 px into the grooves of a black felt board
  (0.12 s each, 0.03 s stagger, seeded rotation ±1.5°), one row per 0.6 s, in fixed 42 px cells; then
  the Call / Directions buttons rise 60 px with back.out(1.6) and a finger tap presses Call.
  Flat shopfront-green fallback field (no storefront photo in a preview). The shop, address, phone

<html lang="en" data-resolution="portrait">
  <head>

    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/mf-runtime.js"></script>
    <link rel="stylesheet" href="assets/base.css" />
    <style>
      /* fonts: @fontsource/barlow-condensed, @fontsource/barlow (copied from node_modules/@fontsource/<family>/files/) */
      @font-face { font-family: "Barlow Condensed"; font-weight: 600; font-style: normal; font-display: block; src: url("assets/fonts/barlow-condensed-latin-600-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+20AC, U+20BA, U+2122, U+2190-2193, U+2212; }
      @font-face { font-family: "Barlow Condensed"; font-weight: 600; font-style: normal; font-display: block; src: url("assets/fonts/barlow-condensed-latin-ext-600-normal.woff2") format("woff2"); unicode-range: U+0100-0130, U+0132-0151, U+0154-024F, U+1E00-1EFF; }
      @font-face { font-family: "Barlow Condensed"; font-weight: 800; font-style: normal; font-display: block; src: url("assets/fonts/barlow-condensed-latin-800-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+20AC, U+20BA, U+2122, U+2190-2193, U+2212; }
      @font-face { font-family: "Barlow Condensed"; font-weight: 800; font-style: normal; font-display: block; src: url("assets/fonts/barlow-condensed-latin-ext-800-normal.woff2") format("woff2"); unicode-range: U+0100-0130, U+0132-0151, U+0154-024F, U+1E00-1EFF; }
      @font-face { font-family: "Barlow"; font-weight: 500; font-style: normal; font-display: block; src: url("assets/fonts/barlow-latin-500-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+20AC, U+20BA, U+2122, U+2190-2193, U+2212; }
      @font-face { font-family: "Barlow"; font-weight: 500; font-style: normal; font-display: block; src: url("assets/fonts/barlow-latin-ext-500-normal.woff2") format("woff2"); unicode-range: U+0100-0130, U+0132-0151, U+0154-024F, U+1E00-1EFF; }
      @font-face { font-family: "Barlow"; font-weight: 600; font-style: normal; font-display: block; src: url("assets/fonts/barlow-latin-600-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+20AC, U+20BA, U+2122, U+2190-2193, U+2212; }
      @font-face { font-family: "Barlow"; font-weight: 600; font-style: normal; font-display: block; src: url("assets/fonts/barlow-latin-ext-600-normal.woff2") format("woff2"); unicode-range: U+0100-0130, U+0132-0151, U+0154-024F, U+1E00-1EFF; }
      @font-face { font-family: "Barlow"; font-weight: 700; font-style: normal; font-display: block; src: url("assets/fonts/barlow-latin-700-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+20AC, U+20BA, U+2122, U+2190-2193, U+2212; }
      @font-face { font-family: "Barlow"; font-weight: 700; font-style: normal; font-display: block; src: url("assets/fonts/barlow-latin-ext-700-normal.woff2") format("woff2"); unicode-range: U+0100-0130, U+0132-0151, U+0154-024F, U+1E00-1EFF; }
      :root { --bg: #213A2F; --ink: #FFFFFF; --acc: #FFC845; --felt: #151515; --mut: #B9C4BC; --mf-grain-opacity: 0.05; }
      html, body { background: var(--bg); }
      #root { background: radial-gradient(1000px 800px at 50% 10%, #2B4A3C 0%, transparent 70%), var(--bg); color: var(--ink); font-family: "Barlow", sans-serif; }
      #kick { position: absolute; left: 60px; top: 262px; font: 600 30px/1 "Barlow"; letter-spacing: .08em; color: var(--mut); display: flex; align-items: center; gap: 14px; }
      #dot { width: 20px; height: 20px; border-radius: 50%; background: var(--acc); box-shadow: 0 0 0 0 rgba(255,200,69,.5); }
      #head { position: absolute; left: 60px; right: 60px; top: 304px; font: 800 150px/0.9 "Barlow Condensed"; letter-spacing: 0.01em; text-transform: uppercase; }
      #board { position: absolute; left: 90px; width: 900px; top: 500px; height: 660px; border-radius: 14px; padding: 18px;
               background: linear-gradient(#5d5d5d, #3a3a3a); box-shadow: 0 30px 70px rgba(0,0,0,.45); }
      #felt { position: absolute; inset: 18px; border-radius: 6px; background-color: var(--felt);
              background-image: repeating-linear-gradient(180deg, rgba(255,255,255,0) 0 17px, rgba(0,0,0,.55) 17px 19px, rgba(255,255,255,.035) 19px 20px);
              box-shadow: inset 0 0 50px rgba(0,0,0,.8); overflow: hidden; }
      .row { position: absolute; left: 0; right: 0; height: 80px; display: flex; justify-content: center; }
      .ch { width: 42px; height: 80px; text-align: center; font: 600 64px/80px "Barlow Condensed"; letter-spacing: .06em; color: #F4F4F0;
            text-shadow: 0 3px 0 rgba(0,0,0,.6); display: inline-block; }
      #info { position: absolute; left: 60px; right: 60px; top: 1210px; font: 600 46px/1.3 "Barlow"; }
      #info span { display: block; font: 500 34px/1.3 "Barlow"; color: var(--mut); }
      .btn { position: absolute; top: 1390px; height: 112px; border-radius: 56px; background: var(--acc); color: #1B1B1B;
             display: flex; align-items: center; justify-content: center; gap: 18px; font: 700 48px/1 "Barlow"; }
      .btn svg { width: 46px; height: 46px; fill: none; stroke: #1B1B1B; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      #call { left: 60px; width: 440px; } #dir { left: 540px; width: 480px; }
      #tap { position: absolute; left: 330px; top: 1420px; width: 56px; height: 56px; border-radius: 50%; background: rgba(0,0,0,.25); border: 4px solid rgba(255,255,255,.9); }
      #tel { position: absolute; left: 60px; top: 1540px; font: 600 40px/1 "Barlow"; color: var(--ink); letter-spacing: .02em; }
      #note { position: absolute; left: 60px; top: 1610px; font: 500 26px/1 "Barlow"; color: var(--mut); }
    </style>
  </head>
  <body>
    <div id="root" class="mf-stage" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1080" data-height="1920">
      <div id="kick" class="clip" data-start="0" data-duration="4.5" data-track-index="0"><span id="dot"></span>Open now · until 18:00</div>
      <h1 id="head" class="clip" data-start="0" data-duration="4.5" data-track-index="1">Papermill Café</h1>
      <div id="board" class="clip" data-start="0" data-duration="4.5" data-track-index="2"><div id="felt"></div></div>
      <div id="info" class="clip" data-start="0" data-duration="4.5" data-track-index="3">14 Mill Lane, Riverside<span>Next to the old bridge · example shop</span></div>
      <div id="call" class="btn clip" data-start="0" data-duration="4.5" data-track-index="4"><svg viewBox="0 0 48 48"><path d="M10 6h8l4 10-5 3a24 24 0 0012 12l3-5 10 4v8a4 4 0 01-4 4C20 42 6 28 6 10a4 4 0 014-4z"/></svg>Call</div>
      <div id="dir" class="btn clip" data-start="0" data-duration="4.5" data-track-index="5"><svg viewBox="0 0 48 48"><path d="M24 4l18 18-18 18L6 22zM18 26v-6h10M24 15l5 5-5 5"/></svg>Directions</div>
      <div id="tap" class="clip" data-start="0" data-duration="4.5" data-track-index="6"></div>
      <div id="tel" class="clip" data-start="0" data-duration="4.5" data-track-index="7"></div>
      <div id="note" class="clip" data-start="0" data-duration="4.5" data-track-index="8">Hours, address and number are examples</div>
    </div>

    <script>
      const DUR = 4.5;
      const ROWS = ["FRESH BREAD DAILY", "MON–FRI  07–18", "SAT  08–15", "SUN  CLOSED"];
      const felt = document.getElementById("felt"), r = MF.rng("local-shop-promo");
      const tl = MF.timeline("main", DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;   // explicit registration (MF.timeline already does this; keeps the linter happy)
      tl.fromTo("#kick", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.05);
      tl.fromTo("#head", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.1);
      tl.fromTo("#board", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 0.25);
      // letters drop into the grooves: 0.12 s each, 0.03 s stagger, one row per 0.6 s
      ROWS.forEach((txt, ri) => {
        const row = document.createElement("div");
        row.className = "row"; row.style.top = (62 + ri * 140) + "px";
        felt.appendChild(row);
        const chs = [];
        [...txt].forEach((c) => {
          const s = document.createElement("span");
          s.className = "ch"; s.textContent = c === " " ? " " : c;
          row.appendChild(s);
          if (c !== " ") chs.push([s, r.range(-1.5, 1.5)]);
        });
        const t0 = 0.5 + ri * 0.6;
        chs.forEach(([s, rot], i) => tl.fromTo(s, { opacity: 0, y: -30, rotation: rot * 3 }, { opacity: 1, y: 0, rotation: rot, duration: 0.12, ease: "power2.in" }, t0 + i * 0.03));
      });
      // open-now dot pulses (a function of t, not a CSS loop)
      const pulse = { p: 0 }, dot = document.getElementById("dot");
      tl.to(pulse, { p: 4, duration: 4, ease: "none", onUpdate: () => { const f = pulse.p % 1; dot.style.boxShadow = `0 0 0 ${(f * 18).toFixed(1)}px rgba(255,200,69,${(0.5 * (1 - f)).toFixed(2)})`; } }, 0.4);
      tl.fromTo("#info", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 2.6);
      // buttons rise 60 px with back.out(1.6); a finger taps Call (0.94, 0.1 s); the number types below
      tl.fromTo(["#call", "#dir"], { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.4, ease: "back.out(1.6)", stagger: 0.08 }, 2.85);
      tl.fromTo("#tap", { opacity: 0, scale: 1.6 }, { opacity: 1, scale: 1, duration: 0.2, ease: "power2.out" }, 3.35);
      tl.to("#call", { scale: 0.94, duration: 0.05 }, 3.52);
      tl.to("#call", { scale: 1, duration: 0.1, ease: "power2.out" }, 3.57);
      tl.to("#tap", { opacity: 0, scale: 1.8, duration: 0.3 }, 3.62);
      const tel = document.getElementById("tel"), T = "+00 555 0142", ty = { n: 0 };
      tl.to(ty, { n: T.length, duration: T.length / 24, ease: "none", onUpdate: () => { tel.textContent = T.slice(0, Math.round(ty.n)); } }, 3.6);
      tl.fromTo("#note", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 3.0);
      tl.seek(0);
    </script>
  </body>
</html>
