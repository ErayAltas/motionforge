<!doctype html>
<!--
  motionforge style preview: gym-hype
  © 2026 motionforge contributors, MIT
  Signature scenes "rep slam" + "PR stamp": chalk-white Anton headline words slam 1.35 -> 1 in 0.14 s
  with a seeded 6 px shake, then leave as the counter arrives; a blaze-orange 420 px numeral drops 80 px
  with back.out(2.2) on every lockout (1.06 punch-in), the previous numeral shrinks into the label strip;
  one white flash frame and a -6 deg "PR" tag land on the last rep. A steel plate is the only graphic.
  Anton + Barlow Condensed + Chivo Mono. Set, reps and weight are sample values.
-->
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/mf-runtime.js"></script>
    <link rel="stylesheet" href="assets/base.css" />
    <style>
      @font-face { font-family: "Anton"; font-weight: 400; font-style: normal; font-display: block; src: url("assets/fonts/anton-latin-400-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+20AC, U+20BA, U+2122, U+2190-2193, U+2212; }
      @font-face { font-family: "Anton"; font-weight: 400; font-style: normal; font-display: block; src: url("assets/fonts/anton-latin-ext-400-normal.woff2") format("woff2"); unicode-range: U+0100-0130, U+0132-0151, U+0154-024F, U+1E00-1EFF; }
      @font-face { font-family: "Barlow Condensed"; font-weight: 700; font-style: normal; font-display: block; src: url("assets/fonts/barlow-condensed-latin-700-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+20AC, U+20BA, U+2122, U+2190-2193, U+2212; }
      @font-face { font-family: "Barlow Condensed"; font-weight: 700; font-style: normal; font-display: block; src: url("assets/fonts/barlow-condensed-latin-ext-700-normal.woff2") format("woff2"); unicode-range: U+0100-0130, U+0132-0151, U+0154-024F, U+1E00-1EFF; }
      @font-face { font-family: "Chivo Mono"; font-weight: 500; font-style: normal; font-display: block; src: url("assets/fonts/chivo-mono-latin-500-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+20AC, U+20BA, U+2122, U+2190-2193, U+2212; }
      @font-face { font-family: "Chivo Mono"; font-weight: 500; font-style: normal; font-display: block; src: url("assets/fonts/chivo-mono-latin-ext-500-normal.woff2") format("woff2"); unicode-range: U+0100-0130, U+0132-0151, U+0154-024F, U+1E00-1EFF; }
      :root { --bg: #0a0a0b; --ink: #f4f4f0; --acc: #ff4d00; --sup: #2b2d31; --chalk: #bdbdb5; --mf-grain-opacity: .10; }
      html, body { background: var(--bg); }
      #root { background: radial-gradient(1000px 800px at 50% 300px, #2a2a2c 0%, transparent 70%), var(--bg); }
      #world { position: absolute; inset: 0; transform-origin: 540px 1070px; }
      #plate { position: absolute; left: 90px; top: 620px; width: 900px; height: 900px; border-radius: 50%;
        background: radial-gradient(circle, #141517 0 6%, #3a3c41 6.5% 9%, #1d1e21 9.5% 30%, #26282c 31% 33%, #1a1b1e 34% 82%, #2b2d31 83% 92%, #141517 93% 100%);
        box-shadow: 0 30px 60px rgba(0,0,0,.6); opacity: .85; }
      #plate b { position: absolute; left: 0; right: 0; top: 140px; text-align: center; font: 500 34px/1 "Chivo Mono", monospace; letter-spacing: .3em; color: #3a3c41; }
      .hw { position: absolute; left: 70px; font: 400 320px/0.86 "Anton", Impact, sans-serif; text-transform: uppercase; letter-spacing: -0.01em; color: var(--ink); filter: url(#rough); transform-origin: 0% 60%; }
      #h1 { top: 270px; }
      #h2 { top: 545px; }
      .num { position: absolute; left: 0; right: 0; top: 820px; text-align: center; font: 400 420px/1 "Anton", Impact, sans-serif; color: var(--acc); font-variant-numeric: tabular-nums; opacity: 0; }
      #top { position: absolute; left: 70px; top: 262px; font: 500 30px/1 "Chivo Mono", monospace; letter-spacing: .14em; color: var(--chalk); text-transform: uppercase; }
      #strip { position: absolute; left: 70px; right: 70px; top: 1330px; display: flex; justify-content: space-between; align-items: center; font: 500 30px/1 "Chivo Mono", monospace; letter-spacing: .14em; color: var(--chalk); text-transform: uppercase; }
      #slots { display: flex; gap: 14px; }
      #slots span { width: 48px; height: 48px; border: 2px solid #3a3c41; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--ink); font: 400 30px/1 "Anton", Impact, sans-serif; letter-spacing: 0; }
      #slots span i { font-style: normal; opacity: 0; }
      #cap { position: absolute; left: 0; right: 0; top: 1440px; text-align: center; font: 700 76px/1 "Barlow Condensed", sans-serif; text-transform: uppercase; color: var(--ink); }
      #cap span { display: inline-block; margin: 0 10px; }
      #pr { position: absolute; left: 600px; top: 1530px; padding: 6px 30px 0; background: var(--acc); color: var(--bg); font: 400 150px/1 "Anton", Impact, sans-serif; opacity: 0; }
      #prw { position: absolute; left: 70px; top: 1610px; font: 500 30px/1.6 "Chivo Mono", monospace; letter-spacing: .14em; color: var(--chalk); white-space: pre; }
      #flash { position: absolute; inset: 0; background: #f4f4f0; opacity: 0; z-index: 6; }
    </style>
  </head>
  <body>
    <svg width="0" height="0" style="position:absolute"><filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="1" seed="4" /><feDisplacementMap in="SourceGraphic" scale="3" /></filter></svg>
    <div id="root" class="mf-stage" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1080" data-height="1920">
      <div id="world" class="clip" data-start="0" data-duration="4.5" data-track-index="0">
        <div id="plate"><b>20 KG</b></div>
        <div id="h1" class="hw">Gym</div>
        <div id="h2" class="hw">Hype</div>
        <div id="nums"></div>
        <div id="top">Gym hype · set 3 · 120 kg</div>
        <div id="strip"><span>Set 3 · Reps</span><span id="slots"></span></div>
        <div id="cap"><span>Drive</span><span>through</span><span>the floor</span></div>
        <div id="pr">PR</div>
        <div id="prw"></div>
      </div>
      <div id="flash" class="clip" data-start="0" data-duration="4.5" data-track-index="1"></div>
    </div>

    <script>
      const DUR = 4.5, FR = 1 / 30;
      const tl = MF.timeline("main", DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;   // explicit registration (MF.timeline already does this)
      const sh = MF.rng("gym-shake");
      const shake = (at, px = 6, frames = 4) => {
        for (let i = 0; i < frames; i++) tl.set("#world", { x: sh.range(-px, px), y: sh.range(-px, px) }, at + i * FR);
        tl.set("#world", { x: 0, y: 0 }, at + frames * FR);
      };
      // headline slams
      [["#h1", 0.1], ["#h2", 0.38]].forEach(([s, at]) => {
        tl.fromTo(s, { scale: 1.35, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.14, ease: "power4.out" }, at);
        shake(at + 0.1);
      });
      tl.fromTo("#plate", { opacity: 0, scale: 0.9 }, { opacity: 0.85, scale: 1, duration: 0.3, ease: "power2.out" }, 0.55);
      // headline leaves when the counter arrives
      tl.to(["#h1", "#h2"], { scale: 0.92, opacity: 0, duration: 0.1 }, 0.98);
      tl.fromTo(["#strip", "#top"], { opacity: 0 }, { opacity: 1, duration: 0.15 }, 1.0);
      const nums = document.getElementById("nums"), slots = document.getElementById("slots");
      const REPS = [1.05, 1.6, 2.15, 2.7, 3.25];
      REPS.forEach((t, i) => {
        const n = document.createElement("div"); n.className = "num"; n.textContent = i + 1; nums.appendChild(n);
        const sl = document.createElement("span"); sl.innerHTML = `<i>${i + 1}</i>`; slots.appendChild(sl);
        tl.fromTo(n, { y: -80, opacity: 0 }, { y: 0, opacity: 1, duration: 0.18, ease: "back.out(2.2)" }, t);
        tl.fromTo("#world", { scale: 1.06 }, { scale: 1, duration: 0.35, ease: "power2.out", immediateRender: false }, t + 0.05);
        tl.to("#plate", { rotation: (i + 1) * 9, duration: 0.25, ease: "power2.out" }, t);
        // the previous numeral leaves for the label strip (as a 30 px chalk mark)
        if (i < REPS.length - 1) {
          tl.to(n, { opacity: 0, scale: 0.2, y: 420, duration: 0.15, ease: "power2.in" }, REPS[i + 1] - 0.02);
          tl.to(sl.querySelector("i"), { opacity: 1, duration: 0.05 }, REPS[i + 1] + 0.1);
          tl.to(sl, { borderColor: "#bdbdb5", duration: 0.05 }, REPS[i + 1] + 0.1);
        }
      });
      // caption chunks, the active word in accent
      const cw = document.querySelectorAll("#cap span");
      tl.fromTo(cw, { opacity: 0 }, { opacity: 1, duration: 0.01, stagger: 0.55 }, 1.05);
      cw.forEach((w, i) => {
        tl.to(w, { color: "#ff4d00", duration: 0.01 }, 1.05 + i * 0.55);
        tl.to(w, { color: "#f4f4f0", duration: 0.01 }, 1.6 + i * 0.55);
      });
      tl.to("#cap", { opacity: 0, duration: 0.1 }, 3.2);
      // PR stamp on the last lockout: one white flash frame, tag rotates -6 deg and lands with a shake
      const last = REPS[REPS.length - 1];
      tl.set("#flash", { opacity: 0.7 }, last + 0.45);
      tl.set("#flash", { opacity: 0 }, last + 0.45 + FR);
      tl.fromTo("#pr", { opacity: 0, scale: 1.4, rotation: 4 }, { opacity: 1, scale: 1, rotation: -6, duration: 0.16, ease: "power4.out" }, last + 0.45);
      shake(last + 0.58);
      tl.to(slots.lastChild.querySelector("i"), { opacity: 1, duration: 0.05 }, last + 0.45);
      tl.to(slots.lastChild, { borderColor: "#ff4d00", duration: 0.05 }, last + 0.45);
      // weight types on at 20 chars/s
      const prw = document.getElementById("prw"), TXT = "120 KG × 5 · SAMPLE";
      const ty = { n: 0 };
      tl.fromTo(ty, { n: 0 }, { n: TXT.length, duration: TXT.length / 20, ease: "none", onUpdate: () => { prw.textContent = TXT.slice(0, Math.round(ty.n)); } }, last + 0.6);
      tl.seek(0);
    </script>
  </body>
</html>
