    <script>
      const DUR = 4.5;
      // [number, sign, text]; sign: " " context, "-" removed, "+" added
      const LINES = [
        [1, " ", 'import { sleep } from "./time";'],
        [2, " ", ""],
        [3, " ", "async function load(url, tries = 3) {"],
        [4, " ", "  for (let i = 0; i < tries; i++) {"],
        [5, " ", "    try {"],
        [6, " ", "      return await get(url);"],
        [7, " ", "    } catch (err) {"],
        [8, "-", "      throw err;"],
        [8, "+", "      if (i === tries - 1) throw err;"],
        [9, "+", "      await sleep(200 * 2 ** i);"],
        [10, " ", "    }"],
        [11, " ", "  }"],
        [12, " ", "}"],
      ];
      const KW = new Set(["import", "from", "async", "function", "for", "let", "try", "return", "await", "catch", "throw", "if"]);
      // tokenise once into [text, class] pairs so a typed prefix keeps its colours
      function tokens(src) {
        const out = []; const re = /("[^"]*")|(\b[A-Za-z_]+\b)|(\d+)|(\s+)|([^\sA-Za-z_\d"]+)/g; let m;
        while ((m = re.exec(src))) {
          if (m[1]) out.push([m[1], "s"]);
          else if (m[2]) out.push([m[2], KW.has(m[2]) ? "k" : ""]);
          else if (m[3]) out.push([m[3], "s"]);
          else out.push([m[0], ""]);
        }
        return out;
      }
      const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
      function html(tok, n) {
        let s = "", left = n;
        for (const [t, c] of tok) { if (left <= 0) break; const p = t.slice(0, left); left -= p.length; s += c ? `<span class="${c}">${esc(p)}</span>` : esc(p); }
        return s;
      }
      const code = document.getElementById("code");
      const rows = LINES.map(([n, sg, tx], i) => {
        const r = document.createElement("div");
        r.className = "row" + (sg === "-" ? " rem" : sg === "+" ? " add" : "");
        r.id = "r" + i;
        r.innerHTML = `<div class="bg"></div><div class="num">${n}</div><div class="sg">${sg === "-" ? "−" : sg === "+" ? "+" : ""}</div><div class="tx"></div>` + (sg === "-" ? '<div class="strike"></div>' : "");
        const tok = tokens(tx);
        r.querySelector(".tx").innerHTML = sg === "+" ? "" : html(tok, 999);
        if (sg === "+") r.style.height = "0px";
        code.appendChild(r);
        return { el: r, tok, len: tx.length };
      });

      const tl = MF.timeline("main", DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.fromTo("#title", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.05);
      tl.fromTo("#sub", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.3);
      tl.fromTo("#editor", { opacity: 0, y: 80 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.15);
      tl.fromTo(".row:not(.add)", { opacity: 0 }, { opacity: 1, duration: 0.15, stagger: 0.03 }, 0.4);
      // removed line: tint, strike, collapse
      tl.to("#r7 .bg", { opacity: 1, duration: 0.25 }, 1.15);
      tl.to("#r7 .strike", { scaleX: 1, duration: 0.3, ease: "power2.out" }, 1.35);
      tl.set("#cm", { textContent: "1" }, 1.4);
      tl.to("#r7", { height: 0, duration: 0.35, ease: "power2.inOut" }, 1.75);
      // added lines: open, type at 40 chars/s
      [8, 9].forEach((ri, k) => {
        const at = 2.0 + k * 0.55;
        tl.to("#r" + ri, { height: 51, duration: 0.3, ease: "power2.inOut" }, at);
        const row = rows[ri], tx = row.el.querySelector(".tx"), p = { n: 0 };
        tl.to(p, { n: row.len, duration: row.len / 40, ease: "none", onUpdate: () => { tx.innerHTML = html(row.tok, Math.round(p.n)); } }, at + 0.1);
        tl.set("#cp", { textContent: String(k + 1) }, at + 0.1);
      });
      tl.fromTo("#count", { scale: 1 }, { scale: 1.15, duration: 0.12, yoyo: true, repeat: 1 }, 2.1);
      // review pin + bubble + underline on the new token
      const ROW_Y = 84 + 8 * 51; // line 9 after the collapse
      gsap.set("#pin", { top: ROW_Y + 2 });
      gsap.set("#uline", { left: 114 + 12 * 20.4, top: 84 + 8 * 51 + 44, width: 19 * 20.4 });
      gsap.set("#lead", { left: 100, top: 450 + ROW_Y + 48, height: 1190 - 450 - ROW_Y - 48 });
      tl.fromTo("#pin", { y: -60, opacity: 0, rotate: -45 }, { y: 0, opacity: 1, rotate: -45, duration: 0.35, ease: "back.out(2)" }, 3.05);
      tl.to("#uline", { scaleX: 1, duration: 0.3, ease: "power2.out" }, 3.2);
      tl.fromTo("#lead", { scaleY: 0 }, { scaleY: 1, duration: 0.2, ease: "none" }, 3.25);
      tl.fromTo("#bubble", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.6)" }, 3.35);
      tl.fromTo("#tests", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 3.75);
      tl.seek(0);
