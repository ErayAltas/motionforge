  Signature scenes "string pull" + "redaction lift" + "circle the name": items are pinned (scale 1.08 -> 1,
  pin pushes in 0.08 s later), the index card types one glyph every 2 frames, a red string leaves pin A
  and follows a sag curve to pin B (0.7 s power2.inOut, 6 px overshoot, then tightens) while the camera
  pans with it, focus racks to the receipt (others blur 3 px, darken 30 %), the black bar over the line being read
  wipes off left to right in 0.35 s, and a red ellipse (1.15 loops) circles the time.
  The case, times and documents are fictional; the "photos" are vector illustrations, labelled as such.
  Anton + Special Elite + Archivo Narrow.
-->

      #circ { position: absolute; left: 0; top: 0; overflow: visible; z-index: 2; }
      #cap { position: absolute; left: 70px; top: 1490px; width: 900px; padding: 20px 26px; background: var(--paper); transform: rotate(-0.6deg); box-shadow: 0 10px 20px rgba(0,0,0,.45);

  <body>

          <div class="img"><svg width="364" height="278" viewBox="0 0 364 278"><defs><linearGradient id="n1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d2733" /><stop offset="1" stop-color="#3b4048" /></linearGradient>
            <radialGradient id="l1" cx=".72" cy=".25" r=".6"><stop offset="0" stop-color="#e9d9a8" stop-opacity=".75" /><stop offset="1" stop-color="#e9d9a8" stop-opacity="0" /></radialGradient></defs>

            <rect y="210" width="364" height="68" fill="#2a2d31" /><path d="M60 214 q10 -40 50 -44 h70 q30 2 46 30 l26 6 q12 4 12 16 v14 h-212 v-14 q0 -10 8 -8z" fill="#0f1216" /><circle cx="96" cy="234" r="16" fill="#08090b" /><circle cx="226" cy="234" r="16" fill="#08090b" />
            <g stroke="#e9e3cf" stroke-opacity=".35" stroke-width="3"><line x1="20" y1="262" x2="80" y2="262" /><line x1="140" y1="262" x2="200" y2="262" /><line x1="260" y1="262" x2="320" y2="262" /></g></svg></div>

            <circle cx="162" cy="118" r="58" fill="#24272b" /><path d="M52 298 q8 -112 110 -112 q102 0 110 112z" fill="#24272b" /></svg></div><div class="lbl">WITNESS 2 · SILHOUETTE</div></div>

------------

WATER       1.10
TIME   <span id="tm">21:49</span>
CARD   •••• 7731</div>

          <div class="bar" id="b3" style="left:26px;top:378px;width:300px"></div>

          <path id="s1" fill="none" stroke="#7c0b14" stroke-width="5" stroke-linecap="round" /><path id="s1c" fill="none" stroke="#c1121f" stroke-width="3" stroke-linecap="round" /></svg>

      <div id="note" class="clip" data-start="0" data-duration="4.5" data-track-index="7">ILLUSTRATION · FICTIONAL CASE</div>

    <script>
      const DUR = 4.5;
      // pin centres in board coordinates (items carry small rotations; close enough for a sagging string)
      const pinPos = (id) => { const p = document.getElementById(id), it = p.parentElement; return [it.offsetLeft + p.offsetLeft + 15, it.offsetTop + p.offsetTop + 15]; };
      const A = pinPos("pA"), B = pinPos("pB"), C = pinPos("pC");
      function sag(a, b, k, extra) { const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2 + Math.hypot(b[0] - a[0], b[1] - a[1]) * k + (extra || 0); return `M${a[0]} ${a[1]} Q${mx} ${my} ${b[0]} ${b[1]}`; }
      const setS = (n, d) => { document.getElementById(n).setAttribute("d", d); document.getElementById(n + "c").setAttribute("d", d); };
      setS("s0", sag(A, B, 0.06));
      // typewriter card: seeded ink density per glyph
      const r = MF.rng("true-crime-board"), TXT = "TUE 14 MAR\n21:40  CALL IN\n4 MIN 12 S";
      const tw = document.getElementById("twB");
      tw.innerHTML = [...TXT].map((ch) => ch === "\n" ? "\n" : `<span style="opacity:0" data-o="${r.range(0.85, 1).toFixed(2)}">${ch}</span>`).join("");
      const glyphs = [...tw.querySelectorAll("span")];
      // hand-drawn ellipse with 1.15 loops around the time
      const ellPts = []; const E = { cx: 842, cy: 1244, rx: 100, ry: 38 };
      for (let i = 0; i <= 80; i++) { const a = -2.6 + i / 80 * 2 * Math.PI * 1.15, w = 1 + 0.06 * Math.sin(i * 0.4); ellPts.push(`${(E.cx + Math.cos(a) * E.rx * w).toFixed(1)},${(E.cy + Math.sin(a) * E.ry * w + i * 0.08).toFixed(1)}`); }
      const ell = document.getElementById("ell"); ell.setAttribute("d", "M" + ellPts.join(" L"));
      const EL = ell.getTotalLength(); ell.setAttribute("stroke-dasharray", `${EL} ${EL}`); ell.setAttribute("stroke-dashoffset", EL);

      const tl = MF.timeline("main", DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      // slow camera drift (2 % of frame per second), plus the pan that follows the string; the cork stays put
      // (a moving noise texture makes every GIF frame unique)
      tl.fromTo("#board", { x: 0, y: 0, scale: 1 }, { x: -20, y: -30, scale: 1.02, duration: 1.6, ease: "none" }, 0);
      tl.fromTo(["#title", "#file"], { opacity: 0 }, { opacity: 1, duration: 0.3, stagger: 0.15 }, 0.05);
      // pin items: scale 1.08 -> 1 in 0.25 s power4.out, the pin pushes in 0.08 s later with a 2 px settle
      [["#iA", "#pA", 0.2], ["#iB", "#pB", 0.4], ["#iD", "#pD", 0.6], ["#iC", "#pC", 0.8]].forEach(([it, pin, at]) => {
        tl.fromTo(it, { opacity: 0, scale: 1.08 }, { opacity: 1, scale: 1, duration: 0.25, ease: "power4.out" }, at);
        tl.fromTo(pin, { scale: 1.6, y: -8 }, { scale: 1, y: 2, duration: 0.08, ease: "power2.in" }, at + 0.08);
        tl.to(pin, { y: 0, duration: 0.06 }, at + 0.16);
      });
      tl.fromTo(["#s0", "#s0c"], { opacity: 0 }, { opacity: 1, duration: 0.2 }, 0.55);
      // typing: one glyph every 2 frames
      glyphs.forEach((g, i) => tl.set(g, { opacity: +g.dataset.o }, 0.7 + i * 2 / 30));
      // string pull B -> C: 0.7 s power2.inOut along the sag, 6 px overshoot, then tightens
      const pull = { v: 0, extra: 0 };
      const drawPull = () => { const v = pull.v, end = [B[0] + (C[0] - B[0]) * v, B[1] + (C[1] - B[1]) * v + Math.sin(v * Math.PI) * 40]; setS("s1", sag(B, end, 0.06 * v, pull.extra)); };
      tl.fromTo(pull, { v: 0 }, { v: 1.03, duration: 0.7, ease: "power2.inOut", onUpdate: drawPull }, 1.65);
      tl.to(pull, { v: 1, extra: -10, duration: 0.15, ease: "power2.out", onUpdate: drawPull }, 2.35);
      tl.to("#board", { x: -60, y: -70, scale: 1.06, duration: 0.7, ease: "power2.inOut" }, 1.65);
      // rack focus to the receipt
      tl.to(["#iA", "#iB", "#iD"], { filter: "blur(3px) brightness(.7)", duration: 0.4 }, 2.4);
      // redaction lift: bars wipe off left to right, 0.35 s each, 0.15 s stagger; the TIME line is the one read
      tl.to("#b2", { scaleX: 0, duration: 0.35, ease: "power2.inOut" }, 2.75);
      // circle the time
      tl.to(ell, { attr: { "stroke-dashoffset": 0 }, duration: 0.45, ease: "power1.inOut" }, 3.4);
      tl.fromTo("#cap", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 3.0);
      tl.fromTo("#note", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 3.2);
      tl.seek(0);
    </script>
