<!doctype html>
<!--
  motionforge style preview: before-after-split
  © 2026 motionforge contributors, MIT
  One room drawn twice from the identical viewpoint (original SVG illustration, not a real renovation):
  the divider enters from x 1080 to 540 (0.9 s power2.inOut), pauses 0.6 s, scrubs to 160 and 920 (0.5 s
  sine.inOut each) and returns; then two mint callout arrows draw on with 3-word labels.
  Dates and the room are sample content. Fonts: Barlow Condensed, Barlow (Fontsource, OFL).
-->
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/mf-runtime.js"></script>
    <link rel="stylesheet" href="assets/base.css" />
    <style>
      /* fonts:begin */
      @font-face { font-family: "Barlow Condensed"; font-style: normal; font-weight: 600; font-display: block; src: url("assets/fonts/barlow-condensed-latin-600-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+20AC, U+20BA, U+2122, U+2190-2193, U+2212; }
      @font-face { font-family: "Barlow Condensed"; font-style: normal; font-weight: 600; font-display: block; src: url("assets/fonts/barlow-condensed-latin-ext-600-normal.woff2") format("woff2"); unicode-range: U+0100-0130, U+0132-0151, U+0154-024F, U+1E00-1EFF; }
      @font-face { font-family: "Barlow Condensed"; font-style: normal; font-weight: 700; font-display: block; src: url("assets/fonts/barlow-condensed-latin-700-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+20AC, U+20BA, U+2122, U+2190-2193, U+2212; }
      @font-face { font-family: "Barlow Condensed"; font-style: normal; font-weight: 700; font-display: block; src: url("assets/fonts/barlow-condensed-latin-ext-700-normal.woff2") format("woff2"); unicode-range: U+0100-0130, U+0132-0151, U+0154-024F, U+1E00-1EFF; }
      @font-face { font-family: "Barlow"; font-style: normal; font-weight: 500; font-display: block; src: url("assets/fonts/barlow-latin-500-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+20AC, U+20BA, U+2122, U+2190-2193, U+2212; }
      @font-face { font-family: "Barlow"; font-style: normal; font-weight: 500; font-display: block; src: url("assets/fonts/barlow-latin-ext-500-normal.woff2") format("woff2"); unicode-range: U+0100-0130, U+0132-0151, U+0154-024F, U+1E00-1EFF; }
      /* fonts:end */
      :root { --bg: #15171A; --ink: #F4F5F6; --acc: #3DDC97; --sup: #9AA0A6; --plate: #2A2D31; --mf-grain-opacity: .04; }
      html, body { background: var(--bg); }
      #root { background: radial-gradient(1000px 700px at 50% 10%, #1e2125 0%, transparent 70%), var(--bg); }
      #hook { position: absolute; left: 40px; right: 40px; top: 236px; font: 700 116px/0.95 "Barlow Condensed", sans-serif; letter-spacing: .01em; text-transform: uppercase; color: var(--ink); }
      #hook span { color: var(--acc); }
      #cmp { position: absolute; left: 40px; top: 400px; width: 1000px; height: 1080px; border-radius: 24px; overflow: hidden; border: 2px solid var(--plate); }
      #cmp svg { position: absolute; left: 0; top: 0; width: 1000px; height: 1080px; }
      #after { clip-path: inset(0 0 0 100%); }
      .tag { position: absolute; top: 430px; padding: 12px 20px; border-radius: 10px; background: var(--plate); font: 600 34px/1 "Barlow Condensed", sans-serif; letter-spacing: .12em; text-transform: uppercase; color: var(--sup); z-index: 3; }
      #tb { left: 70px; } #ta { right: 70px; color: var(--acc); }
      #div { position: absolute; top: 400px; left: 0; width: 4px; height: 1080px; margin-left: -2px; background: #fff; z-index: 4; box-shadow: 0 0 12px rgba(0,0,0,.35); }
      #handle { position: absolute; left: -34px; top: 504px; width: 72px; height: 72px; border-radius: 50%; background: var(--acc); box-shadow: 0 0 0 6px var(--plate), 0 8px 18px rgba(0,0,0,.4); }
      #handle svg { position: absolute; inset: 0; }
      #arrows { position: absolute; left: 40px; top: 400px; width: 1000px; height: 1080px; z-index: 5; overflow: visible; }
      #arrows path { fill: none; stroke: var(--acc); stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
      .al { position: absolute; padding: 10px 16px; border-radius: 10px; background: var(--plate); font: 600 34px/1 "Barlow Condensed", sans-serif; letter-spacing: .06em; text-transform: uppercase; color: var(--ink); z-index: 6; }
      #al1 { left: 560px; top: 540px; } #al2 { left: 610px; top: 1330px; }
      #cap { position: absolute; left: 40px; right: 40px; top: 1530px; display: flex; justify-content: space-between; font: 500 44px/1 "Barlow", sans-serif; color: var(--ink); }
      #cap small { font: 500 26px/1.4 "Barlow", sans-serif; color: var(--sup); text-align: right; }
    </style>
  </head>
  <body>
    <div id="root" class="mf-stage" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1080" data-height="1920">
      <div id="hook" class="clip" data-start="0" data-duration="4.5" data-track-index="0">Before / <span>after</span> split</div>
      <div id="cmp" class="clip" data-start="0" data-duration="4.5" data-track-index="1">
        <svg id="before" viewBox="0 0 1000 1080" aria-hidden="true">
          <defs>
            <linearGradient id="bw" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#77746e"/><stop offset="1" stop-color="#8f8b84"/></linearGradient>
            <filter id="bb"><feGaussianBlur stdDeviation="16"/></filter>
          </defs>
          <rect width="1000" height="830" fill="url(#bw)"/>
          <g filter="url(#bb)" fill="#5e5a53" opacity=".55"><ellipse cx="180" cy="300" rx="120" ry="70"/><ellipse cx="820" cy="560" rx="90" ry="140"/><ellipse cx="560" cy="120" rx="160" ry="40"/></g>
          <path d="M760 120 L 740 220 L 770 300 L 750 420" stroke="#4f4b45" stroke-width="3" fill="none"/>
          <path d="M120 520 L 180 560 L 170 640" stroke="#4f4b45" stroke-width="3" fill="none"/>
          <rect x="230" y="560" width="300" height="200" fill="#a29d94" opacity=".45"/>
          <path d="M500 0 V 250" stroke="#2b2a28" stroke-width="4"/>
          <circle cx="500" cy="270" r="22" fill="#f4eccf"/><circle cx="500" cy="270" r="60" fill="#f4eccf" opacity=".12"/>
          <g transform="rotate(5 620 420)"><rect x="470" y="410" width="320" height="16" fill="#5d564d"/><rect x="500" y="352" width="70" height="58" fill="#8a7a62"/><rect x="590" y="372" width="50" height="38" fill="#7a6b55"/></g>
          <rect y="830" width="1000" height="250" fill="#6b6052"/>
          <path d="M0 900 H1000 M0 980 H1000" stroke="#5c5246" stroke-width="3"/>
          <rect x="300" y="640" width="400" height="200" fill="#6c655c"/><rect x="300" y="640" width="400" height="14" fill="#7c756b"/>
          <rect x="316" y="668" width="178" height="160" fill="#655e55" stroke="#5a544c" stroke-width="3"/>
          <rect x="506" y="668" width="178" height="160" fill="#5f5850" stroke="#5a544c" stroke-width="3" transform="rotate(2 506 668)"/>
          <rect x="110" y="900" width="160" height="110" fill="#a07d52"/><path d="M110 930 h160" stroke="#8a6a44" stroke-width="4"/>
          <rect y="0" width="1000" height="1080" fill="#000" opacity=".12"/>
        </svg>
        <svg id="after" viewBox="0 0 1000 1080" aria-hidden="true">
          <defs>
            <radialGradient id="aw" cx=".5" cy=".28" r=".75"><stop offset="0" stop-color="#a9bfa9"/><stop offset=".6" stop-color="#7f9a85"/><stop offset="1" stop-color="#6a8571"/></radialGradient>
            <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffe7b8" stop-opacity=".7"/><stop offset="1" stop-color="#ffe7b8" stop-opacity="0"/></radialGradient>
            <linearGradient id="oak" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c99a66"/><stop offset="1" stop-color="#a87a4a"/></linearGradient>
          </defs>
          <rect width="1000" height="830" fill="url(#aw)"/>
          <circle cx="500" cy="300" r="260" fill="url(#glow)"/>
          <path d="M500 0 V 210" stroke="#2b2a28" stroke-width="4"/>
          <path d="M420 270 C 420 210 580 210 580 270Z" fill="#2f3a33"/><ellipse cx="500" cy="270" rx="80" ry="10" fill="#ffe2a8"/>
          <rect x="250" y="400" width="200" height="200" fill="#efe8da" stroke="#2f2c28" stroke-width="10"/>
          <circle cx="330" cy="480" r="46" fill="#d9825b"/><rect x="340" y="500" width="80" height="70" fill="#3d5a6b"/>
          <rect x="560" y="430" width="300" height="14" fill="#9c744a"/>
          <rect x="580" y="370" width="22" height="60" fill="#3d5a6b"/><rect x="606" y="380" width="18" height="50" fill="#d9a441"/><rect x="628" y="364" width="24" height="66" fill="#e9e1d3"/>
          <path d="M770 430 h50 l-6 -46 h-38Z" fill="#efe9de"/><path d="M795 384 C 770 340 760 330 742 316 C 780 320 790 340 795 384 C 800 340 820 320 852 314 C 830 334 810 350 795 384Z" fill="#4f7d4b"/>
          <rect y="830" width="1000" height="250" fill="#a8835e"/>
          <path d="M0 900 H1000 M0 980 H1000" stroke="#9a7652" stroke-width="3"/>
          <ellipse cx="500" cy="960" rx="380" ry="70" fill="#d8cbb5"/><ellipse cx="500" cy="960" rx="340" ry="56" fill="none" stroke="#c4b498" stroke-width="6"/>
          <rect x="300" y="640" width="400" height="200" fill="url(#oak)"/><rect x="300" y="640" width="400" height="14" fill="#d8ab78"/>
          <rect x="316" y="668" width="178" height="160" fill="#b88b5a" stroke="#a07548" stroke-width="3"/>
          <rect x="506" y="668" width="178" height="160" fill="#b88b5a" stroke="#a07548" stroke-width="3"/>
          <rect x="470" y="730" width="12" height="40" rx="6" fill="#d9b25c"/><rect x="518" y="730" width="12" height="40" rx="6" fill="#d9b25c"/>
          <path d="M330 640 v-30 h40 v30Z" fill="#efe9de"/><path d="M350 610 C 340 570 330 560 316 552 C 344 556 350 570 350 610 C 356 572 370 556 392 552 C 376 566 362 580 350 610Z" fill="#5d8a55"/>
        </svg>
      </div>
      <div id="tb" class="tag clip" data-start="0" data-duration="4.5" data-track-index="2">Before</div>
      <div id="ta" class="tag clip" data-start="0" data-duration="4.5" data-track-index="3">After</div>
      <div id="div" class="clip" data-start="0" data-duration="4.5" data-track-index="4"><div id="handle"><svg viewBox="0 0 72 72"><path d="M28 24 L 16 36 L 28 48 M44 24 L 56 36 L 44 48" fill="none" stroke="#15171A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>
      <svg id="arrows" class="clip" viewBox="0 0 1000 1080" data-start="0" data-duration="4.5" data-track-index="5">
        <path id="a1" d="M700 210 C 740 240 760 280 760 330"/><path id="h1" d="M740 308 L 760 334 L 780 308"/>
        <path id="a2" d="M690 920 C 680 880 665 850 650 800"/><path id="h2" d="M630 818 L 650 792 L 670 818"/>
      </svg>
      <div id="al1" class="al clip" data-start="0" data-duration="4.5" data-track-index="6">Level oak shelf</div>
      <div id="al2" class="al clip" data-start="0" data-duration="4.5" data-track-index="7">Oak, brass handles</div>
      <div id="cap" class="clip" data-start="0" data-duration="4.5" data-track-index="8"><span>Day 1 → Day 14</span><small>same angle, same light<br />illustrated sample</small></div>
    </div>

    <script>
      const DUR = 4.5;
      const tl = MF.timeline("main", DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      // the divider position X (screen px) drives both the line and the after-side clip
      const X = { v: 1080 };
      const after = document.getElementById("after"), dv = document.getElementById("div");
      const apply = () => { dv.style.transform = `translateX(${X.v}px)`; after.style.clipPath = `inset(0 0 0 ${Math.max(0, X.v - 40)}px)`; };
      apply();
      tl.fromTo("#hook", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 0);
      tl.fromTo("#tb", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 0.1);
      tl.fromTo(X, { v: 1080 }, { v: 540, duration: 0.9, ease: "power2.inOut", onUpdate: apply }, 0);
      tl.fromTo("#ta", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 0.5);
      tl.to(X, { v: 160, duration: 0.5, ease: "sine.inOut", onUpdate: apply }, 1.5);
      tl.to(X, { v: 920, duration: 0.5, ease: "sine.inOut", onUpdate: apply }, 2.0);
      tl.to(X, { v: 540, duration: 0.5, ease: "sine.inOut", onUpdate: apply }, 2.5);
      // callout arrows on the after side: draw 0.3 s, arrowhead pops back.out(2) 0.15 s, label follows
      [["#a1", "#h1", "#al1", 3.05], ["#a2", "#h2", "#al2", 3.3]].forEach(([a, h, l, t]) => {
        const p = document.querySelector(a), L = p.getTotalLength();
        gsap.set(p, { strokeDasharray: L, strokeDashoffset: L, opacity: 0 }); gsap.set(h, { opacity: 0 });
        tl.set(p, { opacity: 1 }, t);
        tl.to(p, { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, t);
        tl.fromTo(h, { opacity: 0, scale: 0.3, transformOrigin: "50% 100%" }, { opacity: 1, scale: 1, duration: 0.15, ease: "back.out(2)" }, t + 0.27);
        tl.fromTo(l, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.2, ease: "power2.out" }, t + 0.1);
      });
      tl.fromTo("#cap", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.6);
      tl.seek(0);
    </script>
  </body>
</html>
