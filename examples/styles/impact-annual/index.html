<!doctype html>
<!--
  motionforge style preview: impact-annual
  © 2026 motionforge contributors, MIT
  Signature scene: the tally bundle. Marks draw in fives (0.08 s each, the fifth crossing stroke 0.12 s)
  under a key ("each mark = 2,000 people"); the bundles slide together (0.6 s power3.inOut) and turn into
  the deep-green total, which counts its last 15 % in 0.5 s; the label slides 30 px, the footnote fades in.
  A 100 % split bar follows (segments sum to 100). The organisation and all figures are fictional sample
  data, labelled on screen. Bricolage Grotesque + Karla + Azeret Mono.
-->
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/mf-runtime.js"></script>
    <link rel="stylesheet" href="assets/base.css" />
    <style>
      /* fonts: @fontsource/bricolage-grotesque, @fontsource/karla, @fontsource/azeret-mono (copied from node_modules/@fontsource/<family>/files/) */
      @font-face { font-family: "Bricolage Grotesque"; font-weight: 800; font-style: normal; font-display: block; src: url("assets/fonts/bricolage-grotesque-latin-800-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+20AC, U+20BA, U+2122, U+2190-2193, U+2212; }
      @font-face { font-family: "Bricolage Grotesque"; font-weight: 800; font-style: normal; font-display: block; src: url("assets/fonts/bricolage-grotesque-latin-ext-800-normal.woff2") format("woff2"); unicode-range: U+0100-0130, U+0132-0151, U+0154-024F, U+1E00-1EFF; }
      @font-face { font-family: "Karla"; font-weight: 500; font-style: normal; font-display: block; src: url("assets/fonts/karla-latin-500-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+20AC, U+20BA, U+2122, U+2190-2193, U+2212; }
      @font-face { font-family: "Karla"; font-weight: 500; font-style: normal; font-display: block; src: url("assets/fonts/karla-latin-ext-500-normal.woff2") format("woff2"); unicode-range: U+0100-0130, U+0132-0151, U+0154-024F, U+1E00-1EFF; }
      @font-face { font-family: "Azeret Mono"; font-weight: 400; font-style: normal; font-display: block; src: url("assets/fonts/azeret-mono-latin-400-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+20AC, U+20BA, U+2122, U+2190-2193, U+2212; }
      @font-face { font-family: "Azeret Mono"; font-weight: 400; font-style: normal; font-display: block; src: url("assets/fonts/azeret-mono-latin-ext-400-normal.woff2") format("woff2"); unicode-range: U+0100-0130, U+0132-0151, U+0154-024F, U+1E00-1EFF; }
      :root { --paper: #F3EBDD; --ink: #1D2A26; --acc: #1F7A5C; --clay: #C9A27E; --mut: #8E8A80; --mf-grain-opacity: 0.05; }
      html, body { background: var(--paper); }
      #root { background: radial-gradient(900px 1000px at 50% 45%, #FAF5EC 0%, transparent 70%), var(--paper); color: var(--ink); }
      #root::before { mix-blend-mode: multiply; }
      #root::after { background: radial-gradient(ellipse at 50% 50%, transparent 65%, rgba(90,70,40,.10) 100%); }
      #fib { position: absolute; inset: 0; width: 1080px; height: 1920px; }
      #kick { position: absolute; left: 80px; top: 262px; font: 400 26px/1 "Azeret Mono"; letter-spacing: .06em; color: var(--mut); text-transform: uppercase; }
      #title { position: absolute; left: 80px; right: 80px; top: 300px; font: 800 100px/1 "Bricolage Grotesque"; letter-spacing: -0.03em; }
      #tally { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      #tally path { fill: none; stroke: var(--ink); stroke-width: 10; stroke-linecap: round; }
      #tally path.x { stroke: var(--acc); }
      #key { position: absolute; left: 80px; top: 860px; font: 500 40px/1 "Karla"; color: var(--ink); display: flex; align-items: center; gap: 16px; }
      #key i { width: 8px; height: 46px; border-radius: 4px; background: var(--ink); }
      #num { position: absolute; left: 0; right: 0; top: 520px; text-align: center; font: 800 236px/1 "Bricolage Grotesque"; letter-spacing: -0.04em; color: var(--acc); font-variant-numeric: tabular-nums; }
      #nlab { position: absolute; left: 0; right: 0; top: 790px; text-align: center; font: 500 48px/1.2 "Karla"; }
      #split { position: absolute; left: 80px; right: 80px; top: 1060px; }
      #splab { font: 500 36px/1 "Karla"; margin-bottom: 26px; }
      #bar { position: relative; height: 90px; }
      .sg { position: absolute; top: 0; height: 90px; transform-origin: left; }
      .sl { position: absolute; top: 110px; font: 500 32px/1.25 "Karla"; }
      .sl b { display: block; font: 800 54px/1 "Bricolage Grotesque"; letter-spacing: -0.02em; }
      #foot { position: absolute; left: 80px; right: 80px; top: 1600px; font: 400 25px/1.5 "Azeret Mono"; color: var(--mut); }
    </style>
  </head>
  <body>
    <div id="root" class="mf-stage light" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1080" data-height="1920">
      <svg id="fib" viewBox="0 0 1080 1920"><filter id="ff" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.012 0.25" numOctaves="2" seed="17" />
        <feColorMatrix values="0 0 0 0 .55  0 0 0 0 .48  0 0 0 0 .38  0 0 0 .14 -.03" /></filter><rect width="1080" height="1920" filter="url(#ff)" /></svg>
      <div id="kick" class="clip" data-start="0" data-duration="4.5" data-track-index="0">Impact report 2025 · Fernway Trust (fictional)</div>
      <h1 id="title" class="clip" data-start="0" data-duration="4.5" data-track-index="1">Our year, counted in people</h1>
      <svg id="tally" class="clip" viewBox="0 0 1080 1920" data-start="0" data-duration="4.5" data-track-index="2"></svg>
      <div id="key" class="clip" data-start="0" data-duration="4.5" data-track-index="3"><i></i>each mark = 2,000 people</div>
      <div id="num" class="clip" data-start="0" data-duration="4.5" data-track-index="4">25,704</div>
      <div id="nlab" class="clip" data-start="0" data-duration="4.5" data-track-index="5">people with safe water at home</div>
      <div id="split" class="clip" data-start="0" data-duration="4.5" data-track-index="6">
        <div id="splab">Where each 100 € went</div>
        <div id="bar"></div>
      </div>
      <div id="foot" class="clip" data-start="0" data-duration="4.5" data-track-index="7">Sample data for this preview. Count: households connected × average household size, Jan–Dec 2025.</div>
    </div>

    <script>
      const DUR = 4.5, NS = "http://www.w3.org/2000/svg";
      const svg = document.getElementById("tally"), r = MF.rng("impact-annual");
      // three bundles of five (15 marks x 2,000 = 30,000; the remainder is not drawn)
      const bundles = [];
      for (let b = 0; b < 3; b++) {
        const g = document.createElementNS(NS, "g"); g.setAttribute("id", "bd" + b); svg.appendChild(g);
        const x0 = 110 + b * 300, y0 = 560;
        const marks = [];
        for (let i = 0; i < 4; i++) {
          const x = x0 + i * 52 + r.range(-4, 4), p = document.createElementNS(NS, "path");
          p.setAttribute("d", `M${x.toFixed(1)} ${(y0 + r.range(-6, 6)).toFixed(1)} C ${(x + r.range(-6, 6)).toFixed(1)} ${y0 + 80}, ${(x + r.range(-6, 6)).toFixed(1)} ${y0 + 140}, ${(x + r.range(-5, 5)).toFixed(1)} ${(y0 + 220 + r.range(-6, 6)).toFixed(1)}`);
          p.setAttribute("pathLength", "1"); g.appendChild(p); marks.push(p);
        }
        const c = document.createElementNS(NS, "path"); c.setAttribute("class", "x");
        c.setAttribute("d", `M${x0 - 30} ${y0 + 170} C ${x0 + 60} ${y0 + 130}, ${x0 + 120} ${y0 + 90}, ${x0 + 200} ${y0 + 40}`);
        c.setAttribute("pathLength", "1"); g.appendChild(c); marks.push(c);
        bundles.push(marks);
      }
      // split bar: segments sum to 100
      const SEG = [["Programmes", 82, "#1D2A26"], ["Admin", 11, "#C9A27E"], ["Fundraising", 7, "#8E8A80"]];
      const bar = document.getElementById("bar"); let acc = 0;
      SEG.forEach(([lab, v, c], i) => {
        const s = document.createElement("div"); s.className = "sg"; s.id = "sg" + i;
        Object.assign(s.style, { left: (acc / 100 * 920) + "px", width: (v / 100 * 920) + "px", background: c }); bar.appendChild(s);
        const l = document.createElement("div"); l.className = "sl"; l.id = "sl" + i; l.innerHTML = `<b>${v}%</b>${lab}`;
        Object.assign(l.style, i === 0 ? { left: "0px" } : i === 1 ? { left: "560px" } : { right: "0px", textAlign: "right" }); bar.appendChild(l);
        acc += v;
      });

      const tl = MF.timeline("main", DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;   // explicit registration (MF.timeline already does this; keeps the linter happy)
      tl.fromTo("#kick", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.05);
      tl.fromTo("#title", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.1);
      tl.fromTo("#key", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, 0.3);
      // marks: 0.08 s each, the crossing stroke 0.12 s
      let at = 0.4;
      bundles.forEach((m) => m.forEach((p, i) => {
        const d = i === 4 ? 0.12 : 0.08;
        tl.fromTo(p, { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power1.out" }, at); at += d;
      }));
      // bundles slide together and collapse into the total
      tl.to("#bd0", { x: 300, duration: 0.6, ease: "power3.inOut" }, 1.85);
      tl.to("#bd2", { x: -300, duration: 0.6, ease: "power3.inOut" }, 1.85);
      tl.to(["#bd0", "#bd1", "#bd2"], { opacity: 0, scale: 0.6, transformOrigin: "540px 670px", duration: 0.25, ease: "power2.in" }, 2.3);
      tl.to("#key", { opacity: 0, duration: 0.25 }, 2.3);
      const num = document.getElementById("num"), N = { v: 25704 };
      const fmt = (v) => Math.round(v).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
      tl.fromTo("#num", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.25, ease: "power3.out" }, 2.4);
      tl.fromTo(N, { v: 25704 }, { v: 30240, duration: 0.5, ease: "power3.out", onUpdate: () => (num.textContent = fmt(N.v)) }, 2.45);
      tl.fromTo("#nlab", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 2.85);
      tl.fromTo("#foot", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 3.0);
      // money split: bar grows 0.8 s, labels 0.3 s stagger
      tl.fromTo("#split", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 3.0);
      tl.fromTo(".sg", { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: "power3.out", stagger: 0.12 }, 3.05);
      tl.fromTo(".sl", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out", stagger: 0.3 }, 3.5);
      tl.seek(0);
    </script>
  </body>
</html>
