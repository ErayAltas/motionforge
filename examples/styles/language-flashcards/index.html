<!doctype html>

  Signature scenes "flip card" + "stress bounce" + "sentence highlight": the card rises 160 px with

    <style>

      @font-face { font-family: "Nunito"; font-style: normal; font-weight: 800; font-display: block; src: url("assets/fonts/nunito-latin-ext-800-normal.woff2") format("woff2"); unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }

      @font-face { font-family: "Nunito"; font-style: italic; font-weight: 400; font-display: block; src: url("assets/fonts/nunito-latin-ext-400-italic.woff2") format("woff2"); unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }
      @font-face { font-family: "Charis SIL"; font-style: normal; font-weight: 400; font-display: block; src: url("assets/fonts/charis-sil-latin-400-normal.woff2") format("woff2"); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
      @font-face { font-family: "Charis SIL"; font-style: normal; font-weight: 400; font-display: block; src: url("assets/fonts/charis-sil-latin-ext-400-normal.woff2") format("woff2"); unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }
      /* fonts:end */
      :root { --mf-bg: #0e4d5a; --card: #fffcf4; --ink: #1c1b19; --acc: #ffcb3d; --mf-grain-opacity: .05;
        --n: "Nunito", system-ui, sans-serif; --ipa: "Charis SIL", "Gentium Plus", Georgia, serif; }
      #root { background: radial-gradient(1000px 800px at 50% 10%, #16677a 0%, transparent 70%), var(--mf-bg); }
      #root::after { background: radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(0,20,25,.45) 100%); }
      #title { position: absolute; left: 0; right: 0; top: 250px; text-align: center; font: 800 72px/1 var(--n); color: var(--card); letter-spacing: -0.01em; }
      #lab { position: absolute; left: 0; right: 0; top: 352px; text-align: center; font: 800 28px/1 var(--n); letter-spacing: .12em; color: rgba(255,252,244,.7); }
      #persp { position: absolute; left: 110px; top: 560px; width: 860px; height: 540px; perspective: 1600px; }
      #card { position: absolute; inset: 0; transform-style: preserve-3d; }
      .face { position: absolute; inset: 0; border-radius: 28px; background: var(--card); box-shadow: 0 24px 40px rgba(0,0,0,.3); backface-visibility: hidden;
        color: var(--ink); overflow: hidden; }
      .face .hd { position: absolute; left: 44px; right: 44px; top: 34px; padding-bottom: 22px; border-bottom: 2px solid rgba(28,27,25,.15);
        display: flex; justify-content: space-between; font: 800 26px/1 var(--n); letter-spacing: .12em; color: rgba(28,27,25,.6); }
      #front .word { position: absolute; left: 0; right: 0; top: 190px; text-align: center; font: 800 160px/1 var(--n); letter-spacing: -0.02em; }
      #front .hint { position: absolute; left: 0; right: 0; bottom: 44px; text-align: center; font: 600 30px/1 var(--n); color: rgba(28,27,25,.45); }
      #back { transform: rotateY(180deg); }
      #syl { position: absolute; left: 0; right: 0; top: 150px; display: flex; justify-content: center; align-items: baseline; font: 800 128px/1 var(--n); }
      #syl .s { position: relative; display: inline-block; }
      #syl .dot { color: rgba(28,27,25,.25); margin: 0 10px; font-weight: 600; }
      #syl .st::before { content: ""; position: absolute; left: -10px; right: -10px; top: 30px; bottom: 6px; background: var(--acc); opacity: .85; transform: skewX(-3deg);
        z-index: -1; border-radius: 6px 12px 8px 14px; }
      #syl .st { z-index: 0; }
      #ipa { position: absolute; left: 0; right: 0; top: 318px; text-align: center; font: 400 60px/1 var(--ipa); color: var(--ink); }
      #mean { position: absolute; left: 0; right: 0; top: 418px; text-align: center; font: 400 italic 48px/1 var(--n); color: rgba(28,27,25,.65); }
      #sent { position: absolute; left: 110px; top: 1180px; width: 860px; height: 220px; border-radius: 28px; background: var(--card); box-shadow: 0 24px 40px rgba(0,0,0,.3); padding: 40px 44px; }
      #sline { position: relative; font: 600 52px/1.2 var(--n); color: var(--ink); }
      #sline .w { display: inline-block; position: relative; }
      #swipe { position: absolute; background: var(--acc); opacity: .85; transform-origin: left; transform: skewX(-3deg) scaleX(0); border-radius: 4px 10px 6px 12px; z-index: -1; }
      #tr { margin-top: 18px; font: 400 italic 40px/1.2 var(--n); color: rgba(28,27,25,.6); }
      #turn { position: absolute; left: 110px; top: 1460px; width: 860px; }
      #turn .t { font: 800 28px/1 var(--n); letter-spacing: .12em; color: rgba(255,252,244,.75); margin-bottom: 18px; }
      #turn .bar { height: 10px; border-radius: 5px; background: rgba(255,252,244,.2); overflow: hidden; }
      #turn .bar i { display: block; height: 100%; width: 100%; background: var(--card); transform-origin: left; }

  </head>
  <body>
    <div id="root" class="mf-stage" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1080" data-height="1920">
      <div id="title" class="clip" data-start="0" data-duration="4.5" data-track-index="0">Language flashcards</div>
      <div id="lab" class="clip" data-start="0" data-duration="4.5" data-track-index="1">SPANISH · CARD 12</div>
      <div id="persp" class="clip" data-start="0" data-duration="4.5" data-track-index="2">
        <div id="card">
          <div class="face" id="front"><div class="hd"><span>ES</span><span>NOUN · FEMININE</span></div><div class="word">mariposa</div><div class="hint">tap to flip</div></div>
          <div class="face" id="back"><div class="hd"><span>ES → EN</span><span>NOUN · FEMININE</span></div>
            <div id="syl"><span class="s">ma</span><span class="dot">·</span><span class="s">ri</span><span class="dot">·</span><span class="s st" id="stress">po</span><span class="dot">·</span><span class="s">sa</span></div>
            <div id="ipa">[maɾiˈposa]</div>
            <div id="mean">butterfly</div>
          </div>
        </div>
      </div>
      <div id="sent" class="clip" data-start="0" data-duration="4.5" data-track-index="3">
        <div id="sline"><div id="swipe"></div></div>
        <div id="tr">The butterfly flies over the river.</div>
      </div>
      <div id="turn" class="clip" data-start="0" data-duration="4.5" data-track-index="4"><div class="t">YOUR TURN</div><div class="bar"><i></i></div></div>
    </div>

    <script>
      const DUR = 4.5;
      const sline = document.getElementById("sline");
      "La mariposa vuela sobre el río.".split(" ").forEach((w, i) => {
        const s = document.createElement("span"); s.className = "w"; s.id = "w" + i; s.textContent = w;
        sline.appendChild(s); sline.appendChild(document.createTextNode(" "));
      });

      const tl = MF.timeline("main", DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.fromTo("#title", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.05);
      tl.fromTo("#lab", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.2);
      tl.fromTo("#persp", { opacity: 0, y: 160, rotate: -4 }, { opacity: 1, y: 0, rotate: 0, duration: 0.45, ease: "back.out(1.6)" }, 0.15);
      // flip
      tl.fromTo("#card", { rotateY: 0 }, { rotateY: 180, duration: 0.6, ease: "power2.inOut" }, 1.15);
      // stress bounce on its beat (twice: normal, then the slow repeat)
      [2.0, 2.55].forEach((at) => tl.fromTo("#stress", { y: 0, scale: 1 }, { y: -24, scale: 1.08, duration: 0.25, ease: "back.out(2.5)", yoyo: true, repeat: 1, immediateRender: false }, at));
      // sentence card, words build, swipe on the target word, translation 0.4 s later
      tl.fromTo("#sent", { opacity: 0, y: 120 }, { opacity: 1, y: 0, duration: 0.45, ease: "back.out(1.6)" }, 2.6);
      tl.fromTo("#sline .w", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.2, ease: "power2.out", stagger: 0.09 }, 2.8);
      const sw = document.getElementById("w1"), swipe = document.getElementById("swipe");
      Object.assign(swipe.style, { left: sw.offsetLeft - 8 + "px", top: sw.offsetTop + 14 + "px", width: sw.offsetWidth + 16 + "px", height: sw.offsetHeight - 14 + "px" });
      tl.fromTo(swipe, { scaleX: 0, skewX: -3 }, { scaleX: 1, skewX: -3, duration: 0.3, ease: "power2.out" }, 3.4);
      tl.fromTo("#tr", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 3.8);
      tl.fromTo("#turn", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 3.9);
      tl.fromTo("#turn .bar i", { scaleX: 1 }, { scaleX: 0.75, duration: 0.6, ease: "none" }, 3.9);
      tl.seek(0);
      MF.ready().then(() => {   // the swipe is measured from the loaded font
        Object.assign(swipe.style, { left: sw.offsetLeft - 8 + "px", top: sw.offsetTop + 14 + "px", width: sw.offsetWidth + 16 + "px", height: sw.offsetHeight - 14 + "px" });
      });
    </script>
  </body>
</html>
