<!doctype html>
<!--
  motionforge style preview: wellness-sage
  © 2026 motionforge contributors, MIT
  Signature scenes "breath circle" + "line bloom": a sage disc grows 360 -> 620 px over a 4 s inhale
  (sine.inOut) toward a faint target ring, "in" sits beneath it in a light serif, a single botanical line
  draws on at about 220 px/s behind the title and then stays still; text fades 1.2 s with an 18 px rise.
  Fraunces 300 + Nunito Sans + DM Mono. Nothing slides sideways.
-->
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/mf-runtime.js"></script>
    <link rel="stylesheet" href="assets/base.css" />
    <style>
      @font-face { font-family: "Fraunces"; font-weight: 300; font-style: normal; font-display: block; src: url("assets/fonts/fraunces-latin-300-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+20AC, U+20BA, U+2122, U+2190-2193, U+2212; }
      @font-face { font-family: "Fraunces"; font-weight: 300; font-style: normal; font-display: block; src: url("assets/fonts/fraunces-latin-ext-300-normal.woff2") format("woff2"); unicode-range: U+0100-0130, U+0132-0151, U+0154-024F, U+1E00-1EFF; }
      @font-face { font-family: "Nunito Sans"; font-weight: 500; font-style: normal; font-display: block; src: url("assets/fonts/nunito-sans-latin-500-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+20AC, U+20BA, U+2122, U+2190-2193, U+2212; }
      @font-face { font-family: "Nunito Sans"; font-weight: 500; font-style: normal; font-display: block; src: url("assets/fonts/nunito-sans-latin-ext-500-normal.woff2") format("woff2"); unicode-range: U+0100-0130, U+0132-0151, U+0154-024F, U+1E00-1EFF; }
      @font-face { font-family: "DM Mono"; font-weight: 400; font-style: normal; font-display: block; src: url("assets/fonts/dm-mono-latin-400-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+20AC, U+20BA, U+2122, U+2190-2193, U+2212; }
      @font-face { font-family: "DM Mono"; font-weight: 400; font-style: normal; font-display: block; src: url("assets/fonts/dm-mono-latin-ext-400-normal.woff2") format("woff2"); unicode-range: U+0100-0130, U+0132-0151, U+0154-024F, U+1E00-1EFF; }
      :root { --bg: #eee7da; --ink: #33402f; --acc: #7f9b76; --sup: #c99a7a; --mist: #dce3d4; --mf-grain-opacity: .06; }
      html, body { background: var(--bg); }
      #root { background: radial-gradient(1100px 900px at 18% 10%, #f6f1e7 0%, transparent 65%), var(--bg); color: var(--ink); }
      #root::before { mix-blend-mode: multiply; opacity: .1; }
      #root::after { background: radial-gradient(ellipse at 50% 50%, transparent 70%, rgba(51,64,47,.08) 100%); }
      #sprig { position: absolute; left: 560px; top: 180px; width: 460px; height: 520px; overflow: visible; }
      #label { position: absolute; left: 100px; top: 300px; font: 400 28px/1 "DM Mono", ui-monospace; letter-spacing: .08em; color: var(--ink); opacity: .75; }
      #title { position: absolute; left: 96px; top: 350px; font: 300 120px/1.02 "Fraunces", Georgia; letter-spacing: -0.01em; color: var(--ink); }
      #target { position: absolute; left: 230px; top: 630px; width: 620px; height: 620px; border-radius: 50%; border: 2px solid var(--mist); }
      #disc { position: absolute; left: 230px; top: 630px; width: 620px; height: 620px; border-radius: 50%; background: radial-gradient(circle at 42% 38%, #8ea886 0%, #7f9b76 60%, #77926e 100%); transform: scale(0.5806); }
      #hold { position: absolute; left: 222px; top: 622px; width: 636px; height: 636px; overflow: visible; }
      #cue { position: absolute; left: 0; right: 0; top: 1310px; text-align: center; font: 300 96px/1 "Fraunces", Georgia; color: var(--ink); }
      #count { position: absolute; left: 0; right: 0; top: 1430px; text-align: center; font: 400 28px/1 "DM Mono", ui-monospace; letter-spacing: .08em; color: var(--ink); opacity: .75; }
      #cap { position: absolute; left: 0; right: 0; top: 1500px; text-align: center; font: 500 50px/1.2 "Nunito Sans", system-ui; color: var(--ink); }
    </style>
  </head>
  <body>
    <div id="root" class="mf-stage" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1080" data-height="1920">
      <svg id="sprig" class="clip" viewBox="0 0 460 520" data-start="0" data-duration="4.5" data-track-index="0">
        <path id="sp" fill="none" stroke="#33402f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".7"
          d="M330 510 C300 420 290 330 300 240 C306 180 320 120 350 60
             M302 400 C250 390 205 360 190 312 C240 316 282 346 302 400
             M300 330 C350 320 392 290 410 245 C362 250 318 282 300 330
             M298 262 C252 246 222 214 214 170 C258 182 288 214 298 262
             M308 196 C350 182 380 152 392 110 C350 120 318 152 308 196
             M336 96 C318 70 316 42 330 14 C350 40 352 70 336 96" />
      </svg>
      <div id="label" class="clip" data-start="0" data-duration="4.5" data-track-index="1">breathing · 4 – 6</div>
      <h1 id="title" class="clip" data-start="0" data-duration="4.5" data-track-index="2">Wellness<br />sage</h1>
      <div id="target" class="clip" data-start="0" data-duration="4.5" data-track-index="3"></div>
      <div id="disc" class="clip" data-start="0" data-duration="4.5" data-track-index="4"></div>
      <svg id="hold" class="clip" viewBox="0 0 636 636" data-start="0" data-duration="4.5" data-track-index="5"><circle id="holdc" cx="318" cy="318" r="314" fill="none" stroke="#c99a7a" stroke-width="8" stroke-linecap="round" transform="rotate(-90 318 318)" /></svg>
      <div id="cue" class="clip" data-start="0" data-duration="4.5" data-track-index="6">in</div>
      <div id="count" class="clip" data-start="0" data-duration="4.5" data-track-index="7">inhale · 4 &nbsp;&nbsp; 2 / 5</div>
      <div id="cap" class="clip" data-start="0" data-duration="4.5" data-track-index="8">Let your shoulders drop</div>
    </div>

    <script>
      const DUR = 4.5;
      const tl = MF.timeline("main", DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;   // explicit registration (MF.timeline already does this)
      const sp = document.getElementById("sp"), L = sp.getTotalLength();
      sp.style.strokeDasharray = L;
      const hc = document.getElementById("holdc"), HC = 2 * Math.PI * 314;
      hc.style.strokeDasharray = `${HC} ${HC}`;
      const fadeUp = (sel, at, op = 1) => tl.fromTo(sel, { opacity: 0, y: 18 }, { opacity: op, y: 0, duration: 1.2, ease: "sine.inOut" }, at);
      fadeUp("#label", 0.0, 0.75);
      fadeUp("#title", 0.15);
      // line bloom: about 220 px/s, then it stays still
      tl.fromTo(sp, { strokeDashoffset: L }, { strokeDashoffset: 0, duration: Math.min(3.2, L / 220), ease: "none" }, 0.3);
      tl.fromTo("#target", { opacity: 0 }, { opacity: 1, duration: 1.2, ease: "sine.inOut" }, 0.2);
      // the breath: 360 -> 620 px over a 4 s inhale
      tl.fromTo("#disc", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "sine.inOut" }, 0.1);
      tl.fromTo("#disc", { scale: 360 / 620 }, { scale: 1, duration: 4.0, ease: "sine.inOut" }, 0.3);
      fadeUp("#cue", 0.5);
      fadeUp("#count", 0.8, 0.75);
      fadeUp("#cap", 1.6);
      // the hold begins as the inhale completes: the clay ring starts to trace
      tl.fromTo(hc, { strokeDashoffset: HC }, { strokeDashoffset: HC * 0.88, duration: 0.3, ease: "none" }, 4.2);
      tl.seek(0);
    </script>
  </body>
</html>
