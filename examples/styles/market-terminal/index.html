<!doctype html>
<!--
  motionforge style preview: market-terminal
  © 2026 motionforge contributors, MIT
  Signature scenes "opening board" + "candle build" + "gap marker": panels cut in hard, the watchlist
  fills top-down and each change cell flashes once, 40 candles build at 0.06 s each, the amber crosshair
  snaps onto the key candle and its price tag slides out, then two dashed lines bracket the gap.
  The ticker tape runs at a constant 120 px/s computed from time. Every symbol and price is
  fictional sample data (seeded), labelled on screen. IBM Plex Sans Condensed + IBM Plex Mono.
-->
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/mf-runtime.js"></script>
    <link rel="stylesheet" href="assets/base.css" />
    <style>
      /* fonts:begin */
      @font-face { font-family: "IBM Plex Sans Condensed"; font-style: normal; font-weight: 700; font-display: block; src: url("assets/fonts/ibm-plex-sans-condensed-latin-700-normal.woff2") format("woff2"); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
      @font-face { font-family: "IBM Plex Sans Condensed"; font-style: normal; font-weight: 700; font-display: block; src: url("assets/fonts/ibm-plex-sans-condensed-latin-ext-700-normal.woff2") format("woff2"); unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }
      @font-face { font-family: "IBM Plex Mono"; font-style: normal; font-weight: 500; font-display: block; src: url("assets/fonts/ibm-plex-mono-latin-500-normal.woff2") format("woff2"); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
      @font-face { font-family: "IBM Plex Mono"; font-style: normal; font-weight: 500; font-display: block; src: url("assets/fonts/ibm-plex-mono-latin-ext-500-normal.woff2") format("woff2"); unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }
      @font-face { font-family: "IBM Plex Mono"; font-style: normal; font-weight: 600; font-display: block; src: url("assets/fonts/ibm-plex-mono-latin-600-normal.woff2") format("woff2"); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
      @font-face { font-family: "IBM Plex Mono"; font-style: normal; font-weight: 600; font-display: block; src: url("assets/fonts/ibm-plex-mono-latin-ext-600-normal.woff2") format("woff2"); unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }
      /* fonts:end */
      :root { --mf-bg: #0a0c0f; --panel: #12161b; --line: #1f252d; --ink: #e3e7ec; --muted: #6b7480; --up: #26c281; --down: #f0524a; --acc: #ff9f1c;
        --mf-grain-opacity: 0; --disp: "IBM Plex Sans Condensed", "Arial Narrow", sans-serif; --mono: "IBM Plex Mono", ui-monospace, monospace; }
      #root { background: var(--mf-bg); }
      #root::after { background: radial-gradient(ellipse at 50% 50%, transparent 70%, rgba(0,0,0,.03) 100%); }
      #tape { position: absolute; left: 0; right: 0; top: 240px; height: 60px; background: var(--panel); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); overflow: hidden; }
      #tapeRow { position: absolute; left: 0; top: 0; height: 60px; display: flex; align-items: center; white-space: nowrap; font: 500 26px/1 var(--mono); color: var(--ink); }
      #tapeRow span { margin-right: 44px; } #tapeRow .u { color: var(--up); } #tapeRow .d { color: var(--down); }
      #head { position: absolute; left: 40px; top: 334px; font: 700 96px/1 var(--disp); letter-spacing: -0.01em; color: var(--ink); }
      #head2 { position: absolute; left: 44px; top: 440px; font: 500 24px/1 var(--mono); letter-spacing: .08em; color: var(--muted); text-transform: uppercase; }
      #chart { position: absolute; left: 40px; top: 500px; width: 1000px; height: 640px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
      #chart svg { position: absolute; left: 0; top: 0; }
      #quote { position: absolute; left: 28px; top: 22px; font: 600 26px/1 var(--mono); color: var(--ink); letter-spacing: .04em; }
      #quote .px { font-size: 64px; display: block; margin-top: 12px; font-variant-numeric: tabular-nums; }
      #quote .ch { color: var(--up); font-size: 30px; margin-left: 10px; }
      #tag { position: absolute; left: 892px; width: 108px; height: 40px; background: var(--acc); color: #0a0c0f; font: 600 24px/40px var(--mono); text-align: center; border-radius: 2px; }
      #gapLabel { position: absolute; font: 600 26px/1 var(--mono); color: var(--acc); white-space: pre; }
      #table { position: absolute; left: 40px; top: 1170px; width: 1000px; height: 316px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
      .th { position: absolute; top: 0; left: 0; right: 0; height: 46px; border-bottom: 1px solid var(--line); font: 500 24px/46px var(--mono); color: var(--muted); letter-spacing: .08em; }
      .tr { position: absolute; left: 0; right: 0; height: 45px; font: 500 34px/45px var(--mono); color: var(--ink); font-variant-numeric: tabular-nums; }
      .tr.on { box-shadow: inset 4px 0 0 var(--acc); background: rgba(255,159,28,.06); }
      .c1 { position: absolute; left: 28px; } .c2 { position: absolute; right: 330px; text-align: right; } .c3 { position: absolute; right: 24px; width: 240px; text-align: right; padding-right: 10px; }
      .fl { position: absolute; right: 24px; width: 250px; top: 4px; height: 37px; opacity: 0; }
      .u { color: var(--up); } .d { color: var(--down); }
      #src { position: absolute; left: 40px; top: 1506px; font: 500 24px/1 var(--mono); color: var(--muted); letter-spacing: .04em; }
    </style>
  </head>
  <body>
    <div id="root" class="mf-stage" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1080" data-height="1920">
      <div id="tape" class="clip" data-start="0" data-duration="4.5" data-track-index="0"><div id="tapeRow"></div></div>
      <div id="head" class="clip" data-start="0" data-duration="4.5" data-track-index="1">Market terminal</div>
      <div id="head2" class="clip" data-start="0" data-duration="4.5" data-track-index="2">Sample index · 5-min candles</div>
      <div id="chart" class="clip" data-start="0" data-duration="4.5" data-track-index="3">
        <svg id="svg" width="1000" height="640" viewBox="0 0 1000 640"></svg>
        <div id="quote">NRTH · SAMPLE<span class="px"><span id="px">398.10</span><span class="ch" id="ch">▲ +0.00%</span></span></div>
        <div id="tag">0.00</div>
        <div id="gapLabel"></div>
      </div>
      <div id="table" class="clip" data-start="0" data-duration="4.5" data-track-index="4">
        <div class="th"><span class="c1">SYMBOL</span><span class="c2">LAST</span><span class="c3">CHG</span></div>
      </div>
      <div id="src" class="clip" data-start="0" data-duration="4.5" data-track-index="5">SAMPLE DATA FOR THIS PREVIEW · 15:42 UTC</div>
    </div>

    <script>
      const DUR = 4.5, NS = "http://www.w3.org/2000/svg";
      const r = MF.rng("market-terminal");
      // ---- ticker tape: constant 120 px/s, position from time --------------------------------
      const TAPE = [["NRTH", "414.62", 4.1], ["KVLA", "88.17", -1.2], ["ORBX", "1,204.50", 0.6], ["MIRA", "23.04", -0.4], ["SOLV", "57.90", 2.3], ["TERN", "9.81", -2.7], ["ALDR", "312.00", 0.2]];
      const row = document.getElementById("tapeRow");
      const tapeHTML = TAPE.map(([s, p, c]) => `<span>${s} ${p} <b class="${c >= 0 ? "u" : "d"}">${c >= 0 ? "▲" : "▼"} ${Math.abs(c).toFixed(1)}%</b></span>`).join("");
      row.innerHTML = tapeHTML + tapeHTML + tapeHTML;
      // ---- candles ------------------------------------------------------------------------
      const N = 40, X0 = 40, PITCH = 21, BODY = 14, Y_TOP = 150, Y_BOT = 610, KEY = 28;
      const C = []; let p = 398.1;
      for (let i = 0; i < N; i++) {
        const o = i === KEY ? p + 15.3 : p;              // the gap opens at the key candle
        const c = i === KEY ? o + 6.4 : o + r.range(-3.2, 3.4);
        const h = Math.max(o, c) + r.range(0.4, 2.2), l = Math.min(o, c) - r.range(0.4, 2.2);
        C.push({ o, c, h, l }); p = c;
      }
      const lo = Math.min(...C.map((k) => k.l)) - 3, hi = Math.max(...C.map((k) => k.h)) + 3;
      const Y = (v) => Y_BOT - (v - lo) / (hi - lo) * (Y_BOT - Y_TOP);
      const svg = document.getElementById("svg");
      const el = (tag, at) => { const e = document.createElementNS(NS, tag); for (const k in at) e.setAttribute(k, at[k]); svg.appendChild(e); return e; };
      // price scale (content, not a backdrop)
      el("line", { x1: 890, y1: 120, x2: 890, y2: 630, stroke: "#1f252d", "stroke-width": 1 });
      for (let v = Math.ceil(lo / 10) * 10; v < hi; v += 10) {
        el("line", { x1: 890, y1: Y(v), x2: 898, y2: Y(v), stroke: "#3a414b", "stroke-width": 1 });
        const t = el("text", { x: 906, y: Y(v) + 8, fill: "#6b7480", "font-family": "IBM Plex Mono", "font-size": 22 }); t.textContent = v.toFixed(0);
      }
      const gapLo = C[KEY - 1].h, gapHi = C[KEY].l;
      const g1 = el("line", { x1: X0, y1: Y(gapLo), x2: 885, y2: Y(gapLo), stroke: "#ff9f1c", "stroke-width": 2, "stroke-dasharray": "10 8", opacity: 0 });
      const g2 = el("line", { x1: X0, y1: Y(gapHi), x2: 885, y2: Y(gapHi), stroke: "#ff9f1c", "stroke-width": 2, "stroke-dasharray": "10 8", opacity: 0 });
      const parts = C.map((k, i) => {
        const x = X0 + i * PITCH, up = k.c >= k.o, col = up ? "#26c281" : "#f0524a";
        const w = el("line", { x1: x + BODY / 2, y1: Y(k.h), x2: x + BODY / 2, y2: Y(k.l), stroke: col, "stroke-width": 2, opacity: 0 });
        const top = Y(Math.max(k.o, k.c)), bh = Math.max(2, Math.abs(Y(k.o) - Y(k.c)));
        const b = el("rect", { x, y: top, width: BODY, height: bh, fill: col, opacity: 0 });
        return { w, b, up, x };
      });
      const kx = parts[KEY].x + BODY / 2, ky = Y(C[KEY].c);
      const chV = el("line", { x1: kx, y1: 120, x2: kx, y2: 630, stroke: "#ff9f1c", "stroke-width": 2, "stroke-dasharray": "6 6", opacity: 0 });
      const chH = el("line", { x1: 0, y1: ky, x2: 890, y2: ky, stroke: "#ff9f1c", "stroke-width": 2, "stroke-dasharray": "6 6", opacity: 0 });
      const ring = el("rect", { x: kx - 16, y: Y(C[KEY].h) - 8, width: 32, height: Y(C[KEY].l) - Y(C[KEY].h) + 16, fill: "none", stroke: "#ff9f1c", "stroke-width": 3, rx: 3, opacity: 0 });
      // ---- watchlist ------------------------------------------------------------------------
      const WL = [["NRTH", 414.62, 4.1], ["KVLA", 88.17, -1.2], ["ORBX", 1204.5, 0.6], ["MIRA", 23.04, -0.4], ["SOLV", 57.9, 2.3], ["TERN", 9.81, -2.7]];
      const table = document.getElementById("table");
      WL.forEach(([s, v, c], i) => {
        const d = document.createElement("div");
        d.className = "tr" + (i === 0 ? " on" : ""); d.id = "w" + i; d.style.top = (48 + i * 44.5) + "px";
        d.innerHTML = `<div class="fl" style="background:${c >= 0 ? "rgba(38,194,129,.35)" : "rgba(240,82,74,.35)"}"></div><span class="c1">${s}</span>` +
          `<span class="c2">${v.toLocaleString("en-US", { minimumFractionDigits: 2 })}</span><span class="c3 ${c >= 0 ? "u" : "d"}">${c >= 0 ? "▲ +" : "▼ −"}${Math.abs(c).toFixed(1)}%</span>`;
        table.appendChild(d);
      });

      const tl = MF.timeline("main", DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      // tape: x = -120 px/s * t, wrapped by the width of one set (deterministic)
      const tapeW = () => row.scrollWidth / 3;
      const tp = { t: 0 };
      tl.fromTo(tp, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: () => { row.style.transform = `translateX(${-((tp.t * 120) % tapeW())}px)`; } }, 0);
      // panels cut in hard, no fades
      tl.set(["#tape"], { opacity: 1 }, 0);
      tl.fromTo("#head", { opacity: 0 }, { opacity: 1, duration: 0.01 }, 0.1);
      tl.fromTo("#head2", { opacity: 0 }, { opacity: 1, duration: 0.01 }, 0.2);
      tl.fromTo("#chart", { opacity: 0 }, { opacity: 1, duration: 0.01 }, 0.3);
      tl.fromTo("#table", { opacity: 0 }, { opacity: 1, duration: 0.01 }, 0.3);
      tl.fromTo(".tr", { opacity: 0 }, { opacity: 1, duration: 0.01, stagger: 0.05 }, 0.4);
      WL.forEach((w, i) => { const f = `#w${i} .fl`; tl.to(f, { opacity: 1, duration: 0.05 }, 0.45 + i * 0.05); tl.to(f, { opacity: 0, duration: 0.4 }, 0.7 + i * 0.05); });
      tl.fromTo("#src", { opacity: 0 }, { opacity: 1, duration: 0.01 }, 0.5);
      // candles: one per 0.06 s, wick first (0.08 s), body grows from open to close (0.12 s)
      parts.forEach((pt, i) => {
        const at = 0.6 + i * 0.06;
        tl.fromTo(pt.w, { opacity: 1, scaleY: 0 }, { scaleY: 1, duration: 0.08, ease: "none", svgOrigin: `${pt.x + BODY / 2} ${Y((C[i].h + C[i].l) / 2)}` }, at);
        tl.fromTo(pt.b, { opacity: 1, scaleY: 0 }, { scaleY: 1, duration: 0.12, ease: "power2.out", svgOrigin: `${pt.x} ${Y(C[i].o)}` }, at + 0.06);
      });
      // quote follows the last built candle
      const q = { i: 0 }, px = document.getElementById("px"), ch = document.getElementById("ch");
      tl.fromTo(q, { i: 0 }, { i: N - 1, duration: N * 0.06, ease: "none", onUpdate: () => {
        const k = C[Math.round(q.i)].c, pc = (k / C[0].o - 1) * 100;
        px.textContent = k.toFixed(2); ch.textContent = (pc >= 0 ? "▲ +" : "▼ −") + Math.abs(pc).toFixed(1) + "%";
        ch.style.color = pc >= 0 ? "#26c281" : "#f0524a";
      } }, 0.6);
      // crosshair snaps to the key candle, tag slides out
      const tag = document.getElementById("tag"); tag.textContent = C[KEY].c.toFixed(2); tag.style.top = (ky - 20) + "px";
      tl.fromTo([chV, chH], { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 0.2, ease: "power3.out" }, 3.15);
      tl.fromTo(ring, { opacity: 0, scale: 1.4, svgOrigin: `${kx} ${ky}` }, { opacity: 1, scale: 1, duration: 0.2, ease: "power3.out", svgOrigin: `${kx} ${ky}` }, 3.2);
      tl.fromTo("#tag", { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 0.2, ease: "power3.out" }, 3.3);
      // gap marker: two dashed lines + label typed at 24 chars/s
      tl.to([g1, g2], { opacity: 1, duration: 0.01 }, 3.55);
      const gl = document.getElementById("gapLabel"), LBL = "+" + ((C[KEY].o / C[KEY - 1].c - 1) * 100).toFixed(1) + " % gap";
      gl.style.left = "60px"; gl.style.top = (Y(gapHi) - 40) + "px";
      const ty = { n: 0 };
      tl.fromTo(ty, { n: 0 }, { n: LBL.length, duration: LBL.length / 24, ease: "none", onUpdate: () => { gl.textContent = LBL.slice(0, Math.round(ty.n)); } }, 3.6);
      tl.seek(0);
    </script>
  </body>
</html>
