<!doctype html>
<!--
  motionforge style preview: catalog-grid
  © 2026 motionforge contributors, MIT
  A wall of white product tiles (3 columns, 300 x 380, 24 px gutters, 66 px margins) fades in on a diagonal,
  the camera glides along it, then the gallery dive: 1 -> 3.4x into one tile while the others dim to 30 %,
  a red-orange price tag swings in on its string (elastic.out) and the size row lands.
  Products are original drawings; names, prices and stock are sample data. Fonts: Schibsted Grotesk, Roboto Mono.
-->
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/mf-runtime.js"></script>
    <link rel="stylesheet" href="assets/base.css" />
    <style>
      /* fonts:begin */
      @font-face { font-family: "Schibsted Grotesk"; font-style: normal; font-weight: 500; font-display: block; src: url("assets/fonts/schibsted-grotesk-latin-500-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+20AC, U+20BA, U+2122, U+2190-2193, U+2212; }
      @font-face { font-family: "Schibsted Grotesk"; font-style: normal; font-weight: 500; font-display: block; src: url("assets/fonts/schibsted-grotesk-latin-ext-500-normal.woff2") format("woff2"); unicode-range: U+0100-0130, U+0132-0151, U+0154-024F, U+1E00-1EFF; }
      @font-face { font-family: "Schibsted Grotesk"; font-style: normal; font-weight: 800; font-display: block; src: url("assets/fonts/schibsted-grotesk-latin-800-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+20AC, U+20BA, U+2122, U+2190-2193, U+2212; }
      @font-face { font-family: "Schibsted Grotesk"; font-style: normal; font-weight: 800; font-display: block; src: url("assets/fonts/schibsted-grotesk-latin-ext-800-normal.woff2") format("woff2"); unicode-range: U+0100-0130, U+0132-0151, U+0154-024F, U+1E00-1EFF; }
      @font-face { font-family: "Roboto Mono"; font-style: normal; font-weight: 400; font-display: block; src: url("assets/fonts/roboto-mono-latin-400-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+20AC, U+20BA, U+2122, U+2190-2193, U+2212; }
      @font-face { font-family: "Roboto Mono"; font-style: normal; font-weight: 400; font-display: block; src: url("assets/fonts/roboto-mono-latin-ext-400-normal.woff2") format("woff2"); unicode-range: U+0100-0130, U+0132-0151, U+0154-024F, U+1E00-1EFF; }
      @font-face { font-family: "Roboto Mono"; font-style: normal; font-weight: 500; font-display: block; src: url("assets/fonts/roboto-mono-latin-500-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+20AC, U+20BA, U+2122, U+2190-2193, U+2212; }
      @font-face { font-family: "Roboto Mono"; font-style: normal; font-weight: 500; font-display: block; src: url("assets/fonts/roboto-mono-latin-ext-500-normal.woff2") format("woff2"); unicode-range: U+0100-0130, U+0132-0151, U+0154-024F, U+1E00-1EFF; }
      /* fonts:end */
      :root { --bg: #EDEDE8; --tile: #FFFFFF; --ink: #111214; --acc: #F2471C; --sup: #8D8F93; --mf-grain-opacity: .03; }
      html, body { background: var(--bg); }
      #root { background: radial-gradient(1100px 700px at 50% 0%, #f6f6f2 0%, transparent 70%), var(--bg); color: var(--ink); }
      #root::before { mix-blend-mode: multiply; }
      #root::after { background: radial-gradient(ellipse at 50% 50%, transparent 65%, rgba(17,18,20,.06) 100%); }
      #cam { position: absolute; left: 0; top: 0; width: 1080px; height: 2400px; transform-origin: 0 0; }
      .tile { position: absolute; width: 300px; height: 380px; border-radius: 12px; background: var(--tile); box-shadow: 0 8px 24px rgba(17,18,20,.10); overflow: hidden; }
      .tile svg { position: absolute; left: 0; top: 0; width: 300px; height: 300px; }
      .tile .nm { position: absolute; left: 18px; bottom: 44px; font: 500 22px/1 "Schibsted Grotesk", sans-serif; color: var(--ink); }
      .tile .pr { position: absolute; left: 18px; bottom: 16px; font: 400 18px/1 "Roboto Mono", monospace; color: var(--sup); }
      .tile.sel { box-shadow: 0 8px 24px rgba(17,18,20,.10), 0 0 0 4px var(--acc); }
      .tile .new { position: absolute; right: 16px; top: 16px; width: 14px; height: 14px; border-radius: 50%; background: var(--acc); }
      #head { position: absolute; left: 66px; top: 186px; width: 948px; z-index: 3; }
      #head h1 { font: 800 92px/1 "Schibsted Grotesk", sans-serif; letter-spacing: -0.025em; }
      #head div { margin-top: 14px; font: 400 24px/1 "Roboto Mono", monospace; letter-spacing: .12em; text-transform: uppercase; color: var(--sup); }
      #headbg { position: absolute; left: 0; top: 0; width: 1080px; height: 340px; background: linear-gradient(var(--bg) 70%, rgba(237,237,232,0)); z-index: 2; }
      #tag { position: absolute; left: 700px; top: 1000px; width: 260px; height: 330px; transform-origin: 130px 0; z-index: 4; }
      #tag .str { position: absolute; left: 129px; top: 0; width: 2px; height: 110px; background: #3a3b3e; }
      #tag .body { position: absolute; left: 20px; top: 104px; width: 220px; height: 210px; background: var(--acc); clip-path: polygon(22% 0, 78% 0, 100% 18%, 100% 100%, 0 100%, 0 18%); display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; box-shadow: 0 10px 20px rgba(0,0,0,.2); }
      #tag .hole { position: absolute; left: 118px; top: 116px; width: 24px; height: 24px; border-radius: 50%; background: #c9c9c4; z-index: 2; box-shadow: inset 0 2px 3px rgba(0,0,0,.3); }
      #tag b { margin-top: 30px; font: 500 64px/1 "Roboto Mono", monospace; font-variant-numeric: tabular-nums; }
      #tag small { margin-top: 10px; font: 400 20px/1 "Roboto Mono", monospace; letter-spacing: .12em; text-transform: uppercase; opacity: .9; }
      #info { position: absolute; left: 80px; top: 1470px; width: 920px; z-index: 4; }
      #info h2 { font: 800 76px/1 "Schibsted Grotesk", sans-serif; letter-spacing: -0.025em; }
      #info .meta { margin-top: 12px; font: 400 24px/1 "Roboto Mono", monospace; letter-spacing: .12em; text-transform: uppercase; color: var(--sup); }
      #sizes { position: absolute; left: 80px; top: 1640px; display: flex; gap: 14px; z-index: 4; }
      #sizes span { padding: 14px 22px; border-radius: 10px; background: var(--tile); font: 500 28px/1 "Roboto Mono", monospace; box-shadow: 0 4px 12px rgba(17,18,20,.08); }
      #sizes span.out { color: var(--sup); text-decoration: line-through; }
      #sizes span.on { box-shadow: 0 0 0 3px var(--acc); }
    </style>
  </head>
  <body>
    <div id="root" class="mf-stage" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1080" data-height="1920">
      <div id="cam" class="clip" data-start="0" data-duration="4.5" data-track-index="0"></div>
      <div id="headbg" class="clip" data-start="0" data-duration="4.5" data-track-index="1"></div>
      <div id="head" class="clip" data-start="0" data-duration="4.5" data-track-index="2"><h1>Catalog grid</h1><div>Home · new arrivals · sample catalogue</div></div>
      <div id="tag" class="clip" data-start="0" data-duration="4.5" data-track-index="3"><div class="str"></div><div class="hole"></div><div class="body"><b>€64</b><small>incl. VAT</small></div></div>
      <div id="info" class="clip" data-start="0" data-duration="4.5" data-track-index="4"><h2>Dome lamp, sand</h2><div class="meta">Lighting · SKU 0412 · sample data</div></div>
      <div id="sizes" class="clip" data-start="0" data-duration="4.5" data-track-index="5"><span>S</span><span class="on">M</span><span class="out">L</span></div>
    </div>

    <script>
      const sh = '<ellipse cx="150" cy="268" rx="80" ry="10" fill="#000" opacity=".08"/>';
      const P = [
        ["Stoneware mug", "€18", sh + '<path d="M196 160 q40 0 40 34 q0 34 -40 34" fill="none" stroke="#c97b5a" stroke-width="12"/><rect x="96" y="138" width="104" height="128" rx="14" fill="#d98a66"/><rect x="104" y="146" width="12" height="104" rx="6" fill="#fff" opacity=".25"/>'],
        ["Dome lamp", "€64", sh + '<rect x="146" y="150" width="8" height="110" fill="#b7a58c"/><ellipse cx="150" cy="262" rx="46" ry="10" fill="#cdbb9f"/><path d="M84 160 C 84 96 216 96 216 160Z" fill="#dcc7a6"/><path d="M84 160 C 84 96 216 96 216 160Z" fill="url(#lg)"/><ellipse cx="150" cy="160" rx="66" ry="8" fill="#f7e9c8"/>', true],
        ["Glass vase", "€29", sh + '<path d="M120 100 h60 q-4 30 18 70 q22 50 -10 96 h-76 q-32 -46 -10 -96 q22 -40 18 -70Z" fill="#9cc7c0" opacity=".85"/><path d="M128 120 q-4 60 -20 120" stroke="#fff" stroke-width="6" opacity=".5" fill="none"/><path d="M150 100 q-10 -40 -40 -60 M150 100 q14 -46 50 -58" stroke="#5d7a4e" stroke-width="5" fill="none"/>'],
        ["Oak stool", "€89", sh + '<ellipse cx="150" cy="118" rx="84" ry="20" fill="#c79a66"/><rect x="66" y="118" width="168" height="18" fill="#a77c4c"/><path d="M90 136 L 76 264 M210 136 L 224 264 M130 136 L 126 258 M170 136 L 174 258" stroke="#a77c4c" stroke-width="12"/>'],
        ["Wool throw", "€72", sh + '<rect x="70" y="120" width="160" height="140" rx="16" fill="#8b9a7a"/><path d="M70 160 h160 M70 200 h160" stroke="#7a8a6a" stroke-width="10"/><path d="M80 260 v12 M100 260 v12 M120 260 v12 M140 260 v12 M160 260 v12 M180 260 v12 M200 260 v12 M220 260 v12" stroke="#8b9a7a" stroke-width="4"/>'],
        ["Wall clock", "€45", '<circle cx="150" cy="160" r="96" fill="#f2efe8" stroke="#2c2d30" stroke-width="10"/><path d="M150 160 L 150 100 M150 160 L 196 180" stroke="#2c2d30" stroke-width="8" stroke-linecap="round"/><circle cx="150" cy="160" r="8" fill="#F2471C"/>'],
        ["Linen pillow", "€34", sh + '<path d="M70 110 Q 150 96 230 110 Q 240 180 230 250 Q 150 262 70 250 Q 60 180 70 110Z" fill="#e3d6c3"/><path d="M90 130 Q 150 122 210 130" stroke="#cbbca6" stroke-width="5" fill="none"/>'],
        ["Ceramic pot", "€24", sh + '<path d="M96 160 h108 l-12 104 h-84Z" fill="#efe9de"/><rect x="90" y="150" width="120" height="18" rx="6" fill="#e2dacd"/><path d="M150 150 C 120 100 100 90 80 70 C 120 74 140 100 150 150 C 160 96 190 70 226 64 C 196 90 170 110 150 150Z" fill="#4f7d4b"/>'],
        ["Desk tray", "€22", sh + '<rect x="60" y="190" width="180" height="60" rx="12" fill="#3e4b5a"/><rect x="70" y="196" width="160" height="40" rx="8" fill="#4d5c6d"/><rect x="96" y="176" width="70" height="30" rx="4" fill="#e8e1d2" transform="rotate(-8 130 190)"/>'],
        ["Carafe", "€31", sh + '<path d="M130 80 h40 v40 q50 30 50 90 q0 56 -70 56 q-70 0 -70 -56 q0 -60 50 -90Z" fill="#cfe3e6" opacity=".85"/><path d="M84 200 q0 56 66 56 q66 0 66 -56Z" fill="#9cc2c9" opacity=".6"/>'],
        ["Candle trio", "€27", sh + '<rect x="72" y="150" width="50" height="114" rx="6" fill="#efe6d4"/><rect x="128" y="120" width="50" height="144" rx="6" fill="#e9d9be"/><rect x="184" y="170" width="44" height="94" rx="6" fill="#f2ebdc"/><path d="M97 150 v-14 M153 120 v-14 M206 170 v-14" stroke="#333" stroke-width="3"/>'],
        ["Book stand", "€38", sh + '<path d="M80 250 L 120 110 L 140 110 L 104 250Z M220 250 L 180 110 L 160 110 L 196 250Z" fill="#b48a5c"/><rect x="70" y="244" width="160" height="16" fill="#9c744a"/>'],
        ["Side table", "€120", sh + '<ellipse cx="150" cy="120" rx="96" ry="22" fill="#2d2e31"/><rect x="144" y="126" width="12" height="130" fill="#2d2e31"/><ellipse cx="150" cy="262" rx="50" ry="8" fill="#2d2e31"/>'],
        ["Jute basket", "€41", sh + '<path d="M78 140 h144 l-14 124 h-116Z" fill="#c9a874"/><path d="M84 170 h132 M88 200 h124 M92 230 h116" stroke="#b08f5c" stroke-width="6"/>'],
        ["Ash bowl", "€26", sh + '<path d="M70 190 h160 q0 74 -80 74 q-80 0 -80 -74Z" fill="#a8b4b9"/><ellipse cx="150" cy="190" rx="80" ry="14" fill="#c6d0d3"/>'],
      ];
      const cam = document.getElementById("cam"), SEL = 4; // row 1, column 1
      P.forEach(([nm, pr, svg, isNew], i) => {
        const c = i % 3, r = Math.floor(i / 3);
        const t = document.createElement("div");
        t.className = "tile" + (i === SEL ? " sel" : ""); t.dataset.d = c + r;
        t.style.left = (66 + c * 324) + "px"; t.style.top = (340 + r * 404) + "px";
        t.innerHTML = `<svg viewBox="0 0 300 300"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#000" stop-opacity=".12"/><stop offset=".45" stop-color="#fff" stop-opacity=".25"/><stop offset="1" stop-color="#000" stop-opacity=".15"/></linearGradient></defs>${svg}</svg><div class="nm">${nm}</div><div class="pr">${pr}</div>${isNew ? '<i class="new"></i>' : ""}`;
        cam.appendChild(t);
      });
      // swap the selected tile to the lamp
      const tiles = gsap.utils.toArray(".tile");
      const sel = tiles[SEL];
      [tiles[1].innerHTML, sel.innerHTML] = [sel.innerHTML, tiles[1].innerHTML];

      const DUR = 4.5, DIVE = 1.45, S = 3.4;
      const tl = MF.timeline("main", DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.fromTo("#head", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 0);
      tiles.forEach((t) => tl.fromTo(t, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 0.1 + 0.04 * Number(t.dataset.d)));
      // glide along the wall, then dive into the chosen tile (centre at x 540, y 934 on the wall)
      tl.fromTo("#cam", { x: 0, y: 0, scale: 1 }, { x: 0, y: -120, scale: 1, duration: 1.0, ease: "power2.inOut" }, 0.35);
      tl.to("#cam", { x: 540 - S * 540, y: 760 - S * 934, scale: S, duration: 0.9, ease: "power3.inOut" }, DIVE);
      tl.to(tiles.filter((t) => t !== sel), { opacity: 0.3, duration: 0.5 }, DIVE);
      tl.to(["#head", "#headbg"], { opacity: 0, duration: 0.3 }, DIVE);
      tl.to(sel.querySelectorAll(".nm, .pr"), { opacity: 0, duration: 0.2 }, DIVE + 0.3);
      // the tag swings in from 25 deg and settles with elastic.out
      tl.fromTo("#tag", { opacity: 0, rotation: 25, y: -60 }, { opacity: 1, rotation: 0, y: 0, duration: 0.9, ease: "elastic.out(1, 0.5)" }, DIVE + 0.85);
      tl.fromTo("#info", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, DIVE + 0.9);
      tl.fromTo("#sizes span", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out", stagger: 0.06 }, DIVE + 1.1);
      tl.seek(0);
    </script>
  </body>
</html>
