<!doctype html>
<!--
  motionforge style preview: vlog-film-diary
  © 2026 motionforge contributors, MIT
  Signature scene in miniature: warm "footage" (an original SVG kitchen-window shot with lifted blacks,
  halation and a seeded handheld drift), the orange VT323 date stamp typing on, a Caveat time-of-day note,
  then the snapshot freeze: 2-frame white flash, the shot shrinks into a cream-bordered print and tilts -3deg.
  Fonts: Caveat 600, VT323 400, Nunito Sans 700 (Fontsource, OFL). The date is an example.
-->
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/mf-runtime.js"></script>
    <link rel="stylesheet" href="assets/base.css" />
    <style>
      /* fonts:begin */
      @font-face { font-family: "Caveat"; font-style: normal; font-weight: 600; font-display: block; src: url("assets/fonts/caveat-latin-600-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+20AC, U+20BA, U+2122, U+2190-2193, U+2212; }
      @font-face { font-family: "Caveat"; font-style: normal; font-weight: 600; font-display: block; src: url("assets/fonts/caveat-latin-ext-600-normal.woff2") format("woff2"); unicode-range: U+0100-0130, U+0132-0151, U+0154-024F, U+1E00-1EFF; }
      @font-face { font-family: "VT323"; font-style: normal; font-weight: 400; font-display: block; src: url("assets/fonts/vt323-latin-400-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+20AC, U+20BA, U+2122, U+2190-2193, U+2212; }
      @font-face { font-family: "VT323"; font-style: normal; font-weight: 400; font-display: block; src: url("assets/fonts/vt323-latin-ext-400-normal.woff2") format("woff2"); unicode-range: U+0100-0130, U+0132-0151, U+0154-024F, U+1E00-1EFF; }
      @font-face { font-family: "Nunito Sans"; font-style: normal; font-weight: 700; font-display: block; src: url("assets/fonts/nunito-sans-latin-700-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+20AC, U+20BA, U+2122, U+2190-2193, U+2212; }
      @font-face { font-family: "Nunito Sans"; font-style: normal; font-weight: 700; font-display: block; src: url("assets/fonts/nunito-sans-latin-ext-700-normal.woff2") format("woff2"); unicode-range: U+0100-0130, U+0132-0151, U+0154-024F, U+1E00-1EFF; }
      /* fonts:end */
      :root { --bg: #1C1611; --paper: #F4E9D8; --ink: #FFF3E0; --acc: #FF8A1F; --tan: #C7A27C; --mf-grain-opacity: 0.12; }
      html, body { background: var(--bg); }
      #root { background: radial-gradient(900px 800px at 50% 40%, #2a2019 0%, transparent 70%), var(--bg); }
      #root::before { z-index: 20; mix-blend-mode: overlay; }
      #root::after { z-index: 21; background: radial-gradient(ellipse at 50% 50%, transparent 62%, rgba(0,0,0,.18) 100%); }
      #print { position: absolute; left: 120px; top: 435px; width: 840px; height: 1050px; background: var(--paper); box-shadow: 0 18px 40px rgba(0,0,0,.35); transform-origin: 50% 50%; }
      #photo { position: absolute; left: 24px; top: 24px; width: 792px; height: 990px; overflow: hidden; background: #2a1d14; }
      #shot { position: absolute; left: -30px; top: -30px; width: 852px; height: 1050px; }
      #shot svg { width: 100%; height: 100%; display: block; filter: saturate(.9) contrast(.94) brightness(1.04); }
      #flash { position: absolute; inset: 0; background: #fff; opacity: 0; z-index: 15; }
      #note { position: absolute; left: 90px; top: 300px; font: 600 104px/1 "Caveat", "Patrick Hand", cursive; color: var(--ink); text-shadow: 0 2px 4px rgba(28,22,17,.75), 0 0 26px rgba(28,22,17,.7); white-space: nowrap; z-index: 5; }
      #title { position: absolute; left: 0; right: 0; top: 190px; text-align: center; font: 600 132px/1 "Caveat", cursive; color: var(--ink); z-index: 5; }
      #title .w { position: relative; display: inline-block; margin-left: 30px; }
      #ring { position: absolute; left: -36px; top: -14px; width: calc(100% + 72px); height: calc(100% + 34px); overflow: visible; }
      #ring path { fill: none; stroke: var(--acc); stroke-width: 6; stroke-linecap: round; }
      #stamp { position: absolute; left: 760px; top: 1556px; width: 240px; text-align: right; font: 400 54px/1 "VT323", monospace; letter-spacing: 0.08em; color: var(--acc); text-shadow: 0 0 6px rgba(255,138,31,.6), 0 0 14px rgba(255,138,31,.35); z-index: 6; }
      #tape { position: absolute; left: 330px; top: -34px; width: 190px; height: 64px; background: rgba(199,162,124,.62); transform: rotate(4deg); box-shadow: 0 2px 6px rgba(0,0,0,.12); }
      #chap { position: absolute; left: 90px; top: 1560px; font: 600 64px/1 "Caveat", cursive; color: var(--tan); z-index: 6; }
      #cap { position: absolute; left: 0; right: 0; top: 1720px; text-align: center; font: 700 54px/1 "Nunito Sans", sans-serif; color: var(--ink); text-shadow: 0 2px 2px rgba(28,22,17,.55); z-index: 6; }
    </style>
  </head>
  <body>
    <div id="root" class="mf-stage" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1080" data-height="1920">
      <div id="print" class="clip" data-start="0" data-duration="4.5" data-track-index="0">
        <div id="photo">
          <div id="shot">
            <svg viewBox="0 0 852 1050" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
              <defs>
                <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b2a1f"/><stop offset="1" stop-color="#6e4b33"/></linearGradient>
                <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe9c4"/><stop offset=".55" stop-color="#ffc98a"/><stop offset="1" stop-color="#f59a52"/></linearGradient>
                <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a5a37"/><stop offset=".12" stop-color="#5e3b24"/><stop offset="1" stop-color="#2e1d12"/></linearGradient>
                <linearGradient id="mug" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b9a68c"/><stop offset=".35" stop-color="#f3e7d3"/><stop offset=".7" stop-color="#e7d6bb"/><stop offset="1" stop-color="#8f7a62"/></linearGradient>
                <radialGradient id="sunpatch" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffd59a" stop-opacity=".55"/><stop offset="1" stop-color="#ffd59a" stop-opacity="0"/></radialGradient>
                <filter id="b2"><feGaussianBlur stdDeviation="2.5"/></filter>
                <filter id="b8"><feGaussianBlur stdDeviation="9"/></filter>
                <filter id="b18"><feGaussianBlur stdDeviation="18"/></filter>
              </defs>
              <rect width="852" height="1050" fill="url(#wall)"/>
              <!-- window -->
              <g filter="url(#b2)">
                <rect x="170" y="70" width="520" height="560" fill="url(#sky)"/>
                <circle cx="520" cy="420" r="70" fill="#fff4dc"/>
                <path d="M170 520 Q 260 470 350 500 T 520 480 T 690 500 V630 H170Z" fill="#c9824c" opacity=".55"/>
                <path d="M170 570 Q 300 540 420 560 T 690 550 V630 H170Z" fill="#9b5d35" opacity=".6"/>
              </g>
              <g fill="#2a1d14">
                <rect x="150" y="56" width="560" height="22"/><rect x="150" y="622" width="560" height="26"/>
                <rect x="150" y="56" width="22" height="590"/><rect x="688" y="56" width="22" height="590"/>
                <rect x="420" y="70" width="16" height="560"/><rect x="170" y="338" width="520" height="14"/>
              </g>
              <!-- halation: highlights blurred, orange, screen -->
              <g filter="url(#b18)" style="mix-blend-mode: screen" opacity=".55">
                <rect x="190" y="90" width="480" height="420" fill="#ff9a3c" opacity=".55"/>
                <circle cx="520" cy="420" r="110" fill="#ffb060"/>
              </g>
              <ellipse cx="560" cy="820" rx="300" ry="120" fill="url(#sunpatch)"/>
              <!-- plant -->
              <g fill="#3a3320" filter="url(#b2)" opacity=".95">
                <path d="M70 1050 C 60 900 40 820 0 760 L0 1050Z"/>
                <path d="M84 760 C 30 700 -10 640 -20 560 C 40 600 90 660 110 740Z"/>
                <path d="M110 780 C 120 690 170 620 240 590 C 220 660 180 730 130 790Z"/>
                <path d="M96 820 C 40 790 0 760 -30 700 C 30 700 80 740 110 800Z"/>
              </g>
              <!-- table -->
              <rect x="0" y="760" width="852" height="290" fill="url(#wood)"/>
              <rect x="0" y="760" width="852" height="5" fill="#c89466" opacity=".7"/>
              <ellipse cx="420" cy="905" rx="130" ry="18" fill="#160e08" opacity=".55" filter="url(#b8)"/>
              <!-- mug -->
              <g>
                <path d="M520 770 q 64 -6 64 52 q 0 56 -70 54" fill="none" stroke="#d9c7aa" stroke-width="18"/>
                <path d="M300 740 h220 v120 q0 44 -44 44 h-132 q-44 0 -44 -44Z" fill="url(#mug)"/>
                <ellipse cx="410" cy="740" rx="110" ry="20" fill="#e9dcc6"/>
                <ellipse cx="410" cy="744" rx="96" ry="14" fill="#3a2214"/>
                <rect x="330" y="760" width="14" height="110" rx="7" fill="#fff8ea" opacity=".55"/>
              </g>
              <g id="steam" filter="url(#b8)" fill="none" stroke="#fff3e0" stroke-width="16" stroke-linecap="round" opacity=".5">
                <path id="st1" d="M380 720 C 350 660 420 620 390 560 C 370 520 410 480 400 440"/>
                <path id="st2" d="M440 720 C 470 670 410 630 446 580 C 470 540 430 500 450 460"/>
              </g>
              <!-- lifted blacks + warm grade -->
              <rect width="852" height="1050" fill="#1C1611" opacity=".12" style="mix-blend-mode: lighten"/>
            </svg>
          </div>
        </div>
        <div id="tape"></div>
      </div>
      <div id="note" class="clip" data-start="0" data-duration="4.5" data-track-index="1">07:42 · coffee first</div>
      <div id="title" class="clip" data-start="0" data-duration="4.5" data-track-index="2">Vlog film <span class="w">diary<svg id="ring" viewBox="0 0 300 160" preserveAspectRatio="none"><path id="ringp" d="M40 30 C 120 -6 270 6 286 70 C 300 136 150 160 70 140 C 10 124 4 70 40 40 C 70 18 110 12 150 14"/></svg></span></div>
      <div id="cap" class="clip" data-start="0" data-duration="4.5" data-track-index="3">first light, first cup</div>
      <div id="chap" class="clip" data-start="0" data-duration="4.5" data-track-index="4">Sunday · 01</div>
      <div id="stamp" class="clip" data-start="0" data-duration="4.5" data-track-index="5"></div>
      <div id="flash" class="clip" data-start="0" data-duration="4.5" data-track-index="6"></div>
    </div>

    <script>
      const DUR = 4.5, FREEZE = 1.7;
      const tl = MF.timeline("main", DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      const S0 = 1.96; // the print starts large enough for its photo to fill the frame (border off-screen)
      gsap.set("#print", { scale: S0, rotation: 0 });
      // handheld drift on the "footage": seeded, a function of time only (+-4 px, +-0.3 deg, 3 s period)
      const r = MF.rng("vlog-film-diary");
      const ph = [r() * 6.28, r() * 6.28, r() * 6.28];
      const shot = document.getElementById("shot");
      const st1 = document.getElementById("st1"), st2 = document.getElementById("st2");
      const drift = { t: 0 };
      tl.fromTo(drift, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: () => {
        const t = drift.t, live = Math.max(0, 1 - Math.max(0, t - FREEZE) * 20); // footage freezes on the flash
        const tt = Math.min(t, FREEZE);
        const w = (2 * Math.PI) / 3;
        shot.style.transform = `translate(${4 * Math.sin(w * tt + ph[0])}px, ${4 * Math.sin(w * tt * 1.3 + ph[1])}px) rotate(${0.3 * Math.sin(w * tt + ph[2])}deg)`;
        st1.setAttribute("transform", `translate(${10 * Math.sin(tt * 2.1)}, ${-30 * ((tt * 0.6) % 1)})`);
        st2.setAttribute("transform", `translate(${-10 * Math.sin(tt * 1.7 + 1)}, ${-30 * ((tt * 0.6 + 0.5) % 1)})`);
        void live;
      } }, 0);
      // date stamp types on at 18 chars/s and never leaves
      const stamp = document.getElementById("stamp"), DATE = "15 10 26";
      const ty = { n: 0 };
      tl.fromTo(ty, { n: 0 }, { n: DATE.length, duration: DATE.length / 18, ease: "none", onUpdate: () => { stamp.textContent = DATE.slice(0, Math.round(ty.n)); } }, 0.15);
      // the note writes on (left-to-right wipe), then drops away at the freeze
      tl.fromTo("#note", { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.6, ease: "power1.inOut" }, 0.1);
      tl.to("#note", { y: 60, opacity: 0, duration: 0.25, ease: "power2.in" }, FREEZE - 0.15);
      // snapshot freeze: 2-frame white flash at 40 %, print shrinks with its border and tilts -3 deg
      tl.set("#flash", { opacity: 0.4 }, FREEZE);
      tl.set("#flash", { opacity: 0 }, FREEZE + 2 / 30);
      tl.to("#print", { scale: 1, rotation: -3, duration: 0.45, ease: "back.out(1.4)" }, FREEZE + 2 / 30);
      tl.fromTo("#tape", { opacity: 0, y: -40 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, FREEZE + 0.6);
      // the style name in pen, one orange mark circles a word
      tl.fromTo("#title", { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.6, ease: "power1.inOut" }, FREEZE + 0.5);
      const ring = document.getElementById("ringp"); const L = ring.getTotalLength();
      gsap.set(ring, { strokeDasharray: L, strokeDashoffset: L });
      tl.to(ring, { strokeDashoffset: 0, duration: 0.5, ease: "power1.inOut" }, FREEZE + 1.25);
      tl.fromTo("#cap", { opacity: 0, y: 120 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0.55);
      tl.to("#cap", { opacity: 0, y: 60, duration: 0.25, ease: "power2.in" }, FREEZE - 0.15);
      tl.fromTo("#chap", { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.5, ease: "power1.inOut" }, FREEZE + 1.0);
      tl.seek(0);
    </script>
  </body>
</html>
