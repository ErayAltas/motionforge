<!doctype html>
<!--
  motionforge style preview: transfer-breaking

  Signature scenes "breaking open" + "club split" + "fee odometer" + "confirmation meter": the red bar
  slides in (0.22 s power4.out, with a short blur), headline lines punch in (scale 1.15 -> 1, 0.08 s
  stagger), two club-colour fields wipe from opposite corners with a 6 px white seam at 14°, an arrow
  travels old -> new, each fee digit rolls like an odometer for 1.2 s, then the five-step meter fills to
  "Agreed" and the source chip slides in. Clubs, player, fee and outlet are fictional, labelled as an
  example. Kanit (italic display, upright digits) + Public Sans.
-->
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/mf-runtime.js"></script>
    <link rel="stylesheet" href="assets/base.css" />
    <style>
      /* fonts:begin */
      @font-face { font-family: "Kanit"; font-style: normal; font-weight: 800; font-display: block; src: url("assets/fonts/kanit-latin-800-normal.woff2") format("woff2"); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
      @font-face { font-family: "Kanit"; font-style: normal; font-weight: 800; font-display: block; src: url("assets/fonts/kanit-latin-ext-800-normal.woff2") format("woff2"); unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }
      @font-face { font-family: "Kanit"; font-style: italic; font-weight: 800; font-display: block; src: url("assets/fonts/kanit-latin-800-italic.woff2") format("woff2"); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
      @font-face { font-family: "Kanit"; font-style: italic; font-weight: 800; font-display: block; src: url("assets/fonts/kanit-latin-ext-800-italic.woff2") format("woff2"); unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }
      @font-face { font-family: "Public Sans"; font-style: normal; font-weight: 600; font-display: block; src: url("assets/fonts/public-sans-latin-600-normal.woff2") format("woff2"); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
      @font-face { font-family: "Public Sans"; font-style: normal; font-weight: 600; font-display: block; src: url("assets/fonts/public-sans-latin-ext-600-normal.woff2") format("woff2"); unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }
      @font-face { font-family: "Public Sans"; font-style: normal; font-weight: 800; font-display: block; src: url("assets/fonts/public-sans-latin-800-normal.woff2") format("woff2"); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
      @font-face { font-family: "Public Sans"; font-style: normal; font-weight: 800; font-display: block; src: url("assets/fonts/public-sans-latin-ext-800-normal.woff2") format("woff2"); unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }
      /* fonts:end */
      :root { --mf-bg: #101115; --ink: #f6f6f4; --acc: #ff2443; --sup: #ffcf33; --muted: #9a9ca3; --mf-grain-opacity: .07;
        --k: "Kanit", Impact, "Arial Narrow", sans-serif; --p: "Public Sans", system-ui, sans-serif; }
      #root { background: radial-gradient(900px 700px at 50% 0%, #1c1e25 0%, transparent 70%), var(--mf-bg); }
      #bar { position: absolute; left: 0; top: 250px; width: 1080px; height: 100px; background: var(--acc); border-bottom: 4px solid #b5112a;
        display: flex; align-items: center; gap: 24px; padding-left: 60px; z-index: 3; }
      #bar .tag { background: #fff; color: var(--acc); font: 800 30px/1 var(--p); letter-spacing: .18em; padding: 12px 16px 10px; }
      #bar .t { font: 800 italic 52px/1 var(--k); color: #fff; text-transform: uppercase; letter-spacing: -0.01em; }
      #dot { position: absolute; right: 70px; top: 38px; width: 24px; height: 24px; border-radius: 50%; background: #fff; }
      #head { position: absolute; left: 60px; top: 392px; font: 800 italic 116px/0.95 var(--k); text-transform: uppercase; color: var(--ink); letter-spacing: -0.01em; }
      #head .ln { display: block; transform-origin: left center; }
      #split { position: absolute; left: 0; top: 760px; width: 1080px; height: 540px; }
      .fld { position: absolute; inset: 0; }
      #fA { background: #213a8f; clip-path: polygon(0 0, 608px 0, 473px 540px, 0 540px); }
      #fB { background: #0f7b6c; clip-path: polygon(608px 0, 1080px 0, 1080px 540px, 473px 540px); }
      .fwrap { position: absolute; inset: 0; }
      #seam { position: absolute; left: 0; top: 0; overflow: visible; }
      .code { position: absolute; font: 800 italic 170px/1 var(--k); color: #fff; letter-spacing: -0.01em; }
      .cl { position: absolute; font: 800 26px/1 var(--p); letter-spacing: .18em; color: rgba(255,255,255,.8); }
      #arrow { position: absolute; left: 0; top: 0; width: 92px; height: 92px; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 24px rgba(0,0,0,.35); }
      #fee { position: absolute; left: 60px; top: 1306px; height: 170px; display: flex; align-items: flex-end; gap: 6px; }
      .col { position: relative; width: 96px; height: 170px; overflow: hidden; }
      .col .strip { position: absolute; left: 0; top: 0; width: 100%; }
      .col .strip div, .fch { height: 170px; font: 800 184px/170px var(--k); color: var(--ink); text-align: center; font-variant-numeric: tabular-nums; }
      .fch { width: auto; }
      #cur, #unit { font: 800 130px/170px var(--k); color: var(--ink); }
      #feeLab { position: absolute; left: 640px; top: 1350px; font: 800 26px/1.5 var(--p); letter-spacing: .18em; color: var(--muted); }
      #feeLab b { display: inline-block; margin-top: 10px; font: 600 30px/1 var(--p); letter-spacing: 0; color: var(--ink); border: 2px solid rgba(246,246,244,.35); padding: 10px 14px; border-radius: 30px; }
      #meter { position: absolute; left: 80px; top: 1540px; }
      .seg { position: absolute; top: 0; width: 150px; height: 26px; background: rgba(246,246,244,.12); overflow: hidden; }
      .seg i { position: absolute; inset: 0; background: var(--sup); transform-origin: left; transform: scaleX(0); }
      .sl { position: absolute; top: 40px; width: 150px; font: 800 22px/1 var(--p); letter-spacing: .1em; color: var(--muted); text-transform: uppercase; }
      #stage { position: absolute; left: 80px; top: 1498px; font: 800 28px/1 var(--p); letter-spacing: .18em; color: var(--sup); }
      #src { position: absolute; left: 80px; top: 1640px; height: 50px; padding: 0 22px; border-radius: 25px; background: rgba(255,255,255,.9); color: #101115;
        font: 800 24px/50px var(--p); letter-spacing: .14em; }
    </style>
  </head>
  <body>
    <div id="root" class="mf-stage" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1080" data-height="1920">
      <div id="bar" class="clip" data-start="0" data-duration="4.5" data-track-index="0"><span class="tag">BREAKING</span><span class="t">Transfer breaking</span><div id="dot"></div></div>
      <div id="head" class="clip" data-start="0" data-duration="4.5" data-track-index="1"><span class="ln">Riverton agree</span><span class="ln">fee for Varga</span></div>
      <div id="split" class="clip" data-start="0" data-duration="4.5" data-track-index="2">
        <div class="fwrap" id="wA"><div class="fld" id="fA"></div><div class="cl" style="left:60px;top:70px">FROM</div><div class="code" style="left:52px;top:110px">MLL</div><div class="cl" style="left:60px;top:300px">MILL LANE</div></div>
        <div class="fwrap" id="wB"><div class="fld" id="fB"></div><div class="cl" style="left:700px;top:250px">TO</div><div class="code" style="left:690px;top:290px">RIV</div><div class="cl" style="left:700px;top:480px">RIVERTON</div></div>
        <svg id="seam" width="1080" height="540"><line id="sl" x1="608" y1="0" x2="473" y2="540" stroke="#fff" stroke-width="6" /></svg>
        <div id="arrow"><svg width="48" height="48" viewBox="0 0 48 48"><path d="M8 24 H38 M26 12 L38 24 L26 36" fill="none" stroke="#101115" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /></svg></div>
      </div>
      <div id="fee" class="clip" data-start="0" data-duration="4.5" data-track-index="3"><span id="cur">€</span></div>
      <div id="feeLab" class="clip" data-start="0" data-duration="4.5" data-track-index="4">REPORTED FEE<br /><b>+ €2m add-ons</b></div>
      <div id="stage" class="clip" data-start="0" data-duration="4.5" data-track-index="5">STAGE 3/5 · AGREED</div>
      <div id="meter" class="clip" data-start="0" data-duration="4.5" data-track-index="6"></div>
      <div id="src" class="clip" data-start="0" data-duration="4.5" data-track-index="7">REPORTED BY THE EXAMPLE GAZETTE · FICTIONAL STORY</div>
    </div>

    <script>
      const DUR = 4.5;
      // fee odometer: each digit its own column; the strip rolls past whole cycles and stops on the value
      const FEE = "18.5", H = 170, fee = document.getElementById("fee"), cols = [];
      [...FEE].forEach((ch, i) => {
        if (ch === ".") { const d = document.createElement("div"); d.className = "fch"; d.textContent = "."; d.style.width = "46px"; fee.appendChild(d); return; }
        const c = document.createElement("div"); c.className = "col";
        const s = document.createElement("div"); s.className = "strip";
        const cycles = 2 + i, n = cycles * 10 + Number(ch);
        for (let k = 0; k <= n; k++) { const d = document.createElement("div"); d.textContent = k % 10; s.appendChild(d); }
        c.appendChild(s); fee.appendChild(c); cols.push({ s, n });
      });
      const unit = document.createElement("span"); unit.id = "unit"; unit.textContent = "m"; fee.appendChild(unit);
      // meter
      const meter = document.getElementById("meter");
      ["Rumour", "Talks", "Agreed", "Medical", "Official"].forEach((s, i) => {
        meter.insertAdjacentHTML("beforeend", `<div class="seg" style="left:${i * 160}px"><i id="s${i}"></i></div><div class="sl" style="left:${i * 160}px;${i === 2 ? "color:#ffcf33" : ""}">${s}</div>`);
      });
      // arrow along the seam's middle: from the old club's side to the new club's side
      gsap.set("#arrow", { x: 330 - 46, y: 300 - 46 });

      const tl = MF.timeline("main", DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.fromTo("#bar", { x: -1080, filter: "blur(10px)" }, { x: 0, filter: "blur(0px)", duration: 0.22, ease: "power4.out" }, 0);
      [0.3, 3.45].forEach((at) => tl.fromTo("#dot", { scale: 1 }, { scale: 1.4, duration: 0.15, yoyo: true, repeat: 3, ease: "power1.inOut", immediateRender: false }, at));
      tl.fromTo("#head .ln", { opacity: 0, scale: 1.15 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power4.out", stagger: 0.08 }, 0.25);
      tl.fromTo("#wA", { clipPath: "circle(0% at 0% 0%)" }, { clipPath: "circle(130% at 0% 0%)", duration: 0.4, ease: "power3.inOut" }, 0.75);
      tl.fromTo("#wB", { clipPath: "circle(0% at 100% 100%)" }, { clipPath: "circle(130% at 100% 100%)", duration: 0.4, ease: "power3.inOut" }, 0.75);
      const SL = Math.hypot(135, 540);
      gsap.set("#sl", { attr: { "stroke-dasharray": `${SL} ${SL}` } });
      tl.fromTo("#sl", { attr: { "stroke-dashoffset": SL } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.2, ease: "none" }, 1.1);
      tl.fromTo("#arrow", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.15, ease: "back.out(2)" }, 1.3);
      tl.to("#arrow", { x: 820 - 46, y: 150 - 46, duration: 0.5, ease: "power2.inOut" }, 1.4);
      // fee odometer 1.2 s, currency and "m" land 0.15 s later
      tl.fromTo("#fee", { opacity: 0 }, { opacity: 1, duration: 0.01 }, 1.6);
      cols.forEach((c) => tl.fromTo(c.s, { y: 0 }, { y: -c.n * H, duration: 1.2, ease: "power2.out" }, 1.6));
      tl.fromTo(["#cur", "#unit"], { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.2, ease: "power3.out" }, 2.95);
      tl.fromTo("#feeLab", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 2.0);
      // confirmation meter: three segments fill 0.18 s each, 0.12 s apart, then the stage label pops
      tl.fromTo("#meter", { opacity: 0 }, { opacity: 1, duration: 0.01 }, 2.8);
      [0, 1, 2].forEach((i) => tl.to("#s" + i, { scaleX: 1, duration: 0.18, ease: "power2.out" }, 2.9 + i * 0.12));
      tl.fromTo("#stage", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2)", transformOrigin: "left center" }, 3.3);
      tl.fromTo("#src", { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: 0.25, ease: "power3.out" }, 3.6);
      tl.seek(0);
    </script>
  </body>
</html>
