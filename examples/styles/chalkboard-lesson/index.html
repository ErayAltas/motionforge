<!doctype html>
<!--
  motionforge style preview: chalkboard-lesson
  © 2026 motionforge contributors, MIT
  Signature scenes "eraser wipe" + "live write" + "circle the answer": a felt eraser sweeps the previous
  board in three arcs (1.1 s), leaving a 6 % ghost and a chalk cloud that settles; the heading writes
  live at about 13 chars/s with seeded 1 px jitter and dust falling from the stroke end, a hand-drawn
  underline follows 0.2 s later, the long line is pre-written and fades in 0.4 s, the answer writes
  live and a loose yellow ellipse (0.45 s, ends overlapping 10 %) and a tick mark it.
  Everything is drawn on one canvas per frame from the timeline position (seeded noise, no state).
  Architects Daughter (board) + Andika (tray label). The lesson content is an original example.
-->
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/mf-runtime.js"></script>
    <link rel="stylesheet" href="assets/base.css" />
    <style>
      /* fonts:begin */
      @font-face { font-family: "Architects Daughter"; font-style: normal; font-weight: 400; font-display: block; src: url("assets/fonts/architects-daughter-latin-400-normal.woff2") format("woff2"); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
      @font-face { font-family: "Architects Daughter"; font-style: normal; font-weight: 400; font-display: block; src: url("assets/fonts/architects-daughter-latin-ext-400-normal.woff2") format("woff2"); unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }
      @font-face { font-family: "Andika"; font-style: normal; font-weight: 700; font-display: block; src: url("assets/fonts/andika-latin-700-normal.woff2") format("woff2"); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
      @font-face { font-family: "Andika"; font-style: normal; font-weight: 700; font-display: block; src: url("assets/fonts/andika-latin-ext-700-normal.woff2") format("woff2"); unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }
      /* fonts:end */
      :root { --board: #2e4a3b; --ink: #eeede3; --acc: #f6db6f; --sup: #f3a6a0; --frame: #7a5534; --mf-grain-opacity: .05;
        --ad: "Architects Daughter", "Indie Flower", cursive; --an: "Andika", system-ui, sans-serif; }
      #root { background: #1d1a16; }
      #root::after { display: none; }
      #frame { position: absolute; left: 20px; top: 180px; width: 1040px; height: 1560px; border-radius: 10px;
        background: linear-gradient(90deg, #6e4b2e, #8a6240 30%, #7a5534 60%, #694629); box-shadow: 0 20px 40px rgba(0,0,0,.5); }
      #boardBg { position: absolute; left: 60px; top: 220px; width: 960px; height: 1480px; overflow: hidden; }
      #cv { position: absolute; left: 0; top: 0; }
      #tray { position: absolute; left: 10px; top: 1700px; width: 1060px; height: 52px; border-radius: 6px; background: linear-gradient(180deg, #8f6644, #5e3f24); box-shadow: 0 10px 18px rgba(0,0,0,.45); }
      .stick { position: absolute; top: 1690px; height: 16px; border-radius: 8px; }
      #lab { position: absolute; left: 720px; top: 1764px; font: 700 30px/1 var(--an); letter-spacing: .08em; color: rgba(238,237,227,.75); }
      #fontprobe { position: absolute; left: -9999px; font: 400 40px var(--ad); }
    </style>
  </head>
  <body>
    <div id="root" class="mf-stage" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1080" data-height="1920">
      <div id="frame" class="clip" data-start="0" data-duration="4.5" data-track-index="0"></div>
      <svg id="boardBg" class="clip" width="960" height="1480" data-start="0" data-duration="4.5" data-track-index="1">
        <filter id="n1"><feTurbulence type="fractalNoise" baseFrequency=".006" numOctaves="3" seed="4" /><feColorMatrix values="0 0 0 0 .23  0 0 0 0 .34  0 0 0 0 .28  0 0 0 .9 0" /></filter>
        <filter id="n2"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="2" seed="9" /><feColorMatrix values="0 0 0 0 .9  0 0 0 0 .92  0 0 0 0 .88  0 0 0 .07 0" /></filter>
        <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0" /><stop offset=".55" stop-color="#fff" stop-opacity=".05" /><stop offset=".7" stop-color="#fff" stop-opacity="0" /></linearGradient>
        <rect width="960" height="1480" fill="#2e4a3b" /><rect width="960" height="1480" filter="url(#n1)" opacity=".55" /><rect width="960" height="1480" filter="url(#n2)" /><rect width="960" height="1480" fill="url(#sheen)" />
        <g font-family="Architects Daughter" fill="#eeede3" opacity=".05" font-size="80"><text x="80" y="1100">x + 7 = 12</text><text x="420" y="1260">2 · 9 = 18</text><text x="120" y="1390">verbs</text></g>
      </svg>
      <canvas id="cv" class="clip" width="1080" height="1920" data-start="0" data-duration="4.5" data-track-index="2"></canvas>
      <div id="tray" class="clip" data-start="0" data-duration="4.5" data-track-index="3"></div>
      <div class="stick clip" style="left:120px;width:110px;background:#eeede3" data-start="0" data-duration="4.5" data-track-index="4"></div>
      <div class="stick clip" style="left:250px;width:80px;background:#f6db6f" data-start="0" data-duration="4.5" data-track-index="5"></div>
      <div id="lab" class="clip" data-start="0" data-duration="4.5" data-track-index="6">EXAMPLE LESSON</div>
      <div id="fontprobe">Aa ×²</div>
    </div>

    <script>
      const DUR = 4.5, cv = document.getElementById("cv"), ctx = cv.getContext("2d");
      const FONT = (s) => `400 ${s}px "Architects Daughter"`;
      // chalk texture: a seeded alpha mask (75-90 % coverage) shared by all writing
      const rng = MF.rng("chalkboard-lesson");
      const tex = document.createElement("canvas"); tex.width = 1080; tex.height = 1920;
      { const tc = tex.getContext("2d"), img = tc.createImageData(1080, 1920);
        for (let i = 0; i < img.data.length; i += 4) { const v = rng(); img.data[i] = img.data[i + 1] = img.data[i + 2] = 255; img.data[i + 3] = v < 0.16 ? 0 : 190 + v * 65; }
        tc.putImageData(img, 0, 0); }
      // a line of chalk text, rasterised once, revealed letter by letter
      function makeLine(txt, x, y, size, color) {
        const c = document.createElement("canvas"); c.width = 1080; c.height = 1920;
        const g = c.getContext("2d"); g.font = FONT(size); g.fillStyle = color; g.textBaseline = "alphabetic";
        const jr = MF.rng(txt), edges = [x]; let cx = x;
        for (const ch of txt) { g.fillText(ch, cx + jr.range(-1, 1), y + jr.range(-1, 1)); cx += g.measureText(ch).width; edges.push(cx); }
        g.globalCompositeOperation = "destination-in"; g.drawImage(tex, 0, 0);
        return { c, edges, y, size, n: txt.length };
      }
      // reveal: k letters (fractional) -> clip width; returns the pen position for dust
      function drawLine(L, k, alpha) {
        if (k <= 0 || alpha <= 0) return null;
        const i = Math.min(L.n, Math.floor(k)), f = k - i, xr = i >= L.n ? L.edges[L.n] : L.edges[i] + (L.edges[i + 1] - L.edges[i]) * f;
        ctx.save(); ctx.globalAlpha = alpha; ctx.beginPath(); ctx.rect(0, L.y - L.size * 1.2, xr + 2, L.size * 1.6); ctx.clip(); ctx.drawImage(L.c, 0, 0); ctx.restore();
        return [xr, L.y - L.size * 0.2];
      }
      function chalkPath(pts, w, color, u, alpha) {   // a textured stroke along points, drawn up to fraction u
        if (u <= 0) return;
        const n = Math.max(1, Math.floor((pts.length - 1) * Math.min(1, u)));
        const c = scratch, g = c.getContext("2d"); g.clearRect(0, 0, 1080, 1920);
        g.strokeStyle = color; g.lineWidth = w; g.lineCap = "round"; g.lineJoin = "round"; g.beginPath(); g.moveTo(pts[0][0], pts[0][1]);
        for (let i = 1; i <= n; i++) g.lineTo(pts[i][0], pts[i][1]);
        g.stroke(); g.globalCompositeOperation = "destination-in"; g.drawImage(tex, 0, 0); g.globalCompositeOperation = "source-over";
        ctx.save(); ctx.globalAlpha = alpha; ctx.drawImage(c, 0, 0); ctx.restore();
      }
      const scratch = document.createElement("canvas"); scratch.width = 1080; scratch.height = 1920;
      let OLD, OLD2, H, L1, L2, L3, UL, ELL, TICK, ER, ready = false;
      function build() {
        OLD = makeLine("P = 2 × (l + w)", 110, 420, 100, "#eeede3");
        OLD2 = makeLine("P = 20 cm", 110, 600, 100, "#eeede3");
        H = makeLine("Chalkboard lesson", 100, 380, 98, "#eeede3");
        L1 = makeLine("A = l × w", 110, 600, 100, "#eeede3");
        L2 = makeLine("A = 6 cm × 4 cm", 110, 790, 100, "#eeede3");
        L3 = makeLine("A = 24 cm²", 110, 990, 110, "#eeede3");
        const ur = MF.rng("ul");
        UL = []; for (let i = 0; i <= 40; i++) UL.push([105 + i * 19, 420 - i * 0.6 + ur.range(-1.5, 1.5)]);
        const x0 = 110 + 270, cx = (L3.edges[4] + L3.edges[L3.n]) / 2, cy = L3.y - 34;
        ELL = []; for (let i = 0; i <= 70; i++) { const a = -2.9 + i / 70 * Math.PI * 2 * 1.1, w = 1 + 0.05 * Math.sin(i * 0.5); ELL.push([cx + Math.cos(a) * 250 * w, cy + Math.sin(a) * 78 * w + i * 0.25]); }
        TICK = [[cx + 290, cy - 6], [cx + 312, cy + 30], [cx + 362, cy - 62]];
        // eraser arcs over the old lines
        ER = []; for (let i = 0; i <= 90; i++) { const u = i / 90, arc = Math.floor(u * 3), v = u * 3 - arc, dir = arc % 2 ? -1 : 1;
          const x = dir > 0 ? 120 + v * 820 : 940 - v * 820; ER.push([x, 360 + arc * 120 + Math.sin(v * Math.PI) * -40]); }
        ready = true;
      }
      // eraser footprint and the cloudy smear it leaves
      function erase(u) {
        const n = Math.floor(u * (ER.length - 1));
        ctx.save(); ctx.globalCompositeOperation = "destination-out"; ctx.globalAlpha = 0.94;
        for (let i = 0; i <= n; i++) { ctx.beginPath(); ctx.ellipse(ER[i][0], ER[i][1], 120, 70, 0, 0, Math.PI * 2); ctx.fill(); }
        ctx.restore();
      }
      function smear(u, a) {
        const n = Math.floor(u * (ER.length - 1)); if (a <= 0) return;
        ctx.save(); ctx.globalAlpha = a;
        for (let i = 0; i <= n; i += 2) { const g = ctx.createRadialGradient(ER[i][0], ER[i][1], 10, ER[i][0], ER[i][1], 130); g.addColorStop(0, "rgba(238,237,227,.10)"); g.addColorStop(1, "rgba(238,237,227,0)"); ctx.fillStyle = g; ctx.fillRect(ER[i][0] - 130, ER[i][1] - 130, 260, 260); }
        ctx.restore();
      }
      function dust(pos, t, t0, seed) {   // specks fall 20-60 px from the pen and fade over 0.8 s
        if (!pos) return; const dr = MF.rng(seed);
        for (let i = 0; i < 10; i++) { const born = t0 + i * 0.08, age = t - born; if (age < 0 || age > 0.8) continue;
          const x = pos[0] + dr.range(-12, 12), y = pos[1] + 20 + dr.range(0, 40) * (age / 0.8) + 30; ctx.fillStyle = `rgba(238,237,227,${(1 - age / 0.8) * 0.8})`; ctx.fillRect(x, y, 3, 3); }
      }
      const S = (t, a, d) => Math.max(0, Math.min(1, (t - a) / d));
      function frame(t) {
        ctx.clearRect(0, 0, 1080, 1920);
        if (!ready) return;
        // 1) the previous board, erased in three arcs from 0.25 s to 1.35 s
        const eu = S(t, 0.25, 1.1);
        drawLine(OLD, 99, 1); drawLine(OLD2, 99, 1);
        if (eu > 0) erase(eu);
        smear(eu, eu > 0 ? 1 - S(t, 1.35, 0.6) * 0.6 : 0);
        // 2) heading writes live at ~13 chars/s, underline 0.2 s after
        const hk = S(t, 1.45, 1.3) * H.n, hp = drawLine(H, hk, 1);
        if (hk > 0 && hk < H.n) dust(hp, t, 1.45, "h");
        chalkPath(UL, 7, "#eeede3", S(t, 2.95, 0.3), 1);
        // 3) pre-written line fades in 0.4 s; the answer writes live
        drawLine(L1, 99, S(t, 2.75, 0.4));
        drawLine(L2, 99, S(t, 2.9, 0.4));
        const ak = S(t, 3.25, 0.75) * L3.n, ap = drawLine(L3, ak, 1);
        if (ak > 0 && ak < L3.n) dust(ap, t, 3.25, "a");
        // 4) yellow circle round the answer + a short tick
        chalkPath(ELL, 8, "#f6db6f", S(t, 3.85, 0.45), 1);
        chalkPath(TICK, 8, "#f6db6f", S(t, 4.25, 0.15), 1);
        // the eraser itself, on its arcs
        if (eu > 0 && eu < 1) { const p = ER[Math.floor(eu * (ER.length - 1))]; ctx.save(); ctx.translate(p[0], p[1]); ctx.rotate(-0.08);
          ctx.fillStyle = "#7a5534"; ctx.fillRect(-120, -46, 240, 54); ctx.fillStyle = "#3c3f45"; ctx.fillRect(-120, 8, 240, 30); ctx.restore(); }
      }

      const tl = MF.timeline("main", DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      const clock = { t: 0 };
      tl.fromTo(clock, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: () => frame(clock.t) }, 0);
      tl.seek(0);
      document.fonts.load(FONT(100)).then(() => document.fonts.ready).then(() => { build(); frame(clock.t); });
    </script>
  </body>
</html>
