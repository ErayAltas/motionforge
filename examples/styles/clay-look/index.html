<!doctype html>
<!--
  motionforge style preview: clay-look
  © 2026 motionforge contributors, MIT
  Signature scene: the morph squash, in three.js on a putty set (floor + curved back wall, one soft key
  from top-left with shadows, warm bounce). The pine-green hero drops in (stretch 0.85/1.18 in the fall,
  squash 1.25/0.80 for 2 frames, settle back.out(1.4) 0.25 s), props land the same way, then the hero
  squashes to 30 % height in 0.2 s, rolls into a ball and pops up as a star with back.out(1.8) in 0.3 s.
  Everything, the title letters included, is stepped on twos (12 drawings/s). Thumbprint texture is a
  seeded canvas bump map. Title letters are HTML with a layered "extruded" shadow, not 3D text.
  Original shapes. Fredoka + Lexend.
-->
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/mf-runtime.js"></script>
    <link rel="stylesheet" href="assets/base.css" />
    <style>
      /* fonts: @fontsource/fredoka, @fontsource/lexend (copied from node_modules/@fontsource/<family>/files/) */
      @font-face { font-family: "Fredoka"; font-weight: 700; font-style: normal; font-display: block; src: url("assets/fonts/fredoka-latin-700-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+20AC, U+20BA, U+2122, U+2190-2193, U+2212; }
      @font-face { font-family: "Fredoka"; font-weight: 700; font-style: normal; font-display: block; src: url("assets/fonts/fredoka-latin-ext-700-normal.woff2") format("woff2"); unicode-range: U+0100-0130, U+0132-0151, U+0154-024F, U+1E00-1EFF; }
      @font-face { font-family: "Lexend"; font-weight: 500; font-style: normal; font-display: block; src: url("assets/fonts/lexend-latin-500-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+20AC, U+20BA, U+2122, U+2190-2193, U+2212; }
      @font-face { font-family: "Lexend"; font-weight: 500; font-style: normal; font-display: block; src: url("assets/fonts/lexend-latin-ext-500-normal.woff2") format("woff2"); unicode-range: U+0100-0130, U+0132-0151, U+0154-024F, U+1E00-1EFF; }
      @font-face { font-family: "Lexend"; font-weight: 600; font-style: normal; font-display: block; src: url("assets/fonts/lexend-latin-600-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+20AC, U+20BA, U+2122, U+2190-2193, U+2212; }
      @font-face { font-family: "Lexend"; font-weight: 600; font-style: normal; font-display: block; src: url("assets/fonts/lexend-latin-ext-600-normal.woff2") format("woff2"); unicode-range: U+0100-0130, U+0132-0151, U+0154-024F, U+1E00-1EFF; }
      :root { --set: #E9DFD3; --ink: #2C2620; --grn: #2E9E6B; --org: #F2A541; --blu: #7DB3E0; --mf-grain-opacity: 0.03; }
      html, body { background: var(--set); }
      #root { background: var(--set); color: var(--ink); }
      #root::after { display: none; }
      #gl { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      #title { position: absolute; left: 0; right: 0; top: 300px; text-align: center; font: 700 150px/1 "Fredoka"; letter-spacing: -0.01em; color: #4A4037; }
      #title span { display: inline-block; transform-origin: 50% 100%;
        text-shadow: 0 2px 0 #3d342c, 0 4px 0 #3a3129, 0 6px 0 #362e27, 0 8px 0 #332b24, 0 10px 0 #2f2822, 0 22px 26px rgba(60,40,20,.28); }
      #plate { position: absolute; left: 190px; right: 190px; top: 1410px; padding: 26px 30px; border-radius: 44px; background: #F3ECE2; text-align: center;
               box-shadow: 0 10px 0 #D9CCBC, 0 22px 30px rgba(80,60,30,.18); font: 500 52px/1.2 "Lexend"; color: var(--ink); }
      #tag { position: absolute; left: 0; right: 0; top: 1600px; text-align: center; font: 600 30px/1 "Lexend"; color: #8A7D6E; }
      #grain { position: absolute; inset: 0; z-index: 5; pointer-events: none; background-image: var(--mf-grain); opacity: 0.05; mix-blend-mode: multiply; }
    </style>
    <script type="importmap">{ "imports": { "three": "./assets/vendor/three.module.min.js", "three/addons/": "./assets/vendor/three-addons/" } }</script>
  </head>
  <body>
    <div id="root" class="mf-stage light" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1080" data-height="1920">
      <canvas id="gl" class="clip" width="1080" height="1920" data-start="0" data-duration="4.5" data-track-index="0"></canvas>
      <h1 id="title" class="clip" data-start="0" data-duration="4.5" data-track-index="1">Clay look</h1>
      <div id="plate" class="clip" data-start="0" data-duration="4.5" data-track-index="2">Squash, roll, pop.</div>
      <div id="tag" class="clip" data-start="0" data-duration="4.5" data-track-index="3">stop motion, on twos</div>
      <div id="grain"></div>
    </div>

    <script>
      const DUR = 4.5;
      const tl = MF.timeline("main", DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;   // explicit registration (MF.timeline already does this; keeps the linter happy)
      // captions: flat ink on a putty plate, stepped like the rest
      tl.fromTo("#plate", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.33, ease: "steps(4)" }, 2.9);
      tl.fromTo("#tag", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "steps(3)" }, 3.2);
      tl.seek(0);
    </script>
    <script type="module">
      import * as THREE from "three";
      import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
      import { createStage, environment, onSeek, seg, ease, rng } from "./assets/vendor/mf-three.js";

      const { renderer, scene, camera, render } = createStage({ fov: 34, toneMapping: "neutral", background: "#E9DFD3" });
      environment(renderer, scene, 0.15);
      // one large soft key from top-left + warm bounce
      const key = new THREE.DirectionalLight(0xfff1e0, 3.2);
      key.position.set(-4, 7, 4); key.castShadow = true;
      key.shadow.mapSize.set(1024, 1024); key.shadow.radius = 9; key.shadow.bias = -0.0005; key.shadow.normalBias = 0.02;
      Object.assign(key.shadow.camera, { left: -4, right: 4, top: 4, bottom: -4, near: 1, far: 30 });
      scene.add(key, new THREE.HemisphereLight(0xfff6ea, 0xc9a27a, 0.55));

      // thumbprint bump texture: seeded clusters of concentric arcs
      function printTex(seed) {
        const c = document.createElement("canvas"); c.width = c.height = 512;
        const g = c.getContext("2d"), r = rng(seed);
        g.fillStyle = "#808080"; g.fillRect(0, 0, 512, 512);
        for (let k = 0; k < 26; k++) {
          const x = r() * 512, y = r() * 512, a = r() * Math.PI, s = 18 + r() * 26;
          g.save(); g.translate(x, y); g.rotate(a);
          for (let i = 1; i < 8; i++) { g.strokeStyle = i % 2 ? "rgba(255,255,255,.22)" : "rgba(0,0,0,.22)"; g.lineWidth = 2.2; g.beginPath(); g.ellipse(0, 0, s * i / 7, s * 0.7 * i / 7, 0, 0.3, Math.PI * 1.7); g.stroke(); }
          g.restore();
        }
        for (let i = 0; i < 900; i++) { g.fillStyle = r() < 0.5 ? "rgba(255,255,255,.12)" : "rgba(0,0,0,.12)"; g.beginPath(); g.arc(r() * 512, r() * 512, 1 + r() * 4, 0, 7); g.fill(); }
        const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
      }
      const clay = (hex, seed, rep = 1) => { const b = printTex(seed); b.repeat.set(rep, rep); return new THREE.MeshStandardMaterial({ color: hex, roughness: 0.82, metalness: 0, bumpMap: b, bumpScale: 2.2 }); };

      // the set: floor that curves up into the back wall (one swept profile)
      const prof = [];
      for (let z = 8; z > -1.2; z -= 0.6) prof.push([z, 0]);
      for (let i = 0; i <= 12; i++) { const a = i / 12 * Math.PI / 2; prof.push([-1.2 - Math.sin(a) * 2, 2 - Math.cos(a) * 2]); }
      for (let y = 2.6; y <= 12; y += 1.2) prof.push([-3.2, y]);
      const pos = [], idx = [], XS = [-9, 0, 9];
      prof.forEach(([z, y]) => XS.forEach((x) => pos.push(x, y, z)));
      for (let i = 0; i < prof.length - 1; i++) for (let j = 0; j < 2; j++) { const a = i * 3 + j, b = a + 1, c = a + 3, d = c + 1; idx.push(a, c, b, b, c, d); }
      const sg = new THREE.BufferGeometry(); sg.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3)); sg.setIndex(idx); sg.computeVertexNormals();
      const setMesh = new THREE.Mesh(sg, new THREE.MeshStandardMaterial({ color: "#E9DFD3", roughness: 0.95, side: THREE.DoubleSide }));
      setMesh.receiveShadow = true; scene.add(setMesh);

      // hero (green): rounded cube -> squash -> ball -> star
      const GREEN = clay("#3C9A6E", "g", 1.2);
      const cube = new THREE.Mesh(new RoundedBoxGeometry(1.0, 1.0, 1.0, 5, 0.22), GREEN);
      const ball = new THREE.Mesh(new THREE.SphereGeometry(0.56, 40, 28), GREEN);
      const sh = new THREE.Shape(); for (let i = 0; i < 10; i++) { const a = Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? 0.3 : 0.68; i ? sh.lineTo(Math.cos(a) * r, Math.sin(a) * r) : sh.moveTo(Math.cos(a) * r, Math.sin(a) * r); } sh.closePath();
      const starG = new THREE.ExtrudeGeometry(sh, { depth: 0.32, bevelEnabled: true, bevelThickness: 0.12, bevelSize: 0.1, bevelSegments: 5, curveSegments: 4 }); starG.center();
      const star = new THREE.Mesh(starG, GREEN);
      // eyes for the hero (ink)
      const inkM = new THREE.MeshStandardMaterial({ color: "#2C2620", roughness: 0.6 });
      function eyes(parent, y, z, s = 1) { [-0.17, 0.17].forEach((x) => { const e = new THREE.Mesh(new THREE.SphereGeometry(0.075 * s, 16, 12), inkM); e.position.set(x * s, y, z); e.scale.z = 0.5; parent.add(e); }); }
      eyes(cube, 0.12, 0.51); eyes(star, 0.08, 0.27, 0.9);
      // props: orange ball, blue disc
      const prop1 = new THREE.Mesh(new THREE.SphereGeometry(0.36, 32, 24), clay("#E8A04A", "o"));
      const prop2 = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.46, 0.34, 40), clay("#80AFD6", "b"));
      [cube, ball, star, prop1, prop2].forEach((m) => { m.castShadow = true; m.receiveShadow = true; scene.add(m); });

      camera.position.set(0, 3.0, 10.5); camera.lookAt(0, 0.7, 0);
      camera.setViewOffset(1080, 1920, 0, -(1000 - 960), 1080, 1920);

      // drop with stretch in the fall, 2-frame squash on landing, back.out settle; returns [y, sx, sy]
      function drop(t, t0, h, base) {
        const fall = 0.32;
        if (t < t0) return [h + 6, 1, 1];
        if (t < t0 + fall) { const k = (t - t0) / fall; return [base + h * (1 - k * k), 0.85, 1.18]; }
        if (t < t0 + fall + 0.067) return [base, 1.25, 0.8];
        const k = seg(t, t0 + fall + 0.067, 0.25), b = ease.outBack(k, 1.4 * 1.70158 / 1.4);
        return [base, 1.25 + (1 - 1.25) * b, 0.8 + (1 - 0.8) * b];
      }
      const LET = [...document.querySelectorAll("#title")].map((e) => { e.innerHTML = [...e.textContent].map((c) => `<span>${c === " " ? "&nbsp;" : c}</span>`).join(""); return [...e.querySelectorAll("span")]; })[0];

      function draw(t0) {
        const t = Math.floor(t0 * 12) / 12;   // stepped on twos
        // title: extruded letters drop in one by one (0.08 s stagger), each lands with a squash
        LET.forEach((s, i) => {
          const [y, sx, sy] = drop(t, 0.05 + i * 0.08, 1, 0);
          const vis = t >= 0.05 + i * 0.08;
          s.style.opacity = vis ? 1 : 0;
          s.style.transform = `translateY(${(-y * 160).toFixed(1)}px) scale(${sx},${sy})`;
        });
        // props land
        const p1 = drop(t, 0.75, 3, 0.36); prop1.position.set(-1.15, p1[0], 0.2); prop1.scale.set(p1[1], p1[2], p1[1]);
        const p2 = drop(t, 0.95, 3, 0.17); prop2.position.set(1.15, p2[0], 0.1); prop2.scale.set(p2[1], p2[2], p2[1]);
        // hero
        cube.visible = ball.visible = star.visible = false;
        if (t < 1.85) {
          let [y, sx, sy] = drop(t, 0.45, 3.4, 0.5);
          if (t >= 1.6) { const k = ease.outCubic(seg(t, 1.6, 0.15)); sx = 1 + 0.12 * k; sy = 1 - 0.1 * k; }   // anticipation
          cube.visible = true; cube.position.set(0, y - 0.5 + 0.5 * sy, 0); cube.scale.set(sx, sy, sx);
          if (t < 0.45) cube.position.y = 9;
        } else if (t < 2.05) {
          const k = ease.inOutCubic(seg(t, 1.85, 0.2)), sy = 0.9 - 0.6 * k, sx = 1.12 + 0.38 * k;   // squash to 30 %
          cube.visible = true; cube.position.set(0, 0.5 * sy, 0); cube.scale.set(sx, sy, sx);
        } else if (t < 2.4) {
          const k = seg(t, 2.05, 0.35), r = ease.outBack(k);   // rolls up into a ball
          ball.visible = true; const s = 0.35 + 0.65 * Math.min(1.05, r);
          ball.scale.set(1.3 - 0.3 * r, s, 1.3 - 0.3 * r); ball.position.set(-0.25 * Math.sin(k * Math.PI), 0.56 * s, 0); ball.rotation.z = k * 2.4;
        } else {
          const k = seg(t, 2.4, 0.3), b = ease.outBack(k, 1.8 * 1.70158 / 1.7), hop = Math.sin(Math.min(1, k * 1.15) * Math.PI) * 0.7;
          star.visible = true; const s = 0.25 + 0.75 * b;
          star.scale.set(s, s, s); star.position.set(0, 0.85 * s + hop, 0);
          star.rotation.y = -0.35 + 0.35 * ease.outCubic(seg(t, 2.4, 0.6)) + 0.08 * Math.sin(t * 2);
          // landing squash after the hop
          if (t > 2.75 && t < 2.84) star.scale.set(1.18, 0.84, 1.18), star.position.y = 0.85 * 0.84;
        }
        render();
      }
      onSeek(draw, document.fonts ? document.fonts.ready : undefined);
    </script>
  </body>
</html>
