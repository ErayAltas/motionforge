  <body>

    <script>
      const DUR = 4.5;
      const m = document.getElementById("mast");
      m.innerHTML = [...m.textContent].map((c) => `<span>${c}</span>`).join("");
      // the head layer is cut from the same picture: it only shows where the face rises above the image top
      document.querySelector("#head svg").setAttribute("viewBox", "0 -170 960 1180");
      document.getElementById("head").style.top = "190px";
      document.querySelector("#img svg").innerHTML += document.querySelector("#head svg").innerHTML;

      const tl = MF.timeline("main", DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;   // explicit registration (MF.timeline already does this; keeps the linter happy)
      tl.set("#pg2", { x: 1080 }, 0);
      tl.fromTo(["#issue", "#issue2"], { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.05);
      tl.fromTo("#mast span", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out", stagger: 0.03 }, 0.1);
      // photo wipes top to bottom; the cut-out head appears with it, above the letters
      tl.fromTo("#img", { clipPath: "inset(0% 0% 100% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.7, ease: "power3.inOut" }, 0.45);
      tl.fromTo("#head", { clipPath: "inset(0% 0% 100% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.5, ease: "power3.inOut" }, 0.45);
      tl.to("#img svg, #head svg", { scale: 1.03, duration: 3, ease: "none", transformOrigin: "50% 30%" }, 0.45);
      tl.fromTo("#look", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 1.2);
      tl.fromTo("#deck", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 1.35);
      tl.fromTo("#folio", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 1.55);
      // page slide: the whole page moves left 1080 px, the next page 60 ms behind
      tl.to("#pg1", { x: -1080, duration: 0.6, ease: "power4.inOut" }, 2.85);
      tl.to("#pg2", { x: 0, duration: 0.6, ease: "power4.inOut" }, 2.91);
      tl.fromTo("#q", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 3.25);
      tl.fromTo(["#qa", "#qb"], { opacity: 0 }, { opacity: 1, duration: 0.5, stagger: 0.1 }, 3.5);
      tl.seek(0);
    </script>
