<!doctype html>
<!--
  motionforge style preview: postcard-collage
  © 2026 motionforge contributors, MIT
  Signature scenes "drop-and-tape" + "ballpoint circle": keepsakes fall onto a kraft desk from scale 1.12
  and +-14 deg to a seeded rest angle (0.35 s back.out(1.4)), a washi strip slaps a corner 4 frames later
  (0 -> 1 along its length in 0.12 s), then a blue ballpoint ellipse circles the pick in 0.5 s and a note
  writes on at 18 chars/s with seeded baseline wobble. Abril Fatface + Caveat + Karla.
  The "photos" are original illustrations; the town and prices are fictional.
-->
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/mf-runtime.js"></script>
    <link rel="stylesheet" href="assets/base.css" />
    <style>
      @font-face { font-family: "Abril Fatface"; font-weight: 400; font-style: normal; font-display: block; src: url("assets/fonts/abril-fatface-latin-400-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+20AC, U+20BA, U+2122, U+2190-2193, U+2212; }
      @font-face { font-family: "Abril Fatface"; font-weight: 400; font-style: normal; font-display: block; src: url("assets/fonts/abril-fatface-latin-ext-400-normal.woff2") format("woff2"); unicode-range: U+0100-0130, U+0132-0151, U+0154-024F, U+1E00-1EFF; }
      @font-face { font-family: "Caveat"; font-weight: 600; font-style: normal; font-display: block; src: url("assets/fonts/caveat-latin-600-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+20AC, U+20BA, U+2122, U+2190-2193, U+2212; }
      @font-face { font-family: "Caveat"; font-weight: 600; font-style: normal; font-display: block; src: url("assets/fonts/caveat-latin-ext-600-normal.woff2") format("woff2"); unicode-range: U+0100-0130, U+0132-0151, U+0154-024F, U+1E00-1EFF; }
      @font-face { font-family: "Karla"; font-weight: 600; font-style: normal; font-display: block; src: url("assets/fonts/karla-latin-600-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+20AC, U+20BA, U+2122, U+2190-2193, U+2212; }
      @font-face { font-family: "Karla"; font-weight: 600; font-style: normal; font-display: block; src: url("assets/fonts/karla-latin-ext-600-normal.woff2") format("woff2"); unicode-range: U+0100-0130, U+0132-0151, U+0154-024F, U+1E00-1EFF; }
      @font-face { font-family: "Karla"; font-weight: 700; font-style: normal; font-display: block; src: url("assets/fonts/karla-latin-700-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+20AC, U+20BA, U+2122, U+2190-2193, U+2212; }
      @font-face { font-family: "Karla"; font-weight: 700; font-style: normal; font-display: block; src: url("assets/fonts/karla-latin-ext-700-normal.woff2") format("woff2"); unicode-range: U+0100-0130, U+0132-0151, U+0154-024F, U+1E00-1EFF; }
      :root { --bg: #c8ac83; --card: #fbf7ee; --ink: #2a2522; --acc: #2c4fa3; --tape: #eadfaf; --sup: #c46a5a; --mf-grain-opacity: .08; }
      html, body { background: var(--bg); }
      #root { background: radial-gradient(900px 800px at 85% 10%, #d8bf98 0%, transparent 70%), var(--bg); }
      #root::before { mix-blend-mode: multiply; opacity: .16; }
      #root::after { background: radial-gradient(ellipse at 50% 50%, transparent 60%, rgba(60,40,20,.22) 100%); }
      #desk { position: absolute; inset: 0; transform-origin: 70% 70%; }
      #label { position: absolute; left: 80px; top: 250px; font: 600 34px/1 "Karla", system-ui; color: var(--ink); opacity: .75; }
      #title { position: absolute; left: 74px; top: 296px; font: 400 150px/0.95 "Abril Fatface", Georgia; color: var(--ink); letter-spacing: -0.005em; }
      .obj { position: absolute; background: var(--card); border-radius: 4px; box-shadow: 0 10px 24px rgba(42,37,34,.25); }
      .obj svg.pic { position: absolute; display: block; }
      #hero { left: 150px; top: 640px; width: 760px; height: 880px; }
      #hero svg.pic { left: 18px; top: 18px; width: 724px; height: 844px; }
      #polar { left: 70px; top: 1290px; width: 360px; height: 430px; }
      #polar svg.pic { left: 20px; top: 20px; width: 320px; height: 330px; }
      #polar .cap { position: absolute; left: 24px; bottom: 22px; font: 600 34px/1 "Karla", system-ui; color: var(--ink); }
      #stub { left: 640px; top: 1400px; width: 380px; height: 170px; background: #f4ecd8; border-radius: 6px; }
      #stub::before { content: ""; position: absolute; left: 270px; top: 10px; bottom: 10px; border-left: 3px dashed rgba(42,37,34,.35); }
      #stub .a { position: absolute; left: 26px; top: 26px; font: 700 26px/1 "Karla", system-ui; letter-spacing: .12em; color: var(--sup); }
      #stub .b { position: absolute; left: 26px; top: 66px; font: 700 54px/1 "Karla", system-ui; color: var(--ink); font-variant-numeric: tabular-nums; }
      #stub .c { position: absolute; left: 290px; top: 52px; font: 700 54px/1 "Karla", system-ui; color: var(--ink); }
      .tape { position: absolute; height: 58px; background: var(--tape); opacity: .9; transform-origin: 0 50%;
        background-image: radial-gradient(circle, rgba(196,106,90,.35) 3px, transparent 3.5px); background-size: 22px 22px; }
      #ink { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; pointer-events: none; }
      #note { position: absolute; left: 470px; top: 1615px; font: 600 72px/1 "Caveat", cursive; color: var(--acc); white-space: nowrap; }
      #note span { display: inline-block; }
    </style>
  </head>
  <body>
    <div id="root" class="mf-stage" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1080" data-height="1920">
      <div id="desk" class="clip" data-start="0" data-duration="4.5" data-track-index="0">
        <div id="label">Greetings from Marisol</div>
        <div id="title">Postcard<br />collage</div>
        <div id="hero" class="obj">
          <svg class="pic" viewBox="0 0 724 844" preserveAspectRatio="none">
            <defs>
              <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3b27a" /><stop offset=".55" stop-color="#f8d3a0" /><stop offset="1" stop-color="#fbe6c4" /></linearGradient>
              <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6aa3b4" /><stop offset="1" stop-color="#2f6f86" /></linearGradient>
            </defs>
            <rect width="724" height="844" fill="url(#sky)" />
            <circle cx="520" cy="300" r="70" fill="#fff1d2" opacity=".95" />
            <path d="M0 360 C120 330 220 350 330 320 C440 290 560 330 724 300 L724 470 L0 470 Z" fill="#c98a6a" opacity=".55" />
            <rect y="440" width="724" height="404" fill="url(#sea)" />
            <g stroke="#fff4dc" stroke-width="4" opacity=".55" stroke-linecap="round"><path d="M420 470 H620 M450 500 H590 M470 530 H570" /></g>
            <path d="M0 560 C80 520 160 520 230 560 C300 600 330 660 330 844 L0 844 Z" fill="#9c6b45" />
            <g id="houses"></g>
            <g transform="translate(470 610)"><path d="M-60 0 H60 L40 26 H-40 Z" fill="#f7efe0" /><path d="M0 -90 V0 M0 -86 L44 -12 H0" stroke="#f7efe0" stroke-width="5" fill="#fbe9c9" /></g>
          </svg>
        </div>
        <div id="polar" class="obj">
          <svg class="pic" viewBox="0 0 320 330">
            <rect width="320" height="330" fill="#7d9a8a" />
            <rect y="210" width="320" height="120" fill="#c79b6a" />
            <ellipse cx="160" cy="230" rx="120" ry="40" fill="#efe4cf" />
            <ellipse cx="130" cy="214" rx="46" ry="16" fill="#fff" /><ellipse cx="130" cy="210" rx="34" ry="10" fill="#6b3f22" />
            <path d="M174 206 a14 12 0 0 1 0 22" fill="none" stroke="#fff" stroke-width="6" />
            <ellipse cx="216" cy="226" rx="40" ry="14" fill="#fff" /><circle cx="216" cy="218" r="18" fill="#d9a35a" /><circle cx="216" cy="218" r="8" fill="#7b2e3a" />
          </svg>
          <div class="cap">fig tart, day 2</div>
        </div>
        <div id="stub" class="obj"><div class="a">FERRY · ADMIT ONE</div><div class="b">10:40</div><div class="c">€4</div></div>
        <div id="tA" class="tape" style="left:780px;top:600px;width:200px"></div>
        <div id="tB" class="tape" style="left:180px;top:1268px;width:170px"></div>
        <div id="tC" class="tape" style="left:900px;top:1380px;width:150px"></div>
        <svg id="ink" viewBox="0 0 1080 1920"><path id="circ" fill="none" stroke="#2c4fa3" stroke-width="5" stroke-linecap="round" /></svg>
        <div id="note"></div>
      </div>
    </div>

    <script>
      const DUR = 4.5, FR = 1 / 30;
      const tl = MF.timeline("main", DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;   // explicit registration (MF.timeline already does this)
      const r = MF.rng("postcards");
      // white houses on the hill (seeded)
      const hs = document.getElementById("houses");
      let h = "";
      for (let i = 0; i < 9; i++) { const x = r.range(10, 260), y = r.range(560, 760), w = r.range(34, 58); h += `<rect x="${x.toFixed(0)}" y="${y.toFixed(0)}" width="${w.toFixed(0)}" height="${(w * 0.8).toFixed(0)}" fill="#f7efe0"/><path d="M${x - 4} ${y} L${x + w / 2} ${y - 18} L${x + w + 4} ${y} Z" fill="#c46a5a"/>`; }
      hs.innerHTML = h;
      // drop-and-tape: rest angle seeded in -4..6 deg, tape slaps 4 frames after the card lands
      const drop = (card, tape, at, rot, trot) => {
        const from = r() < 0.5 ? -14 : 14;
        tl.fromTo(card, { scale: 1.12, opacity: 0, rotation: from }, { scale: 1, opacity: 1, rotation: rot, duration: 0.35, ease: "back.out(1.4)" }, at);
        tl.fromTo(card, { boxShadow: "0 30px 50px rgba(42,37,34,.18)" }, { boxShadow: "0 10px 24px rgba(42,37,34,.25)", duration: 0.35 }, at);
        tl.fromTo(tape, { scaleX: 0, opacity: 0.9, rotation: trot }, { scaleX: 1, opacity: 0.9, rotation: trot, duration: 0.12, ease: "power2.out" }, at + 0.35 + 4 * FR);
      };
      tl.fromTo("#label", { opacity: 0 }, { opacity: 0.75, duration: 0.3 }, 0.05);
      tl.fromTo("#title", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.1);
      drop("#hero", "#tA", 0.4, -3, 36);
      drop("#polar", "#tB", 1.05, 5, -25);
      drop("#stub", "#tC", 1.6, -6, -36);
      // ballpoint ellipse around the pick (the ferry time), loose and slightly open
      const cx = 760, cy = 1480, rx = 150, ry = 80;
      let d = "";
      for (let i = 0; i <= 64; i++) { const a = -2.6 + i / 64 * Math.PI * 2.15; const w = 1 + 0.05 * Math.sin(i * 0.7); d += (i ? " L" : "M") + (cx + Math.cos(a) * rx * w).toFixed(1) + " " + (cy + Math.sin(a) * ry * w + i * 0.25).toFixed(1); }
      const circ = document.getElementById("circ"); circ.setAttribute("d", d);
      const CL = circ.getTotalLength(); circ.style.strokeDasharray = CL;
      tl.fromTo(circ, { strokeDashoffset: CL }, { strokeDashoffset: 0, duration: 0.5, ease: "power1.inOut" }, 2.25);
      // note writes on at 18 chars/s, each word on its own seeded baseline
      const note = document.getElementById("note"), TXT = "take the early one!";
      note.innerHTML = TXT.split(" ").map((w) => `<span style="transform:translateY(${r.range(-3, 3).toFixed(1)}px)">${w}</span>`).join(" ");
      tl.fromTo(note, { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: TXT.length / 18, ease: "none" }, 2.8);
      // slow drift toward the newest card
      tl.fromTo("#desk", { scale: 1 }, { scale: 1.03, duration: DUR, ease: "none" }, 0);
      tl.seek(0);
    </script>
  </body>
</html>
