<!doctype html>

  indicator magenta, while in the three.js inset a proton moves from H3O+ to OH- (stick shrinks to its

      /* fonts:end */
      :root { --bg: #edf4f1; --ink: #14303a; --acc: #e0337b; --glass: #9ccfd3; --sup: #5e7a82; --mf-grain-opacity: .03;
        --lx: "Lexend", system-ui, sans-serif; --at: "Atkinson Hyperlegible", system-ui, sans-serif; }
      html, body { background: var(--bg); }
      #root { background: radial-gradient(1100px 700px at 50% 0%, #f7fbf9 0%, transparent 70%), var(--bg); color: var(--ink); }
      #root::before { mix-blend-mode: multiply; }
      #root::after { background: linear-gradient(180deg, transparent 1346px, rgba(255,255,255,.55) 1350px, rgba(20,48,58,.06) 1356px, transparent 1420px); }
      #title { position: absolute; left: 80px; top: 250px; font: 700 110px/1 var(--lx); letter-spacing: -0.02em; }
      #sub { position: absolute; left: 84px; top: 376px; font: 700 30px/1 var(--at); color: var(--sup); }
      #sub b { color: var(--acc); }
      #inset { position: absolute; left: 80px; top: 460px; width: 360px; height: 360px; border-radius: 50%; background: #ffffff; box-shadow: inset 0 0 0 3px rgba(20,48,58,.15), 0 10px 24px rgba(20,48,58,.08); }
      #insetL { position: absolute; left: 80px; top: 836px; width: 360px; text-align: center; font: 700 26px/1.3 var(--at); color: var(--sup); }
      #gl { position: absolute; left: 0; top: 0; z-index: 2; }
      #app { position: absolute; left: 0; top: 0; z-index: 1; overflow: visible; }
      .lab { position: absolute; font: 700 34px/1.2 var(--at); color: var(--ink); white-space: nowrap; z-index: 3; }
      .lab small { display: block; font-weight: 400; font-size: 28px; color: var(--sup); }
      #badge { position: absolute; left: 820px; top: 1230px; padding: 8px 16px; border-radius: 30px; background: var(--ink); color: #fff; font: 700 26px/1 var(--at); z-index: 3; }
      #eq { position: absolute; left: 0; right: 0; top: 1338px; text-align: center; font: 400 60px/1 var(--at); color: var(--ink); z-index: 3; }
      #eq sub, #eq sup { font-size: 70%; line-height: 0; }
      #cap { position: absolute; left: 80px; top: 1490px; width: 920px; font: 600 50px/1.2 var(--lx); color: var(--ink); z-index: 3; }
      #cap b { color: var(--acc); font-weight: 600; }
      #note { position: absolute; left: 80px; top: 1640px; font: 700 24px/1 var(--at); color: var(--sup); z-index: 3; }

  </head>
  <body>
    <div id="root" class="mf-stage" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1080" data-height="1920">
      <div id="title" class="clip" data-start="0" data-duration="4.5" data-track-index="0">Science lab</div>
      <div id="sub" class="clip" data-start="0" data-duration="4.5" data-track-index="1">Titration · <b>indicator flip</b></div>
      <div id="inset" class="clip" data-start="0" data-duration="4.5" data-track-index="2"></div>
      <div id="insetL" class="clip" data-start="0" data-duration="4.5" data-track-index="3">H₃O⁺ gives a proton to OH⁻</div>
      <svg id="app" class="clip" width="1080" height="1920" viewBox="0 0 1080 1920" data-start="0" data-duration="4.5" data-track-index="4">
        <defs><clipPath id="flaskClip"><path d="M610 820 L610 940 L470 1250 Q462 1290 500 1290 L860 1290 Q898 1290 890 1250 L750 940 L750 820 Z" /></clipPath></defs>
        <!-- stand -->
        <rect id="rod" x="940" y="460" width="12" height="840" fill="#b9c8c6" />
        <rect x="860" y="1290" width="160" height="16" rx="4" fill="#b9c8c6" />
        <rect x="690" y="560" width="250" height="12" fill="#b9c8c6" />
        <!-- burette -->
        <g id="bur" fill="none" stroke="#14303a" stroke-width="4" stroke-linejoin="round">
          <path class="ol" d="M664 470 L664 760 L672 790 L688 790 L696 760 L696 470" />
          <path class="ol" d="M650 740 L710 740" />
        </g>
        <rect x="668" y="500" width="24" height="238" fill="#9ccfd3" opacity=".55" />
        <!-- flask: liquid, then glass with two highlights -->
        <g clip-path="url(#flaskClip)"><path id="liq" d="M380 1100 Q680 1080 980 1100 L980 1300 L380 1300 Z" fill="#9ccfd3" opacity=".7" /></g>
        <path class="ol" d="M610 820 L610 940 L470 1250 Q462 1290 500 1290 L860 1290 Q898 1290 890 1250 L750 940 L750 820" fill="none" stroke="#14303a" stroke-width="5" stroke-linejoin="round" />
        <ellipse class="ol" cx="680" cy="820" rx="76" ry="12" fill="none" stroke="#14303a" stroke-width="4" />
        <path d="M630 960 L520 1220" stroke="#ffffff" stroke-width="6" opacity=".5" stroke-linecap="round" />
        <circle id="drop" cx="680" cy="800" r="9" fill="#9ccfd3" opacity="0" />
        <!-- leader lines -->
        <path id="ld0" d="M698 660 L716 660" stroke="#5e7a82" stroke-width="2" fill="none" />
        <path id="ld1" d="M540 1180 L440 1180" stroke="#5e7a82" stroke-width="2" fill="none" />
        <path id="ld2" d="M800 1100 L880 1040" stroke="#e0337b" stroke-width="3" fill="none" />
      </svg>
      <div class="lab clip" id="l0" style="left:722px;top:630px" data-start="0" data-duration="4.5" data-track-index="5">Burette<small>0.100 M NaOH</small></div>
      <div class="lab clip" id="l1" style="left:96px;top:1150px" data-start="0" data-duration="4.5" data-track-index="6">Flask<small>25.0 mL HCl + indicator</small></div>
      <div class="lab clip" id="l2" style="left:780px;top:960px;color:#e0337b" data-start="0" data-duration="4.5" data-track-index="7">Endpoint</div>
      <div id="badge" class="clip" data-start="0" data-duration="4.5" data-track-index="8">×8</div>
      <canvas id="gl" class="clip" width="1080" height="1920" data-start="0" data-duration="4.5" data-track-index="9"></canvas>
      <div id="eq" class="clip" data-start="0" data-duration="4.5" data-track-index="10">H<sub>3</sub>O<sup>+</sup> + OH<sup>−</sup> → 2 H<sub>2</sub>O</div>
      <div id="cap" class="clip" data-start="0" data-duration="4.5" data-track-index="11">At the endpoint the indicator turns <b>magenta</b>.</div>
      <div id="note" class="clip" data-start="0" data-duration="4.5" data-track-index="12">SIMULATION · SPEED ×8 · EXAMPLE VALUES</div>
    </div>

    <script>
      const DUR = 4.5;
      const tl = MF.timeline("main", DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      document.querySelectorAll(".ol").forEach((p) => { const L = p.getTotalLength(); p.style.strokeDasharray = `${L} ${L}`; p.style.strokeDashoffset = L; });
      ["#ld0", "#ld1", "#ld2"].forEach((s) => { const p = document.querySelector(s), L = p.getTotalLength(); p.style.strokeDasharray = `${L} ${L}`; p.style.strokeDashoffset = L; });
      tl.fromTo(["#title", "#sub"], { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, stagger: 0.1, ease: "power2.out" }, 0.05);
      tl.fromTo(["#inset", "#insetL"], { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.4, ease: "power2.out" }, 0.2);
      tl.to(".ol", { strokeDashoffset: 0, duration: 0.8, ease: "power2.inOut" }, 0.3);
      // labels: leader line 0.3 s power2.out, then text 0.2 s, 0.15 s stagger
      [["#ld0", "#l0"], ["#ld1", "#l1"]].forEach(([ld, lb], i) => {
        tl.to(ld, { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, 1.0 + i * 0.15);
        tl.fromTo(lb, { opacity: 0 }, { opacity: 1, duration: 0.2 }, 1.3 + i * 0.15);
      });
      // indicator flip: a drop falls, the liquid hue turns magenta over the (scaled) reaction time
      tl.set("#drop", { opacity: 1 }, 1.9);
      tl.fromTo("#drop", { attr: { cy: 800 } }, { attr: { cy: 1095 }, duration: 0.4, ease: "power2.in" }, 1.9);
      tl.set("#drop", { opacity: 0 }, 2.3);
      tl.to("#liq", { attr: { fill: "#e0337b" }, opacity: 0.8, duration: 0.8, ease: "sine.inOut" }, 2.3);
      tl.fromTo("#badge", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2)" }, 2.3);
      tl.to("#ld2", { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, 2.9);
      tl.fromTo("#l2", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 3.1);
      tl.fromTo("#eq", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 3.55);
      tl.fromTo("#cap", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 3.75);
      tl.fromTo("#note", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 3.9);
      tl.seek(0);
    </script>
    <script type="module">
      import * as THREE from "three";
      import { createStage, environment, lights, onSeek, ease, seg, lerp } from "./assets/vendor/mf-three.js";
      const { renderer, scene, camera, render } = createStage({ fov: 22, shadows: false, toneMapping: "neutral" });
      environment(renderer, scene, 0.6);
      lights.studio(scene, { shadow: false });
      // frame the molecule in the inset (centre x 260, y 640) without tilting the camera
      camera.setViewOffset(1080, 1920, (540 - 260), (960 - 640), 1080, 1920);
      camera.position.set(0, 0, 84); camera.lookAt(0, 0, 0);
      const mol = new THREE.Group(); scene.add(mol);
      const mat = (c) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.35, metalness: 0 });
      const O = mat("#e5322d"), H = mat("#f4f4f4"), S = mat("#b9c3c6");
      const sph = (r, m) => new THREE.Mesh(new THREE.SphereGeometry(r, 32, 20), m);
      // atoms: left H3O+ (O1 + 3 H, Ht is the one that moves), right OH- (O2 + H)
      const A = {
        O1: [-1.7, 0, 0], H1: [-2.25, 0.8, 0], H2: [-2.25, -0.45, 0.7], Ht: [-0.75, 0.05, 0], O2: [1.5, 0, 0], H3: [2.35, 0.45, -0.1],
      };
      const HtEnd = [0.95, -0.75, 0.25];
      const atoms = {};
      for (const k in A) { const m = sph(k[0] === "O" ? 0.52 : 0.34, k[0] === "O" ? O : H); m.position.set(...A[k]); mol.add(m); atoms[k] = m; }
      const R = 0.1;   // stick radius ~0.24 of the hydrogen diameter scale
      function stick() { const m = new THREE.Mesh(new THREE.CylinderGeometry(R, R, 1, 16), S); mol.add(m); return m; }
      function place(st, a, b, k) {   // stick from a to b, scaled to fraction k around its midpoint
        const va = new THREE.Vector3(...a), vb = new THREE.Vector3(...b), mid = va.clone().add(vb).multiplyScalar(0.5), d = vb.clone().sub(va), len = d.length();
        st.position.copy(mid); st.scale.set(1, Math.max(0.0001, len * k), 1);
        st.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.normalize()); st.visible = k > 0.001;
      }
      const sO1H1 = stick(), sO1H2 = stick(), sO1Ht = stick(), sO2H3 = stick(), sO2Ht = stick();
      function draw(t) {
        mol.rotation.y = (25 * t) * Math.PI / 180;            // spin 25°/s
        mol.rotation.x = 0.25;
        const shrink = 1 - ease.inOutCubic(seg(t, 2.3, 0.3));  // old bond shrinks to its midpoint
        const drift = ease.inOutCubic(seg(t, 2.6, 0.6));       // proton drifts across
        const grow = ease.inOutCubic(seg(t, 3.2, 0.3));        // new bond grows
        const ht = [lerp(A.Ht[0], HtEnd[0], drift), lerp(A.Ht[1], HtEnd[1], drift), lerp(A.Ht[2], HtEnd[2], drift)];
        atoms.Ht.position.set(...ht);
        // the two remaining molecules relax apart slightly as they become water
        atoms.O1.position.x = A.O1[0] - 0.3 * drift; atoms.H1.position.x = A.H1[0] - 0.3 * drift; atoms.H2.position.x = A.H2[0] - 0.3 * drift;
        const p = (k) => atoms[k].position.toArray();
        place(sO1H1, p("O1"), p("H1"), 1); place(sO1H2, p("O1"), p("H2"), 1); place(sO2H3, p("O2"), p("H3"), 1);
        place(sO1Ht, p("O1"), p("Ht"), shrink); place(sO2Ht, p("O2"), p("Ht"), grow);
        const appear = ease.outCubic(seg(t, 0.25, 0.4)); mol.scale.setScalar(0.001 + 0.999 * appear);
        render();
      }
      onSeek(draw);
    </script>
  </body>
