<!doctype html>
<!--
  motionforge style preview: recipe-top-down
  © 2026 motionforge contributors, MIT
  Signature scenes "step card" + "timer ring" + "swap note": over a locked overhead worktop (the slate
  fallback field, objects drawn in CSS instead of footage) the step card slides up 120 px, the tomato
  step number drops with back.out(1.8) as the knife starts the cut, a 280 px tomato ring sweeps 360 deg
  while the action fast-forwards with "25 MIN" fixed, and one Caveat tip writes on with an arrow.
  Fraunces 800 + Karla + Caveat. Recipe content is a sample.
-->
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/mf-runtime.js"></script>
    <link rel="stylesheet" href="assets/base.css" />
    <style>
      @font-face { font-family: "Fraunces"; font-weight: 800; font-style: normal; font-display: block; src: url("assets/fonts/fraunces-latin-800-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+20AC, U+20BA, U+2122, U+2190-2193, U+2212; }
      @font-face { font-family: "Fraunces"; font-weight: 800; font-style: normal; font-display: block; src: url("assets/fonts/fraunces-latin-ext-800-normal.woff2") format("woff2"); unicode-range: U+0100-0130, U+0132-0151, U+0154-024F, U+1E00-1EFF; }
      @font-face { font-family: "Karla"; font-weight: 600; font-style: normal; font-display: block; src: url("assets/fonts/karla-latin-600-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+20AC, U+20BA, U+2122, U+2190-2193, U+2212; }
      @font-face { font-family: "Karla"; font-weight: 600; font-style: normal; font-display: block; src: url("assets/fonts/karla-latin-ext-600-normal.woff2") format("woff2"); unicode-range: U+0100-0130, U+0132-0151, U+0154-024F, U+1E00-1EFF; }
      @font-face { font-family: "Karla"; font-weight: 700; font-style: normal; font-display: block; src: url("assets/fonts/karla-latin-700-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+20AC, U+20BA, U+2122, U+2190-2193, U+2212; }
      @font-face { font-family: "Karla"; font-weight: 700; font-style: normal; font-display: block; src: url("assets/fonts/karla-latin-ext-700-normal.woff2") format("woff2"); unicode-range: U+0100-0130, U+0132-0151, U+0154-024F, U+1E00-1EFF; }
      @font-face { font-family: "Caveat"; font-weight: 600; font-style: normal; font-display: block; src: url("assets/fonts/caveat-latin-600-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+20AC, U+20BA, U+2122, U+2190-2193, U+2212; }
      @font-face { font-family: "Caveat"; font-weight: 600; font-style: normal; font-display: block; src: url("assets/fonts/caveat-latin-ext-600-normal.woff2") format("woff2"); unicode-range: U+0100-0130, U+0132-0151, U+0154-024F, U+1E00-1EFF; }
      :root { --bg: #2f3437; --card: #fffdf8; --ink: #2e2a24; --acc: #e4572e; --sup: #6b8f4e; --mut: #8a7f70; --mf-grain-opacity: .05; }
      html, body { background: var(--bg); }
      #root { background: radial-gradient(1200px 900px at 50% 0%, #41474b 0%, transparent 70%), var(--bg); }
      #title { position: absolute; left: 60px; top: 262px; font: 800 104px/0.98 "Fraunces", Georgia; color: var(--card); letter-spacing: -0.02em; }
      #title small { display: block; margin-top: 18px; font: 700 28px/1 "Karla", system-ui; letter-spacing: .1em; color: #b9b2a6; text-transform: uppercase; }
      #timer { position: absolute; left: 700px; top: 260px; width: 280px; height: 280px; border-radius: 50%; background: var(--card); box-shadow: 0 10px 24px rgba(0,0,0,.28); }
      #timer svg { position: absolute; inset: 0; }
      #timer .lab { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; font: 700 56px/1 "Karla", system-ui; color: var(--ink); }
      #timer .lab span { margin-top: 8px; font: 700 26px/1 "Karla", system-ui; letter-spacing: .1em; color: var(--mut); }
      #ff { position: absolute; left: 760px; top: 560px; width: 160px; text-align: center; font: 700 28px/1 "Karla", system-ui; letter-spacing: .1em; color: var(--card); }
      #board { position: absolute; left: 60px; top: 640px; width: 690px; height: 500px; border-radius: 44px; overflow: hidden;
        background: linear-gradient(100deg, rgba(255,255,255,.05), rgba(0,0,0,.05)), linear-gradient(180deg, #cfa36d, #be8f58 60%, #b48450);
        box-shadow: 0 22px 34px rgba(0,0,0,.4), inset 0 -6px 0 rgba(90,55,25,.25); }
      .grain { position: absolute; height: 2px; border-radius: 2px; background: rgba(120,80,40,.22); }
      .tom { position: absolute; width: 170px; height: 170px; border-radius: 50%; background: radial-gradient(circle at 38% 34%, #ff8a68 0%, #e4572e 38%, #b8361a 100%); box-shadow: 0 10px 16px rgba(0,0,0,.3); }
      .tom::after { content: ""; position: absolute; left: 62px; top: 62px; width: 46px; height: 46px; background: #4f7a32; clip-path: polygon(50% 0, 60% 38%, 100% 30%, 66% 56%, 84% 100%, 50% 72%, 16% 100%, 34% 56%, 0 30%, 40% 38%); }
      .half { position: absolute; width: 170px; height: 170px; border-radius: 50%; overflow: hidden; box-shadow: 0 8px 12px rgba(0,0,0,.28);
        background: radial-gradient(circle at 50% 50%, #f7b49c 0 14%, #e86a48 15% 28%, #f29a7c 29% 40%, #e4572e 41% 74%, #c2401f 75% 100%); }
      .half i { position: absolute; width: 9px; height: 13px; border-radius: 50%; background: #f6e1a6; }
      #knife { position: absolute; left: 0; top: 0; width: 520px; height: 64px; }
      #knife .blade { position: absolute; left: 0; top: 6px; width: 340px; height: 52px; background: linear-gradient(180deg, #f2f4f5, #b7bdc1); border-radius: 4px 40px 40px 4px / 4px 50px 10px 4px; box-shadow: 0 8px 12px rgba(0,0,0,.3); }
      #knife .hdl { position: absolute; left: 336px; top: 10px; width: 184px; height: 44px; background: #2a2523; border-radius: 10px 22px 22px 10px; box-shadow: 0 8px 12px rgba(0,0,0,.3); }
      #salt { position: absolute; left: 640px; top: 1040px; width: 150px; height: 150px; border-radius: 50%; background: radial-gradient(circle at 50% 50%, #ffffff 0 52%, #e9e5dc 54%, #d9d3c8 70%, #f3f0ea 72%, #cfc9be 100%); box-shadow: 0 12px 18px rgba(0,0,0,.35); }
      #card { position: absolute; left: 60px; width: 880px; top: 1220px; height: 300px; border-radius: 28px; background: var(--card); box-shadow: 0 10px 24px rgba(0,0,0,.28); }
      #num { position: absolute; left: 50px; top: 46px; font: 800 160px/1 "Fraunces", Georgia; color: var(--acc); }
      #stepq { position: absolute; left: 230px; top: 56px; font: 700 28px/1 "Karla", system-ui; letter-spacing: .1em; color: var(--mut); text-transform: uppercase; }
      #step { position: absolute; left: 230px; right: 50px; top: 104px; font: 600 50px/1.18 "Karla", system-ui; color: var(--ink); }
      #note { position: absolute; left: 800px; top: 720px; font: 600 60px/0.95 "Caveat", cursive; color: var(--card); white-space: nowrap; transform: rotate(-4deg); }
      #arrow { position: absolute; left: 650px; top: 690px; width: 160px; height: 120px; overflow: visible; }
      #src { position: absolute; left: 60px; top: 1760px; font: 700 26px/1 "Karla", system-ui; letter-spacing: .1em; color: #9b958c; text-transform: uppercase; }
    </style>
  </head>
  <body>
    <div id="root" class="mf-stage" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1080" data-height="1920">
      <h1 id="title" class="clip" data-start="0" data-duration="4.5" data-track-index="0">Recipe<br />top-down<small>Tomato tart · serves 4</small></h1>
      <div id="timer" class="clip" data-start="0" data-duration="4.5" data-track-index="1">
        <svg viewBox="0 0 280 280"><circle cx="140" cy="140" r="118" fill="none" stroke="#efe7da" stroke-width="14" /><circle id="ringp" cx="140" cy="140" r="118" fill="none" stroke="#e4572e" stroke-width="14" stroke-linecap="round" transform="rotate(-90 140 140)" /></svg>
        <div class="lab">25 MIN<span>PREP</span></div>
      </div>
      <div id="ff" class="clip" data-start="0" data-duration="4.5" data-track-index="2">▶▶ 8×</div>
      <div id="board" class="clip" data-start="0" data-duration="4.5" data-track-index="3"></div>
      <div id="salt" class="clip" data-start="0" data-duration="4.5" data-track-index="4"></div>
      <div id="t1" class="tom clip" style="left:130px;top:700px" data-start="0" data-duration="4.5" data-track-index="5"></div>
      <div id="t2" class="tom clip" style="left:150px;top:900px" data-start="0" data-duration="4.5" data-track-index="6"></div>
      <div id="hA" class="half clip" style="left:450px;top:800px" data-start="0" data-duration="4.5" data-track-index="7"></div>
      <div id="hB" class="half clip" style="left:450px;top:800px" data-start="0" data-duration="4.5" data-track-index="8"></div>
      <div id="t3" class="tom clip" style="left:450px;top:800px" data-start="0" data-duration="4.5" data-track-index="9"></div>
      <div id="knife" class="clip" data-start="0" data-duration="4.5" data-track-index="10"><div class="blade"></div><div class="hdl"></div></div>
      <div id="card" class="clip" data-start="0" data-duration="4.5" data-track-index="11">
        <div id="num">2</div>
        <div id="stepq">400 g · 2 cups</div>
        <div id="step">Halve the tomatoes, salt the cut side</div>
      </div>
      <svg id="arrow" class="clip" viewBox="0 0 160 120" data-start="0" data-duration="4.5" data-track-index="12"><path id="arp" d="M150 60 C110 90 60 90 20 40 M20 40 L22 70 M20 40 L48 48" fill="none" stroke="#fffdf8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /></svg>
      <div id="note" class="clip" data-start="0" data-duration="4.5" data-track-index="13">ripe ones<br />work best</div>
      <div id="src" class="clip" data-start="0" data-duration="4.5" data-track-index="14">Sample recipe · step 2 of 6</div>
    </div>

    <script>
      const DUR = 4.5;
      const tl = MF.timeline("main", DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;   // explicit registration (MF.timeline already does this)
      const r = MF.rng("worktop");
      const board = document.getElementById("board");
      for (let i = 0; i < 16; i++) { const g = document.createElement("div"); g.className = "grain"; Object.assign(g.style, { left: r.range(30, 200) + "px", width: r.range(260, 520) + "px", top: r.range(30, 470) + "px", opacity: r.range(0.4, 1).toFixed(2) }); board.appendChild(g); }
      ["hA", "hB"].forEach((id) => { const h = document.getElementById(id); for (let i = 0; i < 6; i++) { const a = i / 6 * Math.PI * 2 + 0.3; const s = document.createElement("i"); Object.assign(s.style, { left: (80 + Math.cos(a) * 34) + "px", top: (78 + Math.sin(a) * 34) + "px", transform: `rotate(${a}rad)` }); h.appendChild(s); } });
      const ringp = document.getElementById("ringp");
      const C = 2 * Math.PI * 118;
      ringp.setAttribute("stroke-dasharray", `${C} ${C}`);
      const arp = document.getElementById("arp"), AL = arp.getTotalLength();
      arp.style.strokeDasharray = AL;

      tl.fromTo("#title", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.05);
      tl.fromTo("#timer", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.6)" }, 0.25);
      tl.fromTo(["#board", "#salt", ".tom"], { opacity: 0 }, { opacity: 1, duration: 0.3, stagger: 0.05 }, 0.15);
      tl.set(["#hA", "#hB"], { opacity: 0 }, 0);
      // step card slides up 120 px + fade; the number drops 40 px 0.1 s after (same frame the cut starts)
      tl.fromTo("#card", { y: 120, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 0.7);
      tl.fromTo("#num", { y: -40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "back.out(1.8)" }, 0.8);
      tl.fromTo(["#stepq", "#step"], { opacity: 0 }, { opacity: 1, duration: 0.3, stagger: 0.08 }, 0.9);
      // the knife enters from the right and cuts through the third tomato
      tl.fromTo("#knife", { x: 1100, y: 860, rotation: -4 }, { x: 360, y: 856, rotation: 0, duration: 0.4, ease: "power2.out" }, 0.8);
      tl.to("#knife", { x: 270, duration: 0.3, ease: "power1.inOut" }, 1.2);
      tl.set("#t3", { opacity: 0 }, 1.42);
      tl.set(["#hA", "#hB"], { opacity: 1 }, 1.42);
      tl.to("#hA", { x: -50, y: -70, rotation: -12, duration: 0.35, ease: "power2.out" }, 1.45);
      tl.to("#hB", { x: 60, y: 90, rotation: 14, duration: 0.35, ease: "power2.out" }, 1.45);
      tl.to("#knife", { x: 1100, y: 980, duration: 0.45, ease: "power2.in" }, 1.6);
      // fast-forward: the ring sweeps 360 deg linearly while the label stays "25 MIN"
      tl.fromTo("#ff", { opacity: 0 }, { opacity: 1, duration: 0.15 }, 1.9);
      tl.fromTo(ringp, { attr: { "stroke-dashoffset": C } }, { attr: { "stroke-dashoffset": 0 }, duration: 2.0, ease: "none" }, 1.9);
      // salt goes on, sped up
      tl.to("#hA", { x: -40, y: -60, duration: 0.2 }, 2.2);
      tl.to("#salt", { x: -200, y: -170, scale: 0.9, duration: 0.35, ease: "power2.inOut" }, 2.2);
      tl.to("#salt", { x: 0, y: 0, scale: 1, duration: 0.35, ease: "power2.inOut" }, 2.7);
      tl.to(["#hA", "#hB"], { filter: "brightness(1.08) saturate(0.9)", duration: 0.2 }, 2.45);
      // one handwritten tip with an arrow (draws 0.6 s), written on by a clip mask
      tl.fromTo(arp, { strokeDashoffset: AL }, { strokeDashoffset: 0, duration: 0.6, ease: "power1.inOut" }, 3.0);
      tl.fromTo("#note", { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.9, ease: "none" }, 3.15);
      tl.fromTo("#src", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 3.3);
      tl.to("#ff", { opacity: 0, duration: 0.2 }, 3.9);
      tl.seek(0);
    </script>
  </body>
</html>
