  <body>
    <div id="root" class="mf-stage" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1080" data-height="1920">

      <svg id="fig" class="clip" width="1080" height="1920" viewBox="0 0 1080 1920" data-start="0" data-duration="4.5" data-track-index="4"></svg>
      <div id="flash" class="clip" data-start="0" data-duration="4.5" data-track-index="5"></div>
      <div id="chips" class="clip" data-start="0" data-duration="4.5" data-track-index="6">

        <div class="chip" id="c1" style="top:1322px"><span><small>Top speed</small> <b id="n1">36.2</b> KM/H</span></div>
        <div class="chip" id="c2" style="top:1424px"><span><small>Reaction</small> <b id="n2">0.141</b> S</span></div>
      </div>
      <div id="tag" class="clip" data-start="0" data-duration="4.5" data-track-index="7">Athlete hype reel</div>

    <script>
      const DUR = 4.5, NS = "http://www.w3.org/2000/svg";
      const mk = (p, tag, at) => { const e = document.createElementNS(NS, tag); for (const k in at) e.setAttribute(k, at[k]); p.appendChild(e); return e; };
      const D = Math.PI / 180;
      // ---- time remap: live -> ramp 100 -> 25 % over 6 frames -> freeze -> resume ramp 25 -> 100 % in 0.3 s ----
      const F0 = 0.7, F1 = 0.9, U0 = 2.5, U1 = 2.8;
      function speed(t) { if (t < F0) return 1; if (t < F1) return 1 - 0.75 * (t - F0) / (F1 - F0); if (t < U0) return 0; if (t < U1) return 0.25 + 0.75 * (t - U0) / (U1 - U0); return 1; }
      function playT(t) { let s = 0; const n = Math.ceil(t * 120); for (let i = 0; i < n; i++) { const a = i / 120; s += speed(a) * Math.min(1 / 120, t - a); } return s; }
      // ---- live background: stand, crowd, track (natural colour) ----
      const bg = document.getElementById("bg"), rng = MF.rng("athlete-hype-reel");
      const crowd = []; for (let i = 0; i < 900; i++) crowd.push([rng.range(0, 2400), rng.range(120, 1000), rng.pick(["#d9473f", "#f2c14e", "#3a8fd9", "#e8e8e8", "#2f2f38", "#6b7280", "#1f8a5b", "#f08a4b"]), rng.range(10, 18)]);
      const gStand = mk(bg, "g", {}), gTrack = mk(bg, "g", {});
      mk(bg, "rect", { x: 0, y: 0, width: 1080, height: 1920, fill: "#15171c" }); bg.appendChild(gStand); bg.appendChild(gTrack);
      const crowdEls = crowd.map(([x, y, c, s]) => mk(gStand, "rect", { y, width: s, height: s * 1.3, rx: s / 2, fill: c }));
      mk(gStand, "rect", { x: 0, y: 1000, width: 1080, height: 60, fill: "#2a2d34" });
      mk(gTrack, "rect", { x: 0, y: 1060, width: 1080, height: 860, fill: "#b84a32" });
      [1060, 1250, 1480, 1760].forEach((y) => mk(gTrack, "rect", { x: 0, y, width: 1080, height: 8, fill: "rgba(255,255,255,.85)" }));
      const marks = []; for (let i = 0; i < 6; i++) marks.push(mk(gTrack, "rect", { y: 1068, width: 14, height: 852, fill: "rgba(255,255,255,.35)", transform: "skewX(-24)" }));
      const laneNo = mk(gTrack, "text", { y: 1440, "font-family": "Exo 2", "font-weight": 800, "font-size": 140, fill: "rgba(255,255,255,.75)" }); laneNo.textContent = "4";
      function drawBg(p) {
        const off = p * 1300;
        crowdEls.forEach((e, i) => e.setAttribute("x", ((crowd[i][0] - off * 0.35) % 2400 + 2400) % 2400 - 600));
        marks.forEach((e, i) => e.setAttribute("x", ((i * 420 - off) % 2520 + 2520) % 2520 - 600));
        laneNo.setAttribute("x", ((300 - off) % 2400 + 2400) % 2400 - 300);
      }
      // ---- the runner: a vector figure posed from joint angles (0° = straight down, + = forward) ----
      const SKIN = "#8d5a3b", SINGLET = "#c9343b", SHORTS = "#16181d", SHOE = "#f2f2f2";
      function figure(parent, rim) {
        const g = mk(parent, "g", {}), L = {};
        const seg = (k, w, c) => { if (rim) L[k + "_rim"] = mk(g, "line", { stroke: "#2d7bff", "stroke-opacity": 0.4, "stroke-width": w + 16, "stroke-linecap": "round" }); L[k] = mk(g, "line", { stroke: c, "stroke-width": w, "stroke-linecap": "round" }); };
        // draw order: far arm, far leg, torso, head, near leg, near arm
        seg("uaR", 54, "#74482f"); seg("faR", 46, "#74482f"); seg("thR", 92, "#101215"); seg("shR", 66, "#74482f"); seg("ftR", 34, "#d9d9d9");
        seg("tor", 150, SINGLET); seg("shorts", 128, SHORTS); seg("neck", 46, SKIN);
        if (rim) L.head_rim = mk(g, "circle", { fill: "none", stroke: "#2d7bff", "stroke-opacity": 0.4, "stroke-width": 16 });
        L.head = mk(g, "circle", { fill: SKIN }); L.hair = mk(g, "path", { fill: "#1a1210" });
        seg("thL", 94, SHORTS); seg("shL", 68, SKIN); seg("ftL", 36, SHOE); seg("uaL", 56, SKIN); seg("faL", 48, SKIN);
        L.num = mk(g, "text", { "font-family": "Exo 2", "font-weight": 800, "font-size": 64, fill: "#ffffff", "text-anchor": "middle" }); L.num.textContent = "4";
        return { g, L };
      }
      function pose(F, hx, hy, ph, s) {
        const L = F.L, P = (x, y, a, len) => [x + Math.sin(a * D) * len * s, y + Math.cos(a * D) * len * s];
        const set = (k, a, b) => { for (const kk of [k, k + "_rim"]) if (L[kk]) { L[kk].setAttribute("x1", a[0]); L[kk].setAttribute("y1", a[1]); L[kk].setAttribute("x2", b[0]); L[kk].setAttribute("y2", b[1]); L[kk].setAttribute("stroke-width", (+L[k].dataset.w || (L[k].dataset.w = L[k].getAttribute("stroke-width"))) * s + (kk.endsWith("_rim") ? 16 : 0)); } };
        const hip = [hx, hy], neck = P(hx, hy, 166, 300), head = P(neck[0], neck[1], 160, 92);
        const leg = (k, phase) => {
          const th = 52 * Math.sin(phase), bend = 18 + 70 * Math.max(0, Math.cos(phase));
          const knee = P(hip[0], hip[1], th, 250), ank = P(knee[0], knee[1], th - bend, 250), toe = P(ank[0], ank[1], th - bend + 95, 46);
          set("th" + k, hip, knee); set("sh" + k, knee, ank); set("ft" + k, ank, toe);
        };
        const arm = (k, phase) => {
          const ua = -48 * Math.sin(phase), fa = ua + 95;
          const sh = P(neck[0], neck[1], 0, 26), el = P(sh[0], sh[1], ua, 170), wr = P(el[0], el[1], fa, 150);
          set("ua" + k, sh, el); set("fa" + k, el, wr);
        };
        leg("R", ph + Math.PI); arm("R", ph + Math.PI);
        set("tor", P(hip[0], hip[1], 166, 40), P(hip[0], hip[1], 166, 250)); set("shorts", P(hip[0], hip[1], 166, -10), P(hip[0], hip[1], 166, 40));
        set("neck", P(hip[0], hip[1], 166, 270), head);
        for (const k of ["head", "head_rim"]) if (L[k]) { L[k].setAttribute("cx", head[0]); L[k].setAttribute("cy", head[1]); L[k].setAttribute("r", 58 * s); }
        L.hair.setAttribute("d", `M${head[0] - 60 * s} ${head[1] - 6 * s} a${60 * s} ${60 * s} 0 0 1 ${118 * s} ${-14 * s} l${-10 * s} ${22 * s} Z`);
        leg("L", ph); arm("L", ph);
        const c = P(hip[0], hip[1], 166, 160); L.num.setAttribute("x", c[0]); L.num.setAttribute("y", c[1] + 22 * s); L.num.setAttribute("font-size", 64 * s);
      }
      const runner = figure(document.getElementById("fig"), true);
      const endRunner = figure(document.getElementById("endFig"), false);
      const PH0 = 1.25;   // stride phase at the freeze: front knee high, back leg extended
      pose(endRunner, 700, 820, PH0, 0.78);
      const rims = Object.keys(runner.L).filter((k) => k.endsWith("_rim")).map((k) => runner.L[k]);

      function frame(t) {
        const p = playT(t), frozen = t >= F1 && t < U0;
        drawBg(p);
        const pPh = PH0 + (p - playT(F1)) * 11;          // stride frequency ~1.75 Hz of the illustration
        const bob = Math.abs(Math.cos(pPh)) * 14;
        const sc = t >= F1 + 0.05 && t < U0 ? 1 + 0.06 * Math.min(1, 1 - Math.pow(1 - (t - F1 - 0.05) / 0.25, 3)) : 1;
        pose(runner, 700, 1010 - bob, pPh, 1.12 * sc);
        rims.forEach((r) => r.setAttribute("stroke-opacity", frozen ? 0.4 : 0));
        document.getElementById("bg").style.filter = frozen ? "grayscale(1) contrast(1.5) brightness(.8)" : "none";
      }

      const tl = MF.timeline("main", DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      const clock = { t: 0 };
      tl.fromTo(clock, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: () => frame(clock.t) }, 0);
      tl.fromTo(["#tag", "#pos", "#sample"], { opacity: 0 }, { opacity: 1, duration: 0.01 }, 0.05);
      // freeze: duotone + one 30 % white frame + static grain
      tl.set("#tint", { opacity: 1 }, F1); tl.set("#grain", { opacity: 0.08 }, F1);
      tl.set("#flash", { opacity: 0.3 }, F1); tl.set("#flash", { opacity: 0 }, F1 + 1 / 30);
      // name slam behind the body + 2-frame shake
      const SL = F1 + 0.15;
      tl.fromTo("#sur", { opacity: 0, scale: 1.6, filter: "blur(20px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.18, ease: "power4.out" }, SL);
      tl.fromTo("#first", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.18, ease: "power4.out" }, SL + 0.08);
      tl.fromTo("#under", { scaleX: 0 }, { scaleX: 1, duration: 0.25, ease: "power4.out" }, SL + 0.12);
      const sh = MF.rng("slam");
      tl.set("#nameWrap", { x: sh.range(-8, 8), y: sh.range(-8, 8) }, SL + 0.18);
      tl.set("#nameWrap", { x: sh.range(-8, 8), y: sh.range(-8, 8) }, SL + 0.18 + 1 / 30);
      tl.set("#nameWrap", { x: 0, y: 0 }, SL + 0.18 + 2 / 30);
      // chips snap from 120 px left, 0.07 s apart, numbers count 0.4 s
      tl.fromTo(".chip", { opacity: 0, x: -120 }, { opacity: 1, x: 0, duration: 0.16, ease: "power4.out", stagger: 0.07 }, SL + 0.3);
      [[0, 11.02, 2], [1, 36.2, 1], [2, 0.141, 3]].forEach(([i, v, d]) => {
        const o = { v: 0 }, el = document.getElementById("n" + i);
        tl.fromTo(o, { v: i === 0 ? 14 : 0 }, { v, duration: 0.4, ease: "power2.out", onUpdate: () => (el.textContent = o.v.toFixed(d)) }, SL + 0.3 + i * 0.07);
      });
      // resume: graphics cut off hard on the resume frame
      tl.set(["#nameWrap", "#chips", "#tint", "#grain"], { opacity: 0 }, U0);
      // end card
      tl.set("#end", { opacity: 1 }, 3.35);
      tl.set(["#tag", "#pos"], { opacity: 0 }, 3.35);
      tl.fromTo("#end .nm", { opacity: 0, scale: 1.4, filter: "blur(14px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.18, ease: "power4.out", transformOrigin: "left center" }, 3.4);
      tl.fromTo("#end .bar", { scaleX: 0 }, { scaleX: 1, duration: 0.25, ease: "power4.out", transformOrigin: "left center" }, 3.5);
      tl.fromTo("#end .ln", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.2, ease: "power4.out" }, 3.55);
      tl.seek(0);
    </script>
  </body>
</html>
