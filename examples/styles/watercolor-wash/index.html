<!doctype html>
<!--
  motionforge style preview: watercolor-wash
  © 2026 motionforge contributors, MIT
  Signature scene: the bloom reveal. An original painted landscape appears through one wash that spreads
  from a seed point (1.2 s power2.out) along a growing noise-threshold mask; edge darkening (15 %) appears
  0.3 s later, cerulean areas granulate, a glaze deepens the far hills in 0.8 s, and the hand-lettered line
  writes on at 14 chars/s with a seeded ±2 px baseline wobble. Washes are multiplied on the paper (canvas,
  per-pixel, computed from t only). Libre Caslon Display + Kalam + Mulish.
-->
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/mf-runtime.js"></script>
    <link rel="stylesheet" href="assets/base.css" />
    <style>
      /* fonts: @fontsource/libre-caslon-display, @fontsource/kalam, @fontsource/mulish (copied from node_modules/@fontsource/<family>/files/) */
      @font-face { font-family: "Libre Caslon Display"; font-weight: 400; font-style: normal; font-display: block; src: url("assets/fonts/libre-caslon-display-latin-400-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+20AC, U+20BA, U+2122, U+2190-2193, U+2212; }
      @font-face { font-family: "Libre Caslon Display"; font-weight: 400; font-style: normal; font-display: block; src: url("assets/fonts/libre-caslon-display-latin-ext-400-normal.woff2") format("woff2"); unicode-range: U+0100-0130, U+0132-0151, U+0154-024F, U+1E00-1EFF; }
      @font-face { font-family: "Kalam"; font-weight: 700; font-style: normal; font-display: block; src: url("assets/fonts/kalam-latin-700-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+20AC, U+20BA, U+2122, U+2190-2193, U+2212; }
      @font-face { font-family: "Kalam"; font-weight: 700; font-style: normal; font-display: block; src: url("assets/fonts/kalam-latin-ext-700-normal.woff2") format("woff2"); unicode-range: U+0100-0130, U+0132-0151, U+0154-024F, U+1E00-1EFF; }
      @font-face { font-family: "Mulish"; font-weight: 600; font-style: normal; font-display: block; src: url("assets/fonts/mulish-latin-600-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+20AC, U+20BA, U+2122, U+2190-2193, U+2212; }
      @font-face { font-family: "Mulish"; font-weight: 600; font-style: normal; font-display: block; src: url("assets/fonts/mulish-latin-ext-600-normal.woff2") format("woff2"); unicode-range: U+0100-0130, U+0132-0151, U+0154-024F, U+1E00-1EFF; }
      :root { --paper: #FBF8F2; --ink: #3A3A44; --coral: #E2725B; --cer: #6E9FC9; --ochre: #F2D7A6; --mf-grain-opacity: 0.0; }
      html, body { background: var(--paper); }
      #root { background: var(--paper); color: var(--ink); }
      #root::after { display: none; }
      #tooth { position: absolute; inset: 0; width: 1080px; height: 1920px; }
      #title { position: absolute; left: 0; right: 0; top: 270px; text-align: center; font: 400 136px/1.02 "Libre Caslon Display"; letter-spacing: -0.01em; }
      #art { position: absolute; left: 90px; top: 560px; width: 900px; height: 800px; mix-blend-mode: multiply; }
      #hand { position: absolute; left: 0; right: 0; top: 1395px; text-align: center; font: 700 92px/1.1 "Kalam"; color: var(--ink); white-space: nowrap; }
      #hand span { display: inline-block; }
      #strip { position: absolute; left: 230px; right: 230px; top: 1560px; height: 84px; }
      #strip svg { position: absolute; inset: 0; width: 620px; height: 84px; }
      #strip div { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font: 600 44px/1 "Mulish"; color: var(--ink); }
    </style>
  </head>
  <body>
    <div id="root" class="mf-stage light" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1080" data-height="1920">
      <svg id="tooth" viewBox="0 0 1080 1920">
        <filter id="tf" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="3" seed="2" result="n" />
          <feDiffuseLighting in="n" surfaceScale="1.6" lighting-color="#fff"><feDistantLight azimuth="225" elevation="55" /></feDiffuseLighting>
          <feColorMatrix values="0 0 0 0 .5  0 0 0 0 .47  0 0 0 0 .42  -1 0 0 0 .9" /></filter>
        <filter id="ck" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.0025 0.004" numOctaves="2" seed="8" />
          <feColorMatrix values="0 0 0 0 .4  0 0 0 0 .37  0 0 0 0 .3  0 0 0 .09 -.02" /></filter>
        <rect width="1080" height="1920" filter="url(#tf)" opacity=".18" />
        <rect width="1080" height="1920" filter="url(#ck)" />
      </svg>
      <h1 id="title" class="clip" data-start="0" data-duration="4.5" data-track-index="0">Watercolor<br />wash</h1>
      <canvas id="art" class="clip" width="450" height="400" data-start="0" data-duration="4.5" data-track-index="1"></canvas>
      <div id="hand" class="clip" data-start="0" data-duration="4.5" data-track-index="2">slow mornings</div>
      <div id="strip" class="clip" data-start="0" data-duration="4.5" data-track-index="3">
        <svg viewBox="0 0 620 84"><filter id="sb"><feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="3" result="n" /><feDisplacementMap in="SourceGraphic" in2="n" scale="16" /></filter>
          <rect x="10" y="8" width="600" height="68" rx="10" fill="#F2D7A6" opacity=".8" filter="url(#sb)" /></svg>
        <div>painted, not printed</div>
      </div>
    </div>

    <script>
      const DUR = 4.5, W = 450, H = 400;
      const ctx = document.getElementById("art").getContext("2d"), img = ctx.createImageData(W, H);
      // seeded value noise (two octaves)
      function vnoise(seed, cell) {
        const r = MF.rng(seed), gw = Math.ceil(W / cell) + 2, gh = Math.ceil(H / cell) + 2, g = new Float32Array(gw * gh).map(() => r());
        const sm = (x) => x * x * (3 - 2 * x);
        return (x, y) => { const gx = x / cell, gy = y / cell, x0 = Math.floor(gx), y0 = Math.floor(gy), fx = sm(gx - x0), fy = sm(gy - y0);
          const a = g[y0 * gw + x0], b = g[y0 * gw + x0 + 1], c = g[(y0 + 1) * gw + x0], d = g[(y0 + 1) * gw + x0 + 1];
          return (a + (b - a) * fx) + ((c + (d - c) * fx) - (a + (b - a) * fx)) * fy; };
      }
      const n1 = vnoise("w1", 40), n2 = vnoise("w2", 11), n3 = vnoise("w3", 70), gr = MF.rng("gran");
      const N = new Float32Array(W * H), D = new Float32Array(W * H), GR = new Float32Array(W * H), L = [];
      const hex = (h) => [parseInt(h.slice(1, 3), 16) / 255, parseInt(h.slice(3, 5), 16) / 255, parseInt(h.slice(5, 7), 16) / 255];
      const SEED = [140, 120];
      // layers: [colour, alpha, signed inside fn (>0 inside, ~distance in px)]
      const horizon = (x) => 245 + 18 * Math.sin(x / 70) + 10 * Math.sin(x / 23 + 1);
      const far = (x) => 215 + 28 * Math.sin(x / 55 + 2) + 12 * Math.sin(x / 17);
      const LAYERS = [
        { c: hex("#6E9FC9"), a: 0.55, f: (x, y) => Math.min(horizon(x) - y + (n3(x, y) - 0.5) * 30, Math.hypot(x - 320, y - 120) - 62), gran: 1 },
        { c: hex("#F2D7A6"), a: 0.85, f: (x, y) => y - horizon(x) + 6 },
        { c: hex("#6E9FC9"), a: 0.45, f: (x, y) => Math.min(y - far(x), horizon(x) + 30 - y), gran: 1, glaze: [2.3, 0.8] },
        { c: hex("#E2725B"), a: 0.8, f: (x, y) => 52 - Math.hypot(x - 320, y - 120) + (n2(x, y) - 0.5) * 10 },
        { c: hex("#E9B97E"), a: 0.6, f: (x, y) => Math.min(y - horizon(x) - 40 - 20 * Math.sin(x / 40), 400 - y) },
      ];
      for (let y = 0, i = 0; y < H; y++) for (let x = 0; x < W; x++, i++) {
        N[i] = 0.65 * n1(x, y) + 0.35 * n2(x, y);
        D[i] = Math.hypot(x - SEED[0], y - SEED[1]);
        GR[i] = gr();
      }
      LAYERS.forEach((ly) => { ly.S = new Float32Array(W * H); for (let y = 0, i = 0; y < H; y++) for (let x = 0; x < W; x++, i++) ly.S[i] = Math.min(ly.f(x, y), Math.min(x, W - x, y, H - y) - 14 - N[i] * 26) + (N[i] - 0.5) * 14; });
      const seg = (t, a, d) => Math.max(0, Math.min(1, (t - a) / d));
      function paint(t) {
        const k = seg(t, 0.45, 1.2), R = 430 * (1 - Math.pow(1 - k, 2)), rim = 0.15 * seg(t, 0.75, 0.5), px = img.data;
        for (let i = 0, p = 0; i < W * H; i++, p += 4) {
          let fr = 1, fg = 1, fb = 1;
          const front = R - D[i] * (0.75 + 0.6 * N[i]);   // growing noise-threshold mask
          if (front > 0) {
            const frontEdge = front < 10 ? 1 : 0;
            for (let l = 0; l < LAYERS.length; l++) {
              const ly = LAYERS[l], s = ly.S[i];
              if (s <= 0) continue;
              let a = ly.a * (s < 3 ? s / 3 : 1);
              if (s < 7 || frontEdge) a = Math.min(1, a * (1 + rim * 3));   // pigment pools at the rims
              a *= 0.72 + 0.56 * N[i];
              if (ly.gran) a *= 0.85 + 0.3 * GR[i];
              if (ly.glaze) a *= 1 + 0.8 * seg(t, ly.glaze[0], ly.glaze[1]);
              a = Math.min(1, a);
              fr *= 1 - a + a * ly.c[0]; fg *= 1 - a + a * ly.c[1]; fb *= 1 - a + a * ly.c[2];
            }
          }
          px[p] = fr * 255; px[p + 1] = fg * 255; px[p + 2] = fb * 255; px[p + 3] = 255;
        }
        ctx.putImageData(img, 0, 0);
      }
      // hand lettering: brush mask left to right at 14 chars/s, seeded ±2 px baseline wobble
      const hand = document.getElementById("hand"), wr = MF.rng("kalam");
      hand.innerHTML = [...hand.textContent].map((c) => `<span style="transform: translateY(${wr.range(-2, 2).toFixed(1)}px)">${c === " " ? "&nbsp;" : c}</span>`).join("");
      const HW = { k: 0 };
      const handMask = () => { const p = HW.k * 110 - 5; hand.style.webkitMaskImage = `linear-gradient(90deg, #000 ${p}%, transparent ${p + 6}%)`; };
      handMask();

      const tl = MF.timeline("main", DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;   // explicit registration (MF.timeline already does this; keeps the linter happy)
      const P = { t: 0 };
      tl.fromTo(P, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: () => paint(P.t) }, 0);
      tl.fromTo("#title", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "power2.out" }, 0.05);
      tl.fromTo("#art", { scale: 1 }, { scale: 1.025, duration: 4.4, ease: "none" }, 0);   // slow 2-3 % push
      tl.fromTo(HW, { k: 0 }, { k: 1, duration: 13 / 14, ease: "none", onUpdate: handMask }, 2.0);
      tl.fromTo("#strip", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 3.0);
      paint(0);
      tl.seek(0);
    </script>
  </body>
</html>
