<!doctype html>
<!--
  motionforge style preview: kinetic-captions
  © 2026 motionforge contributors, MIT
  Three phrases, hard cuts between them, one accent word per phrase flipping on its "stress".
  The cue times stand in for word timings from tools/word_timings.py.
-->
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/mf-runtime.js"></script>
    <link rel="stylesheet" href="assets/base.css" />
    <style>
      .phrase { position: absolute; left: 60px; right: 60px; top: 300px; bottom: 380px; display: flex; flex-direction: column; justify-content: center; text-align: center; }
      .ln { display: block; font: 800 168px/1.0 var(--mf-font-display); letter-spacing: -0.045em; }
      .w { display: inline-block; margin: 0 0.1em; }
      .w.serif { font-family: var(--mf-font-accent); font-style: italic; font-weight: 400; letter-spacing: -0.01em; font-size: 1.12em; padding-right: 0.06em; }
      .dim { color: rgba(255, 255, 255, 0.35); }
      #bloom { position: absolute; left: 140px; top: 560px; width: 800px; height: 800px; border-radius: 50%;
               background: radial-gradient(circle, rgba(200, 245, 58, 0.10) 0%, transparent 65%); }
      #eyebrow { top: 300px; }
      #bar { position: absolute; left: 340px; width: 400px; top: 1500px; height: 8px; border-radius: 4px; background: rgba(255,255,255,.12); overflow: hidden; }
      #bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; background: var(--mf-accent); transform-origin: left; }
    </style>
  </head>
  <body>
    <div id="root" class="mf-stage" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1080" data-height="1920">
      <div id="bloom" class="clip" data-start="0" data-duration="4.5" data-track-index="0"></div>
      <div id="eyebrow" class="eyebrow clip" data-start="0" data-duration="4.5" data-track-index="1">Style preview</div>
      <div id="p1" class="phrase clip" data-start="0" data-duration="4.5" data-track-index="2">
        <span class="ln"><span class="w">Every</span></span>
        <span class="ln"><span class="w">word</span></span>
        <span class="ln"><span class="w" id="hit1">lands</span></span>
      </div>
      <div id="p2" class="phrase clip" data-start="0" data-duration="4.5" data-track-index="3">
        <span class="ln"><span class="w">on the</span></span>
        <span class="ln"><span class="w serif" id="hit2">beat.</span></span>
      </div>
      <div id="p3" class="phrase clip" data-start="0" data-duration="4.5" data-track-index="4">
        <span class="ln"><span class="w dim" id="k1">Kinetic</span></span>
        <span class="ln"><span class="w serif dim" id="hit3">captions</span></span>
      </div>
      <div id="bar" class="clip" data-start="0" data-duration="4.5" data-track-index="5"><i></i></div>
    </div>

    <script>
      const DUR = 4.5;
      const tl = MF.timeline("main", DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;   // explicit registration (MF.timeline already does this; keeps the linter happy)
      const ACC = "#c8f53a";
      const slam = (el, at) => tl.fromTo(el, { opacity: 0, scale: 0.8, y: 60, filter: "blur(14px)" }, { opacity: 1, scale: 1, y: 0, filter: "blur(0px)", duration: 0.18, ease: "back.out(1.7)" }, at);
      const hit = (el, at) => {
        tl.to(el, { color: ACC, duration: 0.04 }, at);
        tl.fromTo(el, { scale: 1 }, { scale: 1.06, duration: 0.06, yoyo: true, repeat: 1, ease: "power1.out" }, at);
      };
      tl.fromTo("#eyebrow", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.05);
      tl.fromTo("#bloom", { x: -60, y: 40 }, { x: 60, y: -40, duration: DUR, ease: "sine.inOut" }, 0);
      tl.fromTo("#bar i", { scaleX: 0 }, { scaleX: 1, duration: DUR, ease: "none" }, 0);

      // phrase 1 — words slam in on their syllables, "lands" flips to the accent
      const p1 = gsap.utils.toArray("#p1 .w");
      tl.set(["#p2", "#p3"], { autoAlpha: 0 }, 0);
      slam(p1[0], 0.15); slam(p1[1], 0.42); slam(p1[2], 0.7);
      hit("#hit1", 0.9);
      tl.fromTo("#p1", { scale: 1 }, { scale: 1.04, duration: 1.4, ease: "none" }, 0.15);
      // phrase 2 — old words leave upward, new ones arrive
      tl.to("#p1", { y: -80, autoAlpha: 0, duration: 0.2, ease: "power2.in" }, 1.6);
      tl.set("#p2", { autoAlpha: 1 }, 1.75);
      const p2 = gsap.utils.toArray("#p2 .w");
      slam(p2[0], 1.75); slam(p2[1], 2.0);
      hit("#hit2", 2.12);
      // phrase 3 — hard cut: the full line shows dim, words light up as they are "spoken"
      tl.set("#p2", { autoAlpha: 0 }, 2.85);
      tl.set("#p3", { autoAlpha: 1 }, 2.85);
      tl.fromTo("#p3", { scale: 0.96 }, { scale: 1.02, duration: 1.6, ease: "none" }, 2.85);
      tl.to("#k1", { color: "#ffffff", duration: 0.05 }, 2.95);
      tl.fromTo("#k1", { y: 20 }, { y: 0, duration: 0.16, ease: "back.out(1.7)" }, 2.95);
      tl.to("#hit3", { color: ACC, duration: 0.05 }, 3.3);
      tl.fromTo("#hit3", { y: 20, scale: 1 }, { y: 0, scale: 1.06, duration: 0.1, ease: "power1.out" }, 3.3);
      tl.to("#hit3", { scale: 1, duration: 0.1 }, 3.4);
      tl.seek(0);
    </script>
  </body>
</html>
