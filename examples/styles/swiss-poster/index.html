<!doctype html>
<!--
  motionforge style preview: swiss-poster
  © 2026 motionforge contributors, MIT
  Invisible 6-column structure (x 80..1000, 40 px gutters); moves only along column axes,
  mask reveals (clip-path inset), expo eases, no bounce.
-->
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/mf-runtime.js"></script>
    <link rel="stylesheet" href="assets/base.css" />
    <style>
      :root { --paper: #f2f0eb; --ink: #111111; --red: #e2231a; --mf-grain-opacity: 0.03; }
      html, body { background: var(--paper); }
      #root { background: var(--paper); color: var(--ink); }
      #root::after { display: none; }
      .t { position: absolute; left: 80px; font-family: var(--mf-font-display); color: var(--ink); }
      .huge { font-weight: 800; font-size: 270px; line-height: 0.86; letter-spacing: -0.06em; white-space: nowrap; }
      .small { font-weight: 500; font-size: 40px; line-height: 1.3; letter-spacing: -0.01em; }
      .label { font-weight: 700; font-size: 30px; letter-spacing: 0.02em; }
      #meta { top: 230px; }
      #meta2 { top: 230px; left: 580px; }
      #w1 { top: 360px; }
      #w2 { top: 600px; }
      #block { position: absolute; left: 580px; top: 960px; width: 500px; height: 620px; background: var(--red); }
      #num { position: absolute; left: 600px; top: 1010px; font: 800 400px/0.8 var(--mf-font-display); letter-spacing: -0.07em; color: var(--paper); font-variant-numeric: tabular-nums; }
      #body { top: 980px; width: 440px; }
      #rule { position: absolute; left: 80px; top: 920px; width: 920px; height: 10px; background: var(--ink); transform-origin: left; }
      #foot { top: 1540px; width: 440px; }
      #dot { position: absolute; left: 80px; top: 1440px; width: 72px; height: 72px; background: #1f4bb8; }
    </style>
  </head>
  <body>
    <div id="root" class="mf-stage" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1080" data-height="1920">
      <div id="meta" class="t label clip" data-start="0" data-duration="4.5" data-track-index="0">Style catalogue<br />motionforge</div>
      <div id="meta2" class="t label clip" data-start="0" data-duration="4.5" data-track-index="1">6 columns, 40 px gutters<br />Flat colour, no shadows</div>
      <div id="w1" class="t huge clip" data-start="0" data-duration="4.5" data-track-index="2">Swiss</div>
      <div id="w2" class="t huge clip" data-start="0" data-duration="4.5" data-track-index="3">Poster</div>
      <div id="rule" class="clip" data-start="0" data-duration="4.5" data-track-index="4"></div>
      <div id="block" class="clip" data-start="0" data-duration="4.5" data-track-index="5"></div>
      <div id="num" class="clip" data-start="0" data-duration="4.5" data-track-index="6">06</div>
      <div id="body" class="t small clip" data-start="0" data-duration="4.5" data-track-index="7">Clarity so strong it becomes the decoration.</div>
      <div id="dot" class="clip" data-start="0" data-duration="4.5" data-track-index="8"></div>
      <div id="foot" class="t label clip" data-start="0" data-duration="4.5" data-track-index="9">Grotesque type<br />One red block<br />No shadows</div>
    </div>

    <script>
      const DUR = 4.5;
      const tl = MF.timeline("main", DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;   // explicit registration (MF.timeline already does this; keeps the linter happy)
      const reveal = (sel, at, d = 0.4) => tl.fromTo(sel, { clipPath: "inset(0% 0% 100% 0%)", y: 60 }, { clipPath: "inset(0% 0% 0% 0%)", y: 0, duration: d, ease: "expo.out" }, at);
      reveal("#meta", 0.05, 0.35);
      reveal("#meta2", 0.15, 0.35);
      reveal("#w1", 0.25, 0.5);
      reveal("#w2", 0.5, 0.5);
      tl.fromTo("#rule", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "expo.inOut" }, 0.85);
      tl.fromTo("#block", { x: 520 }, { x: 0, duration: 0.3, ease: "expo.out" }, 1.25);
      tl.fromTo("#num", { clipPath: "inset(100% 0% 0% 0%)", y: -80 }, { clipPath: "inset(0% 0% 0% 0%)", y: 0, duration: 0.45, ease: "expo.out" }, 1.5);
      reveal("#body", 1.7, 0.4);
      tl.fromTo("#dot", { x: -160 }, { x: 0, duration: 0.25, ease: "expo.out" }, 2.05);
      reveal("#foot", 2.2, 0.4);
      // the giant word slides along its row; the red block snaps to the right edge column
      tl.to("#w2", { x: -40, duration: 0.35, ease: "expo.inOut" }, 2.9);
      tl.to("#block", { y: -40, height: 660, duration: 0.25, ease: "expo.out" }, 2.95);
      tl.to("#num", { y: -40, duration: 0.25, ease: "expo.out" }, 2.95);
      tl.to("#w2", { x: 0, duration: 0.35, ease: "expo.inOut" }, 3.7);
      tl.seek(0);
    </script>
  </body>
</html>
