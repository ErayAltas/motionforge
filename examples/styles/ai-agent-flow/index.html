<!doctype html>
<!--
  motionforge style preview: ai-agent-flow
  © 2026 motionforge contributors, MIT
  Signature scenes "handoff pulse" + "fan-out" + "trace strip": nodes pop in flow order, idle edges sit
  dashed in grey, the planner fans three violet pulses out to tool chips (0.12 s stagger), ink follows
  each pulse, receiving nodes bump, result labels type at 24 chars/s, then the results hand off to the
  writer. Only one violet node at a time. Instrument Sans + Martian Mono. Tool names and results are
  fictional examples.
-->
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/mf-runtime.js"></script>
    <link rel="stylesheet" href="assets/base.css" />
    <style>
      /* fonts:begin */
      @font-face { font-family: "Instrument Sans"; font-style: normal; font-weight: 500; font-display: block; src: url("assets/fonts/instrument-sans-latin-500-normal.woff2") format("woff2"); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
      @font-face { font-family: "Instrument Sans"; font-style: normal; font-weight: 500; font-display: block; src: url("assets/fonts/instrument-sans-latin-ext-500-normal.woff2") format("woff2"); unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }
      @font-face { font-family: "Instrument Sans"; font-style: normal; font-weight: 700; font-display: block; src: url("assets/fonts/instrument-sans-latin-700-normal.woff2") format("woff2"); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
      @font-face { font-family: "Instrument Sans"; font-style: normal; font-weight: 700; font-display: block; src: url("assets/fonts/instrument-sans-latin-ext-700-normal.woff2") format("woff2"); unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }
      @font-face { font-family: "Martian Mono"; font-style: normal; font-weight: 500; font-display: block; src: url("assets/fonts/martian-mono-latin-500-normal.woff2") format("woff2"); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
      @font-face { font-family: "Martian Mono"; font-style: normal; font-weight: 500; font-display: block; src: url("assets/fonts/martian-mono-latin-ext-500-normal.woff2") format("woff2"); unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }
      /* fonts:end */
      :root { --paper: #eef1ec; --node: #ffffff; --ink: #15201b; --acc: #6b3cf0; --sup: #8a9a90; --mf-grain-opacity: .04;
        --disp: "Instrument Sans", system-ui, sans-serif; --mono: "Martian Mono", ui-monospace, monospace; }
      html, body { background: var(--paper); }
      #root { background: var(--paper); color: var(--ink); }
      #root::before { mix-blend-mode: multiply; }
      #root::after { background: radial-gradient(ellipse at 50% 50%, transparent 62%, rgba(21,32,27,.06) 100%); }
      #title { position: absolute; left: 70px; top: 250px; font: 700 104px/1 var(--disp); letter-spacing: -0.02em; }
      #title span { color: var(--acc); }
      #sub { position: absolute; left: 74px; top: 372px; font: 500 26px/1 var(--mono); color: var(--sup); }
      #edges { position: absolute; left: 0; top: 0; }
      .n { position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; background: var(--node);
        border: 3px solid var(--ink); box-shadow: 0 6px 0 rgba(21,32,27,.12); }
      .n .role { font: 500 20px/1 var(--mono); letter-spacing: .1em; color: var(--sup); }
      .n .id { font: 500 30px/1 var(--mono); color: var(--ink); }
      .agent { border-radius: 999px; width: 340px; height: 104px; }
      .tool { border-radius: 16px; width: 290px; height: 96px; }
      .drum { width: 300px; height: 104px; border-radius: 150px / 26px; }
      .res { position: absolute; font: 500 24px/1 var(--mono); color: var(--ink); white-space: pre; }
      #log { position: absolute; left: 70px; top: 1300px; width: 940px; height: 300px; background: var(--node); border: 3px solid var(--ink); border-radius: 22px;
        box-shadow: 0 6px 0 rgba(21,32,27,.12); padding: 26px 30px; }
      #log .hd { font: 500 20px/1 var(--mono); letter-spacing: .1em; color: var(--sup); margin-bottom: 18px; }
      .ln { position: relative; font: 500 25px/44px var(--mono); color: var(--sup); white-space: pre; padding-left: 18px; }
      .ln.cur { color: var(--acc); }
      .ln.cur::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 5px; border-radius: 3px; background: var(--acc); }
      .ln.done { color: var(--ink); }
    </style>
  </head>
  <body>
    <div id="root" class="mf-stage" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1080" data-height="1920">
      <h1 id="title" class="clip" data-start="0" data-duration="4.5" data-track-index="0">AI agent <span>flow</span></h1>
      <div id="sub" class="clip" data-start="0" data-duration="4.5" data-track-index="1">example workflow · 3 tools</div>
      <svg id="edges" class="clip" width="1080" height="1920" viewBox="0 0 1080 1920" data-start="0" data-duration="4.5" data-track-index="2"></svg>
      <div id="graph" class="clip" data-start="0" data-duration="4.5" data-track-index="3"></div>
      <div id="log" class="clip" data-start="0" data-duration="4.5" data-track-index="4">
        <div class="hd">TRACE</div>
        <div class="ln" id="l0">planner  split task into 3 calls</div>
        <div class="ln" id="l1">→ search_docs   12 docs</div>
        <div class="ln" id="l2">→ run_query     3 rows</div>
        <div class="ln" id="l3">→ fetch_page    200 OK</div>
        <div class="ln" id="l4">writer   draft reply · 148 words</div>
      </div>
    </div>

    <script>
      const DUR = 4.5, NS = "http://www.w3.org/2000/svg", VIOLET = "#6b3cf0", INK = "#15201b";
      // nodes: id, class, role, label, centre x, centre y
      const NODES = [
        ["planner", "agent", "AGENT", "planner", 540, 520],
        ["t0", "tool", "TOOL", "search_docs", 200, 770],
        ["t1", "tool", "TOOL", "run_query", 540, 770],
        ["t2", "tool", "TOOL", "fetch_page", 880, 770],
        ["writer", "agent", "AGENT", "writer", 540, 1020],
        ["mem", "drum", "MEMORY", "notes", 540, 1200],
      ];
      const graph = document.getElementById("graph");
      const W = { agent: [340, 104], tool: [290, 96], drum: [300, 104] };
      NODES.forEach(([id, cls, role, label, x, y]) => {
        const d = document.createElement("div");
        d.className = "n " + cls; d.id = id;
        const [w, h] = W[cls];
        Object.assign(d.style, { left: x - w / 2 + "px", top: y - h / 2 + "px" });
        d.innerHTML = `<span class="role">${role}</span><span class="id">${label}</span>`;
        graph.appendChild(d);
      });
      // orthogonal edges with 24 px corners
      const svg = document.getElementById("edges");
      const R = 24;
      function down(x1, y1, x2, y2, ym) {
        if (x1 === x2) return `M${x1} ${y1} V${y2}`;
        const s = x2 > x1 ? 1 : -1;
        return `M${x1} ${y1} V${ym - R} Q${x1} ${ym} ${x1 + s * R} ${ym} H${x2 - s * R} Q${x2} ${ym} ${x2} ${ym + R} V${y2}`;
      }
      const EDGES = {
        p0: down(540, 572, 200, 722, 640), p1: down(540, 572, 540, 722, 640), p2: down(540, 572, 880, 722, 640),
        w0: down(200, 818, 540, 968, 900), w1: down(540, 818, 540, 968, 900), w2: down(880, 818, 540, 968, 900),
        m: down(540, 1072, 540, 1148, 1110),
      };
      const mk = (tag, at) => { const e = document.createElementNS(NS, tag); for (const k in at) e.setAttribute(k, at[k]); svg.appendChild(e); return e; };
      const E = {};
      for (const k in EDGES) {
        const idle = mk("path", { d: EDGES[k], fill: "none", stroke: "#8a9a90", "stroke-width": 4, "stroke-dasharray": "10 8", opacity: 0 });
        const ink = mk("path", { d: EDGES[k], fill: "none", stroke: INK, "stroke-width": 4, "stroke-linecap": "round" });
        const L = ink.getTotalLength();
        ink.setAttribute("stroke-dasharray", `${L} ${L}`); ink.setAttribute("stroke-dashoffset", L);
        const head = mk("path", { d: "M-10 -12 L0 4 L10 -12", fill: "none", stroke: INK, "stroke-width": 4, "stroke-linecap": "round", "stroke-linejoin": "round", opacity: 0 });
        const end = ink.getPointAtLength(L); head.setAttribute("transform", `translate(${end.x} ${end.y})`);
        const dots = [0, 1, 2, 3, 4].map((j) => mk("circle", { r: 7 - j * 1.2, fill: VIOLET, opacity: 0 }));
        E[k] = { idle, ink, head, L, dots };
      }
      const res = {};
      [["t0", "12 docs"], ["t1", "3 rows"], ["t2", "200 OK"]].forEach(([id, txt], i) => {
        const d = document.createElement("div"); d.className = "res"; d.id = "res" + i;
        const x = [200, 540, 880][i];
        Object.assign(d.style, { left: x + 16 + "px", top: "838px" });
        graph.appendChild(d); res[i] = { el: d, txt };
      });

      const tl = MF.timeline("main", DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.fromTo("#title", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.05);
      tl.fromTo("#sub", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.25);
      NODES.forEach(([id], i) => tl.fromTo("#" + id, { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.6)" }, 0.25 + i * 0.07));
      tl.to(Object.values(E).map((e) => e.idle), { opacity: 1, duration: 0.3 }, 0.6);
      tl.fromTo("#log", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.75);
      tl.fromTo(".ln", { opacity: 0 }, { opacity: 0.35, duration: 0.15, stagger: 0.03 }, 0.8);

      // a pulse: violet dot + fading trail along the edge, ink drawn behind it, receiver bumps
      function pulse(key, at, to, dur = 0.6) {
        const e = E[key], p = { v: 0 };
        tl.fromTo(p, { v: 0 }, { v: 1, duration: dur, ease: "power1.inOut", onUpdate: () => {
          const s = p.v * e.L;
          e.ink.setAttribute("stroke-dashoffset", e.L - s);
          e.dots.forEach((d, j) => {
            const sj = Math.max(0, s - j * 26), pt = e.ink.getPointAtLength(sj);
            d.setAttribute("cx", pt.x); d.setAttribute("cy", pt.y);
            d.setAttribute("opacity", p.v > 0 && p.v < 1 ? (1 - j * 0.2) : 0);
          });
        } }, at);
        tl.to(e.head, { opacity: 1, duration: 0.05 }, at + dur - 0.05);
        if (to) tl.fromTo("#" + to, { scale: 1 }, { scale: 1.06, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, at + dur);
      }
      const ring = (id, at) => tl.to("#" + id, { borderColor: VIOLET, boxShadow: "0 0 0 6px rgba(107,60,240,.18), 0 6px 0 rgba(21,32,27,.12)", duration: 0.2 }, at);
      const unring = (id, at) => tl.to("#" + id, { borderColor: INK, boxShadow: "0 6px 0 rgba(21,32,27,.12)", duration: 0.2 }, at);
      const cur = (i, at) => { tl.set("#l" + i, { className: "ln cur", opacity: 1 }, at); if (i > 0) tl.set("#l" + (i - 1), { className: "ln done", opacity: 1 }, at); };

      ring("planner", 1.05); cur(0, 1.1);
      ["p0", "p1", "p2"].forEach((k, i) => pulse(k, 1.25 + i * 0.12, "t" + i));
      unring("planner", 1.9);
      [0, 1, 2].forEach((i) => {
        const at = 1.9 + i * 0.12, r = res[i], ty = { n: 0 };
        tl.fromTo(ty, { n: 0 }, { n: r.txt.length, duration: r.txt.length / 24, ease: "none", onUpdate: () => { r.el.textContent = r.txt.slice(0, Math.round(ty.n)); } }, at);
        cur(i + 1, at);
      });
      ["w0", "w1", "w2"].forEach((k, i) => pulse(k, 2.55 + i * 0.12, i === 2 ? "writer" : null));
      ring("writer", 3.35); cur(4, 3.35);
      pulse("m", 3.6, "mem", 0.45);
      tl.seek(0);
    </script>
  </body>
</html>
